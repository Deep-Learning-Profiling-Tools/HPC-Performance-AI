# Registered inputs of branson (schema hpcperf-inputs-1), selected through HPCPERF_BRANSON_INPUT=<id> in run.sh
# (tools/inputs/README.md). Without the variable run.sh behaves as before.
schema: hpcperf-inputs-1
benchmark: branson
level: 2
selector: HPCPERF_BRANSON_INPUT
default_input: hohlraum-single-node
entry:
  kind: run.sh
  path: level2/branson/run.sh
  backend_arg: CUDA
timing:
  scope: 'Branson''s own ''Total transport'' timer: the sum of the per-step event-based GPU transport phases (source,
    transport, census); mesh setup and I/O are outside (''Total:'' is the whole run)'
  kind: total
  unit: s
  regex: '^Total transport: (?P<value>[0-9.eE+-]+)'
  select: only
baseline:
  method: Branson prints per-step conservation diagnostics and the photons-per-second FOM; validate.sh runs upstream's
    unit tests and a small deck comparison. The registry records the transported photon count (required; verified by
    the check against the deck''s frozen CPU-only reference) and the FOM (diagnostic).
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: photons_transported
    role: required
    regex: '^Total Photons transported: (?P<value>\d+)'
    select: last
    compare:
      rule: record
  - name: fom_photons_per_s
    role: diagnostic
    regex: '^Photons Per Second \(FOM\): (?P<value>[0-9.eE+-]+)'
    select: last
    compare:
      rule: record
  - name: steps_done
    role: required
    regex: '^Step: (?P<value>\d+)\s'
    select: last
    compare:
      rule: exact
coverage:
  status: MULTI_INPUT
  reason: >-
    four upstream decks that enable the GPU transporter (use_gpu_transporter TRUE): the single-node and
    multi-node 3D hohlraums, the load-balance hohlraum and the marshak wave (validate.sh physics run).
    hot_zone_input.xml and cube_decomp_test.xml do not enable the GPU transporter and abort in this
    build at the first step (Insist: 'CUDA/HIP error synchronizing after source kernel'; cause not
    established) -- both attempts are kept as unregistered records in the rollout measurements
  upstream_inputs_not_added:
  - inputs/hot_zone_input.xml and inputs/cube_decomp_test.xml (CPU-transporter decks; abort in the GPU build, see reason)
  - inputs/marshak_wave_dd.xml (100-photon domain-decomposition smoke deck; on one rank it degenerates to the replicated marshak deck)
  - inputs/big_cube.xml (no photon source of its own; used by the upstream helper scripts)
inputs:
- id: hohlraum-single-node
  case: 3d-hohlraum
  variant: default
  source:
    kind: upstream-file
    upstream:
      repo: lanl/branson
      version: see level2/<app>/README.md (Upstream commit)
      path: 'inputs/3D_hohlraum_single_node.xml (upstream documented single-node problem: 10 M photons, 5 steps)'
  params:
    deck: inputs/3D_hohlraum_single_node.xml
    photons: 10000000
    t_stop: 0.05
  env:
    HPCPERF_BRANSON_DECK: inputs/3D_hohlraum_single_node.xml
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - inputs/3D_hohlraum_single_node.xml
  input_form: file
- id: marshak-wave-replicated
  case: marshak-wave
  variant: case
  source:
    kind: upstream-file
    upstream:
      repo: lanl/branson
      version: see level2/<app>/README.md (Upstream commit)
      path: inputs/marshak_wave_replicated.xml (50 k photons, 25 cells)
  params:
    deck: inputs/marshak_wave_replicated.xml
    photons: 50000
    t_stop: 0.01
  env:
    HPCPERF_BRANSON_DECK: inputs/marshak_wave_replicated.xml
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - inputs/marshak_wave_replicated.xml
  input_form: file
- id: hohlraum-multi-node
  case: 3d-hohlraum
  variant: size
  source:
    kind: upstream-file
    upstream:
      repo: lanl/branson
      version: see level2/<app>/README.md (Upstream commit)
      path: inputs/3D_hohlraum_multi_node.xml (250 M photons, t_stop 0.02) run on one GPU
  params:
    deck: inputs/3D_hohlraum_multi_node.xml
    photons: 250000000
    t_stop: 0.02
  env:
    HPCPERF_BRANSON_DECK: inputs/3D_hohlraum_multi_node.xml
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
  notes: upstream's multi-node deck used as a single-GPU size step; memory/time to be recorded by the first measurement
  files:
  - inputs/3D_hohlraum_multi_node.xml
  input_form: file
- id: lb-hohlraum
  case: 3d-hohlraum
  variant: case
  source:
    kind: upstream-file
    upstream:
      repo: lanl/branson
      version: see level2/<app>/README.md (Upstream commit)
      path: inputs/3D_lb_hohlraum.xml (load-balance hohlraum variant, 250 M photons, t_stop 0.05; use_gpu_transporter TRUE)
  params:
    deck: inputs/3D_lb_hohlraum.xml
    photons: 250000000
    t_stop: 0.05
  env:
    HPCPERF_BRANSON_DECK: inputs/3D_lb_hohlraum.xml
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
  notes: upstream's multi-node deck used as a single-GPU size step; memory/time to be recorded by the first measurement
  files:
  - inputs/3D_lb_hohlraum.xml
  input_form: file
check:
  # Candidate validation against the FROZEN CPU-only reference of the deck (reference/<id>.json, written once at
  # construction time by generate_reference.sh from a finished CPU-only run -- README "Correctness reference"):
  # check_reference.py reads the GPU run's log and compares its final completed step with the reference -- final-step
  # Post-mat / Absorption / Exit E within 5 % relative, the final step's "Total Photons transported" (the last such
  # line of the log, never the first) within 5 % relative, every cell's final T_e within 0.02 absolute where the deck
  # prints the table (only marshak does), the same number of steps, a finished run. The margins are validate.sh check
  # C's (> 6 sigma of the seed-to-seed scatter, far below any transport error), fixed before any candidate existed;
  # the reference's rank count (1; lb-hohlraum 24) is provenance only. The check never builds or runs the CPU
  # reference: a missing, corrupted or deck-mismatching reference is an explicit FAIL/ERROR. The per-step conservation
  # check (check_log.py gpu) is not repeated here: it is a consistency check, not a comparison with an independent result.
  kind: post_run
  command: [python3, '{bench_dir}/check_reference.py', '{log}', --deck, '{bench_dir}/{param:deck}']
  pass_regex: '^PASS: branson reference check'
  fail_regex: '^FAIL: branson reference check'
  basis: 'GPU run vs the frozen CPU-only Branson reference of the deck (reference/<id>.json: the same sources built with
    USE_GPU=OFF, same deck, seed and global photon count; 1 MPI rank, lb-hohlraum 24; frozen 2026-10-01 from the runs that
    produced the PASS verdicts of 2026-09-29 / 2026-10-01): final-step Post-mat / Absorption / Exit E within 5 % relative,
    final-step transported photons within 5 % relative, final T_e within 0.02 absolute per cell where printed --
    validate.sh check C margins, stated as > 6 sigma of the seed-to-seed scatter; the check reads the frozen file and
    never reruns the CPU reference'
  covers: [photons_transported]
  timeout: 1800
