# Registered inputs of kripke (schema hpcperf-inputs-1), selected through HPCPERF_KRIPKE_INPUT=<id> in run.sh
# (tools/inputs/README.md). Without the variable run.sh behaves as before.
schema: hpcperf-inputs-1
benchmark: kripke
level: 2
selector: HPCPERF_KRIPKE_INPUT
default_input: z32-g64-q128
entry:
  kind: run.sh
  path: level2/kripke/run.sh
  backend_arg: CUDA
timing:
  scope: 'Kripke''s own ''Solve'' timer (6th field of TIMER_DATA: Generate,LPlusTimes,LTimes,Population,Scattering,Solve,...):
    all source iterations of the sweep solve'
  kind: total
  unit: s
  regex: ^TIMER_DATA:(?:[0-9.eE+-]+,){5}(?P<value>[0-9.eE+-]+)
  select: only
baseline:
  method: Kripke has no built-in reference. The registry keeps the final particle count, compared with the same-input
    baseline at validate.sh's KRIPKE_VALIDATE_RTOL 1e-6 (one unit in the last of the 7 printed digits), and the FOM
    (diagnostic). The registry check compares all 10 per-iteration counts with the frozen B200 golden reference
    (tools/golden); the Sequential (CPU) cross-check (check_sequential.sh) runs only once, offline, to validate it.
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: particle_count_final
    role: required
    regex: '^\s*iter \d+: particle count=(?P<value>[0-9.eE+-]+),'
    select: last
    compare:
      rule: rel
      tol: 1.0e-6      # validate.sh KRIPKE_VALIDATE_RTOL: one unit in the last printed digit
  - name: throughput
    role: diagnostic
    regex: ^\s*Throughput:\s+(?P<value>[0-9.eE+-]+)
    select: last
    compare:
      rule: record
coverage:
  status: MULTI_INPUT
  reason: the GPU default plus zone, group/quadrature and layout variants through Kripke's own parameters
inputs:
- id: z32-g64-q128
  case: kobayashi-3i-sweep
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/Kripke
      version: see level2/<app>/README.md (Upstream commit)
      path: --zones 32,32,32 --groups 64 --quad 128 --layout GDZ --niter 10 (run.sh default GPU configuration)
  params:
    zones: 32,32,32
    groups: 64
    quad: 128
    layout: GDZ
    niter: 10
  env:
    KRIPKE_ZONES: 32,32,32
    KRIPKE_GROUPS: '64'
    KRIPKE_QUAD: '128'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: z64-g64-q128
  case: kobayashi-3i-sweep
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/Kripke
      version: see level2/<app>/README.md (Upstream commit)
      path: --zones 64,64,64 (Kripke's own size parameter)
  params:
    zones: 64,64,64
    groups: 64
    quad: 128
    layout: GDZ
    niter: 10
  env:
    KRIPKE_ZONES: 64,64,64
    KRIPKE_GROUPS: '64'
    KRIPKE_QUAD: '128'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: z32-g32-q64
  case: kobayashi-3i-sweep
  variant: parameter
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/Kripke
      version: see level2/<app>/README.md (Upstream commit)
      path: --groups 32 --quad 64 (energy/angle resolution)
  params:
    zones: 32,32,32
    groups: 32
    quad: 64
    layout: GDZ
    niter: 10
  env:
    KRIPKE_ZONES: 32,32,32
    KRIPKE_GROUPS: '32'
    KRIPKE_QUAD: '64'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: z32-g64-q128-dgz
  case: kobayashi-3i-sweep
  variant: parameter
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/Kripke
      version: see level2/<app>/README.md (Upstream commit)
      path: --layout DGZ (data layout variant)
  params:
    zones: 32,32,32
    groups: 64
    quad: 128
    layout: DGZ
    niter: 10
  env:
    KRIPKE_ZONES: 32,32,32
    KRIPKE_GROUPS: '64'
    KRIPKE_QUAD: '128'
    KRIPKE_LAYOUT: DGZ
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
golden:
  binary: build/level2/kripke/cuda/kripke.exe     # what run.sh launches (provenance; rebuilt sources refuse a stale binary)
  # tools/golden/README.md. The 10 per-iteration particle counts of the B200 GPU run (run.sh through the input) are
  # frozen once, after the one-time Sequential cross-check of that very run passed (check_sequential.sh, run only by
  # `hpcperf_golden.py make` with HPCPERF_CPU_REFERENCE=1); every later run is compared with the frozen counts.
  cpu_check:
    after_run: true
    command: [bash, '{bench_dir}/check_sequential.sh', '{log}', --zones, '{param:zones}', --groups, '{param:groups}', --quad, '{param:quad}', --layout, '{param:layout}', --niter, '{param:niter}', CUDA]
    env: {KRIPKE_SEQ_LOG: '{run_dir}/sequential.log'}
    pass_regex: '^Kripke CUDA vs Sequential \(.*\): PASS'
    fail_regex: '^Kripke CUDA vs Sequential \(.*\): FAIL'
  outputs:
  - name: particle_count
    dtype: f64
    log: {regex: '^\s*iter \d+: particle count=(?P<value>[0-9.eE+-]+),'}
    rule: {metric: max_rel, tol: 1.0e-6}
    cpu: {log: {file: '{run_dir}/sequential.log'}}
    basis: 'check_sequential.sh / validate.sh: |P_gpu - P_seq| / |P_seq| <= KRIPKE_VALIDATE_RTOL 1e-6 for every one of
      the iterations (one unit in the last of the 7 printed digits); the check allows 1e-6 minus the frozen counts'' own
      deviation from the Sequential run'
check:
  # the GPU run of the registered problem (run.sh through the input); its 10 per-iteration particle counts against the
  # frozen B200 golden reference (reference/<input_id>.json). No Sequential (CPU) run.
  kind: post_run
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture', --log, '{log}']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'all per-iteration particle counts against the frozen B200 golden reference reference/<input_id>.json:
    |P - P_golden| / |P_golden| <= 1e-6 - d0 (d0 = the golden''s deviation from the Sequential run when it was frozen;
    check_sequential.sh''s criterion); the count of iterations must match; no CPU (Sequential) run'
  covers: all
  timeout: 3600
