# Registered inputs of xsbench (schema hpcperf-inputs-1), selected through HPCPERF_XSBENCH_INPUT=<id> in run.sh
# (tools/inputs/README.md). Without the variable run.sh behaves as before.
schema: hpcperf-inputs-1
benchmark: xsbench
level: 2
selector: HPCPERF_XSBENCH_INPUT
default_input: large
entry:
  kind: run.sh
  path: level2/xsbench/run.sh
  backend_arg: CUDA
timing:
  scope: 'XSBench''s own Runtime: the event-based lookup kernel (all lookups); grid initialisation and the verification
    reduction are outside'
  kind: total
  unit: s
  regex: ^Runtime:\s+(?P<value>[0-9.]+) seconds
  select: only
baseline:
  method: XSBench's built-in verification checksum over all lookup results (exact for a given size/lookups); upstream
    marks the checksum (Valid) for its standard configurations
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: checksum
    role: required
    regex: '^Verification checksum: (?P<value>\d+)'
    select: last
    compare:
      rule: exact
  - name: valid_marker
    role: diagnostic
    regex: '^Verification checksum: \d+ \(Valid\)'
    compare:
      rule: present
  - name: lookups
    role: diagnostic
    regex: ^Lookups:\s+(?P<value>[0-9,]+)
    compare:
      rule: present
coverage:
  status: MULTI_INPUT
  reason: >-
    the two upstream sizes that carry a reference checksum (small, large; event-based method as run.sh
    runs it) plus upstream's history-based simulation method on the large size (its own reference
    checksum). XSBench verifies only these size/method/lookup combinations; every other size (XL, XXL) or
    lookup count prints 'WARNING - INAVALID CHECKSUM' and exits 1 by design, so they cannot be registered
    as validated inputs (XL, XXL and -l 100000000 attempts are kept as unregistered records)
  upstream_inputs_not_added:
  - -s XL and -s XXL (upstream sizes without a reference checksum: exit 1 'INAVALID CHECKSUM')
  - other lookup counts (-l) (no reference checksum)
  - -G hash|nuclide grid types and -k kernel variants (upstream parameters, not explored this round)
inputs:
- id: large
  case: hoogenboom-martin
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ANL-CESAR/XSBench
      version: see level2/<app>/README.md (Upstream commit)
      path: -m event -s large (upstream GPU default; 17 M lookups)
  params:
    size: large
    lookups: 17000000
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: small
  case: hoogenboom-martin
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: ANL-CESAR/XSBench
      version: see level2/<app>/README.md (Upstream commit)
      path: -s small (upstream standard size)
  params:
    size: small
    lookups: 17000000
  args:
  - -s
  - small
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: large-history
  case: hoogenboom-martin
  variant: parameter
  source:
    kind: upstream-parameterized
    upstream:
      repo: ANL-CESAR/XSBench
      version: see level2/<app>/README.md (Upstream commit)
      path: -m history -s large (upstream's history-based simulation method, the program default; own reference checksum)
  params:
    size: large
    lookups: 17000000
    simulation_method: history
  args:
  - -m
  - history
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
