# Registered inputs of shaw (schema hpcperf-inputs-1), selected through HPCPERF_SHAW_INPUT_ID=<id> in run.sh
# (tools/inputs/README.md). Without the variable run.sh behaves as before.
schema: hpcperf-inputs-1
benchmark: shaw
level: 2
selector: HPCPERF_SHAW_INPUT_ID
default_input: prem-1000x5000
entry:
  kind: run.sh
  path: level2/shaw/run.sh
  backend_arg: CUDA
timing:
  scope: 'SHAW''s own loopTime: wall time of the leapfrog time loop (the per-kernel timers are launch times only,
    see README)'
  kind: total
  unit: s
  regex: ^loopTime = (?P<value>[0-9.]+)
  select: only
baseline:
  method: no reference in stdout (seismogram optional); validate.sh runs the upstream fomInnerDomain regression
    with compare.py. Nothing numeric is printed to verify from the log.
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: loop_time_line
    role: diagnostic
    regex: '^loopTime = '
    compare:
      rule: present
coverage:
  status: MULTI_INPUT
  reason: upstream demo1 and two larger grids of the same problem (mesh generated by the upstream mesher)
inputs:
- id: prem-1000x5000
  case: prem-shear-wave
  variant: default
  source:
    kind: derived
    derivation: upstream demo1 (PREM, Ricker source 640 km, 2000 s) on a 1000 x 5000 grid with dt 0.05 s (run.sh
      default; mesh from the upstream mesher, cached)
  params:
    nr: 1000
    nth: 5000
    dt: 0.05
    final_time: 2000
  env:
    HPCPERF_SHAW_NR: '1000'
    HPCPERF_SHAW_NTH: '5000'
    HPCPERF_SHAW_DT: '0.05'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: prem-200x1000-demo1
  case: prem-shear-wave
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: Pressio/SHAW
      version: see level2/<app>/README.md (Upstream commit)
      path: 'demos/demo1: 200 x 1000 grid, dt 0.25 s, 2000 s (upstream demo as documented)'
  params:
    nr: 200
    nth: 1000
    dt: 0.25
    final_time: 2000
  env:
    HPCPERF_SHAW_NR: '200'
    HPCPERF_SHAW_NTH: '1000'
    HPCPERF_SHAW_DT: '0.25'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: prem-500x2500
  case: prem-shear-wave
  variant: size
  source:
    kind: derived
    derivation: 500 x 2500 grid, dt 0.1 s (CFL kept)
  params:
    nr: 500
    nth: 2500
    dt: 0.1
    final_time: 2000
  env:
    HPCPERF_SHAW_NR: '500'
    HPCPERF_SHAW_NTH: '2500'
    HPCPERF_SHAW_DT: '0.1'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
