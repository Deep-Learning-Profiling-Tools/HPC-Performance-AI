# Registered inputs of exacmech (schema hpcperf-inputs-1), selected through HPCPERF_EXACMECH_INPUT=<id> in run.sh
# (tools/inputs/README.md). Without the variable run.sh behaves as before.
schema: hpcperf-inputs-1
benchmark: exacmech
level: 2
selector: HPCPERF_EXACMECH_INPUT
default_input: fcc-a-1m-1000
entry:
  kind: run.sh
  path: level2/exacmech/run.sh
  backend_arg: CUDA
timing:
  scope: the miniapp's own timer over all time steps of the set-up / material-model / retrieve kernels
  kind: total
  unit: s
  regex: '^Run time of set-up, material, and retrieve kernels over \d+ time steps is: (?P<value>[0-9.eE+-]+)\(s\)'
  select: only
baseline:
  method: upstream ships no reference; validate.sh compares GPU vs CPU on the upstream CPU deck. The registry keeps
    the final volume-averaged stress components, compared with the same-input baseline at validate.sh's RTOL 1e-5
    (print precision; the GPU and CPU paths differ only by summation order; ATOL 1e-6 MPa is negligible at the
    registered stress levels). The registry check compares the whole stress history with the frozen B200 golden
    reference (tools/golden); the comparison against the OpenMP/CPU path (check_reference.sh) runs only once, offline,
    to validate it.
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: stress_s11_final
    role: required
    regex: '^Step# \d+ Stress: (?P<value>[0-9.eE+-]+) '
    select: last
    compare:
      rule: rel
      tol: 1.0e-5      # validate.sh RTOL (6 printed significant digits)
  - name: stress_s33_final
    role: required
    regex: '^Step# \d+ Stress: [0-9.eE+-]+ [0-9.eE+-]+ (?P<value>[0-9.eE+-]+) '
    select: last
    compare:
      rule: rel
      tol: 1.0e-5      # validate.sh RTOL
  - name: steps
    role: required
    regex: '^Number of steps: (?P<value>\d+)'
    select: last
    compare:
      rule: exact
coverage:
  status: MULTI_INPUT
  reason: the upstream GPU case as shipped, the scaled default and a second material model
inputs:
- id: fcc-a-1m-1000
  case: evptn-fcc-a
  variant: default
  source:
    kind: derived
    derivation: upstream option_gpu.txt problem (evptn_FCC_A, props.txt, axisymmetric velocity gradient, dt 0.00025)
      scaled from 350,000 x 60 to 1,000,000 orientations x 1000 steps (run.sh default)
  params:
    model: evptn_FCC_A
    nqpts: 1000000
    nsteps: 1000
    dt: 0.00025
  env:
    EXACMECH_NQPTS: '1000000'
    EXACMECH_NSTEPS: '1000'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: fcc-a-350k-60
  case: evptn-fcc-a
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/ExaCMech
      version: see level2/<app>/README.md (Upstream commit)
      path: 'miniapp/cases/option_gpu.txt as shipped: 350,000 orientations, 60 steps'
  params:
    model: evptn_FCC_A
    nqpts: 350000
    nsteps: 60
    dt: 0.00025
  env:
    EXACMECH_NQPTS: '350000'
    EXACMECH_NSTEPS: '60'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: bcc-a-1m-1000
  case: evptn-bcc-a
  variant: case
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/ExaCMech
      version: see level2/<app>/README.md (Upstream commit)
      path: material model evptn_BCC_A (miniapp option file line 2) at the default size
  params:
    model: evptn_BCC_A
    nqpts: 1000000
    nsteps: 1000
    dt: 0.00025
  env:
    EXACMECH_MODEL: evptn_BCC_A
    EXACMECH_NQPTS: '1000000'
    EXACMECH_NSTEPS: '1000'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
golden:
  binary: build/level2/exacmech/cuda/bin/orientation_evolution     # what run.sh launches (provenance; rebuilt sources refuse a stale binary)
  # tools/golden/README.md. The stress history of the B200 GPU run (run.sh through the input: every step x 6
  # components) is frozen once, after the one-time reference cross-check of the same configuration passed
  # (check_reference.sh: GPU and OpenMP paths of the same miniapp, run only by `hpcperf_golden.py make` with
  # HPCPERF_CPU_REFERENCE=1); every later run is compared with the frozen history.
  cpu_check:
    after_run: true
    command: [bash, '{bench_dir}/check_reference.sh', '{param:nqpts}', '{param:nsteps}', '{param:model}', CUDA]
    env: {EXACMECH_REF_DEVICE: OpenMP}
    pass_regex: '^ExaCMech CUDA reference check \(.*\): PASS'
    fail_regex: '^ExaCMech CUDA reference check \(.*\): FAIL'
  outputs:
  - name: stress
    dtype: f64
    log: {regex: '^Step# \d+ Stress: (\S+) (\S+) (\S+) (\S+) (\S+) (\S+)\s*$'}
    rule: {metric: max_relabs, rtol: 1.0e-5, atol: 1.0e-6, tol: 1}
    cpu: {log: {file: '{repo}/build/level2/exacmech/check/{param:model}_{param:nqpts}_{param:nsteps}/ref.out'}}
    basis: 'check_reference.sh / validate.sh: |gpu - ref| <= RTOL |ref| + ATOL with RTOL 1e-5, ATOL 1e-6 MPa for every
      step and stress component (6 printed significant digits); normalised to |a - g| / (1e-5 |g| + 1e-6) <= 1 minus
      the frozen history''s own deviation from the OpenMP reference'
check:
  # the GPU run of the registered deck (run.sh through the input); every step's 6 stress components against the
  # frozen B200 golden reference (reference/<input_id>.json). No OpenMP / CPU reference run.
  kind: post_run
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture', --log, '{log}']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'nsteps x 6 stress components against the frozen B200 golden reference reference/<input_id>.json: |a - g| <=
    (1e-5 |g| + 1e-6 MPa) (1 - d0), d0 = the golden''s normalised deviation from the OpenMP reference when it was
    frozen (check_reference.sh''s criterion); the number of steps must match; no CPU reference run'
  covers: all
  timeout: 14400
