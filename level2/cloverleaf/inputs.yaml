# Registered inputs of CloverLeaf (schema hpcperf-inputs-1), selected through
# HPCPERF_CLOVERLEAF_INPUT=<id> in run.sh. Without the variable run.sh behaves as before
# (HPCPERF_CLOVERLEAF_DECK or the default InputDecks/clover_bm16.in).
schema: hpcperf-inputs-1
benchmark: cloverleaf
level: 2
selector: HPCPERF_CLOVERLEAF_INPUT
default_input: bm16-3840sq-2955steps
entry:
  kind: run.sh
  path: level2/cloverleaf/run.sh
  backend_arg: CUDA
timing:
  scope: >-
    CloverLeaf's own "Wall clock" (driver/hydro.cpp: timer() taken at the start of hydro(), i.e.
    after mesh/chunk initialisation and the initial field summary, minus the same timer at
    completion of the last step including its field summary and the reference check). The value
    is printed after every step (cumulative) and once more at the end; the last one is the total
    of the time-step loop. Kernel launch/JIT, MPI start-up and finalisation are outside it.
    With a registered input run.sh appends clover.out to stdout, so the same line appears
    twice with the same value (select last).
  kind: total
  unit: s
  regex: '^\s*Wall clock (?P<value>[0-9.eE+-]+)\s*$'
  select: last
baseline:
  method: >-
    CloverLeaf checks itself (driver/report.cpp): decks that carry a test_problem id compare the
    final total kinetic energy with a value hard-coded for that id and pass when
    |100 ke/ref - 100| < 0.001, i.e. 1e-5 relative. The registry keeps the test id (exact), the
    final step (exact), the final kinetic energy from the last field-summary row of clover.out
    (compared with this build's baseline at the same 1e-5 relative tolerance -- the application's
    own criterion), and the PASSED / Outcome markers. A deck without a test_problem id (bm128
    short) has only the self-baseline comparison of the kinetic energy at that tolerance and no
    upstream reference value.
  reference: upstream hard-coded kinetic-energy references (driver/report.cpp, UoB-HPC/CloverLeaf 3e10ff92) through the application's own check; ke_final against this build's first measured run
  quantities:
    - name: test_problem
      role: required
      regex: '^\s*Test problem (?P<value>\d+) is within'
      select: first
      compare: {rule: exact}
    - name: final_step
      role: required
      regex: '^\s*step:\s+(?P<value>\d+)\s'
      select: last
      compare: {rule: exact}
    - name: ke_final
      role: required
      regex: '^\s*step:\s+\d+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+(?P<value>[0-9.eE+-]+)\s+\S+\s*$'
      select: last
      compare: {rule: rel, tol: 1.0e-5}
    - name: pass_marker
      role: required
      regex: '^\s*This test is considered PASSED'
      compare: {rule: present}
    - name: outcome_passed
      role: required
      regex: '^\s*- Outcome: PASSED'
      compare: {rule: present}
    - name: fail_marker
      role: required
      regex: '(This test is considered NOT PASSED)|(Outcome: FAILED)'
      compare: {rule: absent}
coverage:
  status: MULTI_INPUT
  reason: >-
    four upstream InputDecks (bm, bm4, bm16, bm128 short) and the full bm16 run
