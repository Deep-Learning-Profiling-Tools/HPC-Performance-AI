  case: maxwell-refmaxwell
  variant: size
  source:
    kind: upstream-file
    upstream:
      repo: trilinos/Trilinos
      version: see level2/<app>/README.md (Upstream commit)
      path: maxwell-large.xml with a 64^3 global grid, 3 steps (upstream performance test size)
  params:
    deck: maxwell-large.xml
    elements: 64^3
    steps: 3
  env:
    HPCPERF_SCALE_MODE: strong
  files:
