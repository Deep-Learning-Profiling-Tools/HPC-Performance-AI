  params:
    deck: maxwell.xml
    elements: 15^3
    steps: 1
  env:
    HPCPERF_SCALE_MODE: smoke
  files:
  - src/decks/maxwell.xml
  - src/decks/solverMueLu.xml
  - src/decks/solverMueLuCuda.xml
  runtime_config:
