- id: darcy-hex
  baseline:
    quantities:
    - name: time_steps
      role: diagnostic
      regex: ^\s*Number of Time Steps \(one linear solve per step\) = (?P<value>\d+)
      select: last
      compare:
        rule: exact
    - name: fom
      role: diagnostic
      regex: ^\s*FOM \( num_cells \* num_steps / solver_time / 1000\) = (?P<value>[0-9.eE+-]+)
      select: last
      compare:
        rule: record
    # darcyHex.xml has no Responses block; the driver now prints the 2-norm of the final solution vector after the
    # synchronized ROI end (main.cpp, 15 significant digits, 2026-09-30) -- a deterministic functional of the result
    # without touching the registered deck. Compared at rel 1e-8 = the deck's Belos convergence tolerance
    # (solverMueLu.xml 1.0e-8; see the Maxwell inputs); the reference build's 7 runs agree to 2 ulps (6.804576196336858e-03
    # .. ...860e-03, rel 3e-16, the assembly's atomics).
    - name: solution_norm_final
      role: required
      regex: '^hpcperf: final solution 2-norm = (?P<value>[0-9.eE+-]+)'
      select: last
      compare:
        rule: rel
        tol: 1.0e-08
  case: darcy-flow
  variant: case
  source:
    kind: upstream-file
    upstream:
      repo: trilinos/Trilinos
      version: see level2/<app>/README.md (Upstream commit)
      path: decks/darcyHex.xml (Darcy flow, a different physics driver of mini-em)
  params:
    deck: darcyHex.xml
  env:
    HPCPERF_SCALE_MODE: smoke
    HPCPERF_MINIEM_DECK: darcyHex.xml
  files:
  - src/decks/darcyHex.xml
  - src/decks/solverMueLu.xml
  - src/decks/solverMueLuCuda.xml
  runtime_config:
