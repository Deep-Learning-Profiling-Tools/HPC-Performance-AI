# Registered inputs of exampm (schema hpcperf-inputs-1), selected through HPCPERF_EXAMPM_INPUT=<id> in run.sh
# (tools/inputs/README.md). Without the variable run.sh behaves as before.
schema: hpcperf-inputs-1
benchmark: exampm
level: 2
selector: HPCPERF_EXAMPM_INPUT
default_input: dambreak-0.01
entry:
  kind: run.sh
  path: level2/exampm/run.sh
  backend_arg: CUDA
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: ExaMPM prints only the simulation time ('Time t / t_final'), no wall-clock timer
baseline:
  method: no built-in check; validate.sh checks its own case against an analytic solution. Nothing numeric is printed
    to stdout (particle dumps go to HDF5), so no quantity can be verified from the log.
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: last_time_line
    role: diagnostic
    regex: ^Time [0-9.]+ / [0-9.]+
    compare:
      rule: present
coverage:
  status: MULTI_INPUT
  reason: upstream's two examples; the dam break at three grid sizes
inputs:
- id: dambreak-0.01
  check:
    kind: none
    reason: no reference; the proposed check (class D) is validate.sh's dam-break conservation checks on the last dump
      plus a same-input baseline comparison of the final particle state (centre of mass, momentum, kinetic energy),
      whose tolerance is not established
  case: dam-break
  variant: default
  source:
    kind: derived
    derivation: 'upstream DamBreak deck refined to a 0.01 m grid, t_final 1.0 s (run.sh default: 100^3 cells, 1.92
      M particles)'
  params:
    example: DamBreak
    cell_size: 0.01
    ppc: 2
    halo: 0
    dt: 0.001
    t_final: 1.0
    write_freq: 1000
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: dambreak-0.05-upstream
  check:
    kind: none
    reason: no reference; the proposed check (class D) is validate.sh's dam-break conservation checks on the last dump
      plus a same-input baseline comparison of the final particle state (centre of mass, momentum, kinetic energy),
      whose tolerance is not established
  case: dam-break
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: ECP-copa/ExaMPM
      version: see level2/<app>/README.md (Upstream commit)
      path: 'README/CI deck: DamBreak 0.05 2 0 0.001 0.25 100'
  params:
    example: DamBreak
    cell_size: 0.05
    ppc: 2
    halo: 0
    dt: 0.001
    t_final: 0.25
    write_freq: 100
  args:
  - '0.05'
  - '2'
  - '0'
  - '0.001'
  - '0.25'
  - '100'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: dambreak-0.005
  check:
    kind: none
    reason: the registered write_freq 2000 exceeds the 250 steps, so no evolved dump exists; the program needs a
      final-state summary outside the ROI first (class E)
  case: dam-break
  variant: size
  source:
    kind: derived
    derivation: 0.005 m grid, t_final 0.25 s (15.4 M particles; run.sh header alternative)
  params:
    example: DamBreak
    cell_size: 0.005
    ppc: 2
    halo: 0
    dt: 0.001
    t_final: 0.25
    write_freq: 2000
  args:
  - '0.005'
  - '2'
  - '0'
  - '0.001'
  - '0.25'
  - '2000'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: freefall-0.01
  check:
    # validate.sh's analytic free-fall check run with this input's arguments (the six FreeFall arguments), reading the
    # HDF5 dumps of that run (h5dump + numpy).
    kind: standalone
    command: [bash, '{bench_dir}/validate.sh', CUDA]
    env: {HPCPERF_EXAMPM_FF_ARGS: '{param:cell_size} {param:ppc} {param:halo} {param:dt} {param:t_final} {param:write_freq}'}
    pass_regex: '^ExaMPM CUDA validation \(FreeFall .*\): PASS'
    fail_regex: '^ExaMPM CUDA validation \(FreeFall .*\): FAIL'
    basis: 'analytic free fall on every dump: particle count exact, |mean v_z + g t| <= 1e-9 max(1, g t), |mean v_x|,
      |mean v_y| <= 1e-9, |z_cm - (z0 - g t^2/2)| <= g t dt_0 + 1e-12 (symplectic-Euler bound), last dump at
      t >= 0.9 t_final (validate.sh); note: validate.sh also applies its dam-break conservation checks to whatever
      dumps are in build/level2/exampm/cuda/run'
    covers: all
    timeout: 7200
  case: free-fall
  variant: case
  source:
    kind: upstream-parameterized
    upstream:
      repo: ECP-copa/ExaMPM
      version: see level2/<app>/README.md (Upstream commit)
      path: examples/free_fall.cpp (second upstream example) with the same seven-argument interface at the default
        sizes
  params:
    example: FreeFall
    cell_size: 0.01
    ppc: 2
    halo: 0
    dt: 0.001
    t_final: 1.0
    write_freq: 1000
  env:
    HPCPERF_EXAMPM_EXAMPLE: FreeFall
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
