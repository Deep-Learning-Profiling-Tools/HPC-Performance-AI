# Registered inputs of p3_heat3d (schema hpcperf-inputs-1), selected through HPCPERF_P3_HEAT3D_INPUT=<id> in run.sh
# (tools/inputs/README.md). Without the variable run.sh behaves as before.
schema: hpcperf-inputs-1
benchmark: p3_heat3d
level: 2
selector: HPCPERF_P3_HEAT3D_INPUT
default_input: n512-1000
entry:
  kind: run.sh
  path: level2/p3_heat3d/run.sh
  backend_arg: CUDA
timing:
  scope: heat3d's own MainLoop timer (all FTCS steps); initialisation and I/O are separate timers
  kind: total
  unit: s
  regex: ^MainLoop (?P<value>[0-9.eE+-]+) \[s\], \d+ calls
  select: only
baseline:
  method: the binary prints 'L2_norm:' -- the L2 norm of (numerical - analytic) for the periodic single-mode problem --
    which validate.sh predicts in closed form (u0 is an eigenmode of the discrete Laplacian, so u_n = A^n u0 with
    A = 1 + 0.1 (6 cos(2 pi dx) - 6)); every registered input carries its closed-form value as a `near` rule at
    validate.sh's relative tolerance 1e-3 (6 printed digits; GPU reduction order perturbs ~1e-12)
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: elapsed_line
    role: diagnostic
    regex: '^Elapsed time: [0-9.]+ \[s\]'
    compare:
      rule: present
coverage:
  status: MULTI_INPUT
  reason: three grid sizes through the program's own --nx/--ny/--nz
inputs:
- id: n512-1000
  baseline:
    quantities:
    - name: elapsed_line
      role: diagnostic
      regex: '^Elapsed time: [0-9.]+ \[s\]'
      compare:
        rule: present
    - name: l2_norm
      role: required
      regex: '^L2_norm: (?P<value>[0-9.eE+-]+)'
      select: last
      compare:
        rule: near
        value: 3.5517793e-03      # closed form for N = 512, 1000 steps (validate.sh formula)
        tol: 1.0e-3
  case: heat3d-ftcs
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: yasahi-hpc/P3-miniapps
      version: see level2/<app>/README.md (Upstream commit)
      path: 'docs/heat3d.md example: --nx 512 --ny 512 --nz 512 --nbiter 1000 (run.sh default)'
  params:
    nx: 512
    ny: 512
    nz: 512
    nbiter: 1000
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: n256-1000
  baseline:
    quantities:
    - name: elapsed_line
      role: diagnostic
      regex: '^Elapsed time: [0-9.]+ \[s\]'
      compare:
        rule: present
    - name: l2_norm
      role: required
      regex: '^L2_norm: (?P<value>[0-9.eE+-]+)'
      select: last
      compare:
        rule: near
        value: 1.7546025e-02      # closed form for N = 256, 1000 steps (validate.sh formula)
        tol: 1.0e-3
  case: heat3d-ftcs
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: yasahi-hpc/P3-miniapps
      version: see level2/<app>/README.md (Upstream commit)
      path: --nx 256 --ny 256 --nz 256 --nbiter 1000 (run.sh header example size)
  params:
    nx: 256
    ny: 256
    nz: 256
    nbiter: 1000
  args:
  - --nx
  - '256'
  - --ny
  - '256'
  - --nz
  - '256'
  - --nbiter
  - '1000'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: n1024-200
  baseline:
    quantities:
    - name: elapsed_line
      role: diagnostic
      regex: '^Elapsed time: [0-9.]+ \[s\]'
      compare:
        rule: present
    - name: l2_norm
      role: required
      regex: '^L2_norm: (?P<value>[0-9.eE+-]+)'
      select: last
      compare:
        rule: near
        value: 1.3107948e-04      # closed form for N = 1024, 200 steps (validate.sh formula)
        tol: 1.0e-3
  case: heat3d-ftcs
  variant: size
  source:
    kind: derived
    derivation: --nx 1024 --ny 1024 --nz 1024 --nbiter 200 (8x cells, fewer steps)
  params:
    nx: 1024
    ny: 1024
    nz: 1024
    nbiter: 200
  args:
  - --nx
  - '1024'
  - --ny
  - '1024'
  - --nz
  - '1024'
  - --nbiter
  - '200'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
