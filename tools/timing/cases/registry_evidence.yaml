# tools/timing/cases/registry_evidence.yaml -- how each Level 2 run.sh hands a registered input to the program,
# i.e. what EVIDENCE a measured run must show before it counts as a run of that input.
# Read by tools/timing/verify_registry_runs.py. Hand-maintained next to the run.sh it describes; every entry
# names the run.sh / source behaviour it relies on. Nothing here relaxes the generic checks (registry args
# present as a contiguous run of the argv, registered files reached by real path AND content hash, no
# unhandled duplicate options, selector passed); rules only ADD evidence for what the argv cannot show.
#
# Keys (all optional):
#   covers        env knobs of the app's inputs that the templates below evidence (every knob an input sets
#                 must be covered here or be the path of a registered file of that input)
#   argv          regex templates matched against the argv (joined with single spaces, trailing space added)
#   exe           regex templates matched against the executable path
#   output        regex templates matched (re.M) against the program's output of EVERY clean run
#   cwd_file      {file relative to the process cwd: [regex templates]} -- build-configuration evidence
#   search_dirs   benchmark-relative directories run.sh resolves a bare file argument in (besides the
#                 benchmark directory itself), in run.sh's order
#   cwd_files     registered files the program reads from its working directory (by name); accepted only
#                 when the process cwd IS the file's directory and the content hash matches
#   generated     {registered file: argv path prefix of the file run.sh generates from it}; the generated
#                 file's content differs by design -- the output templates must evidence the parameters
#   copies        {registered file: argv path prefix of a byte-identical copy run.sh makes}; accepted only
#                 when the copy's sha256 equals the registered file's
#   copy_dirs     {benchmark-relative source dir: repository-relative copy dir}: a registered file's copy of the
#                 same relative name that the program reads instead; accepted only with the registered sha256
#   logged_reads  regex over the program's output naming files it read from its working directory (group 1);
#                 such a file counts as reached when it is the registered file or its declared copy
#   last_wins     source reference proving the program's parser keeps the LAST occurrence of an option;
#                 required before a registered option may appear more than once in the argv (and the last
#                 occurrence must then carry the registered value)
# Templates are Python format strings over the input's registry `params` ({n}, {round(final_time/dt)} is
# not allowed -- use derived values listed under `derive`); a template naming a param the input does not
# have is not applicable to that input and is reported as skipped.
#   derive        {name: python expression over params} -- derived values for templates

level1:                         # exact argv/exe/cwd is checked for every Level 1 input; NPB classes are compiled in
  cg: &npb
    output: ['^\s*[Cc]lass(_npb)?\s+=\s+{class}$']   # NPB prints 'class_npb = A' (or 'Class = A')
  ep: *npb
  ft: *npb
  is: *npb
  mg: *npb
level2:
  amg2023:
    covers: [HPCPERF_SCALE_MODE, HPCPERF_AMG_N, HPCPERF_AMG_PROBLEM]
    argv: ['-n {n} {n} {n} ', '-problem {problem} ']
    output: ['Problem ID\s+= {problem}$', '\(Nx, Ny, Nz\) = \({n}, {n}, {n}\)']
  branson: {}                     # the deck (HPCPERF_BRANSON_DECK) is a registered file passed in the argv
  cabanapic:                      # the Weibel deck is compiled in; the binary prints the values it read
    covers: [HPCPERF_NY, HPCPERF_NPPC, HPCPERF_NUM_STEPS]
    output: ['^hpcperf_weibel deck: ny={ny} nppc={nppc} num_steps={num_steps} ']
  cloverleaf: {}
  comb:
    covers: [HPCPERF_COMB_LOCAL_SIZE, HPCPERF_COMB_CYCLES]
    argv: ['(^| ){local_size}_{local_size}_{local_size} ', '-cycles {cycles} ']
  exacmech:                       # run.sh writes an option file from EXACMECH_*; the miniapp prints what it read
    covers: [EXACMECH_MODEL, EXACMECH_NQPTS, EXACMECH_NSTEPS]
    output: ['^Material Model: {model}$', '^Number of steps: {nsteps}$', '^Number of qpts: {nqpts}$']
  examinimd:                      # run.sh generates in.lj.<L>^3.s<steps> from input/in.lj (sed of lattice/run)
    covers: [HPCPERF_SCALE_MODE, HPCPERF_EXAMINIMD_LATTICE, HPCPERF_EXAMINIMD_STEPS]
    generated: {input/in.lj: build/level2/examinimd/cuda/run/in.lj.}
    cwd_files: [input/snap/Ta06A.snapcoeff, input/snap/Ta06A.snapparam]   # run.sh cd's into the SNAP deck dir
    output: ['^run {steps} $', '^Atoms: {atoms} ']
  exampm:
    covers: [HPCPERF_EXAMPM_EXAMPLE]
    exe: ['/examples/{example}$']
  gamess_ri_mp2:                  # run.sh cd's into inputs/; *.rand inputs are generated in memory by the program
    covers: [HPCPERF_GAMESS_INPUT, HPCPERF_GAMESS_NQVV]
    argv: ['(^| ){input} ']
    output: ['NQVV =\s+{nqvv}$']
  haccabanapm: {}                 # the indat (HPCPERF_HACCABANAPM_INDAT) is a registered file in the argv
  hipbone: {}
  kripke:
    covers: [KRIPKE_ZONES, KRIPKE_GROUPS, KRIPKE_QUAD, KRIPKE_LAYOUT]
    argv: ['--layout {layout} ', '--groups {groups} ', '--quad {quad} ', '--zones {zones} ']
  laghos: {}
  minibude:                       # --deck names the deck directory that holds the registered poses.in etc.
    covers: [MINIBUDE_DECK, MINIBUDE_PPWI, MINIBUDE_ITERS]
    argv: ['--deck \S*/data/{deck} ', '-i {iterations} ', '-w {wgsize} ', '-p {ppwi} ']
  miniem:                         # run.sh: --inputFile=<deck> (build's decks/), --numTimeSteps, --x/y/z-elements (weak/strong)
    covers: [HPCPERF_SCALE_MODE, HPCPERF_MINIEM_DECK]
    copy_dirs: {src/decks: build/level2/miniem/cuda/decks}   # build.sh copies src/decks/ next to the driver (run cwd)
    logged_reads: '^Loading solver config from (\S+)$'       # MiniEM_helpers.cpp:112, file read from the run cwd
    derive: {n: "int(str(elements).split('^')[0]) if deck == 'maxwell-large.xml' else None"}
    argv: ['(^| )--inputFile=\S*{deck} ', '--numTimeSteps={steps} ', '--x-elements={n} --y-elements={n} --z-elements={n} ']
  miniweather:                    # grid / initial condition / simulated time are compiled in (tagged build dir)
    covers: [HPCPERF_MINIWEATHER_BUILD_TAG]
    output: ['^nx_glob, nz_glob: {nx} {nz}$']
    cwd_file: {CMakeCache.txt: ['^DATA_SPEC:\w+={data_spec}$', '^SIM_TIME:\w+={sim_time}$', '^NX:\w+={nx}$', '^NZ:\w+={nz}$']}
  p3_heat3d:
    last_wins: 'level2/p3_heat3d/miniapps/heat3d/Parser.hpp:24-41 (one sequential pass, each --nx/--ny/--nz/--nbiter overwrites)'
    output: ['^\(nx, ny, nz\) = {nx}, {ny}, {nz}$']
  p3_vlp4d:
    search_dirs: [wk]             # run.sh: a deck argument is taken from the caller's cwd, else from wk/
  quicksilver: {}
  remhos:                         # MFEM echoes the options it parsed
    output: ['^\s+--problem {problem}$', '^\s+--refine-serial {rs}$', '^\s+--time-step {dt}$', '^\s+--mesh \S*/{mesh}$']
  shaw:                           # run.sh writes input.yaml from HPCPERF_SHAW_*; the program prints what it read
    covers: [HPCPERF_SHAW_NR, HPCPERF_SHAW_NTH, HPCPERF_SHAW_DT]
    derive: {num_steps: 'round(final_time / dt)'}
    output: ['^nr = {nr}$', '^nth = {nth}$', '^numSteps = {num_steps} ?$']
  sw4lite: {}                     # the deck (HPCPERF_SW4LITE_INPUT) is a registered file in the argv
  tealeaf: {}
  xsbench:
    last_wins: 'level2/xsbench/cuda/io.cu:346-349 (-s assigns input.HM on every occurrence)'
    output: ['^H-M Benchmark Size:\s+{size}$']
level3:                         # Level 3 has no ROI logs: the evidence is the run manifest run.sh writes (run_manifest.txt,
                                # harvested into clean.N/app/<run>/), the launcher's lines in run.log and the placement records.
                                # Generic (every application, no rule needed): selector = input id, HPCPERF_GPUS and manifest
                                # ranks = runtime_config, exit code 0, the binary is the application's own (build/ or .deps/ of
                                # this repository) and still hashes as the manifest and the record say, build profile / variant
                                # as the registry's build_config, launcher audit clean with the registered rank count, the
                                # application process held exactly the registered number of GPUs.
                                # Per-application keys:
                                #   manifest     {manifest key: [regex templates]} -- every applicable template must match the
                                #                manifest's value; templates are over params, the input's env knobs, input_id
                                #                and `derive`/`defaults` (a template naming a value the input lacks is skipped)
                                #   output       regex templates over run.log (the run.sh banner line)
                                #   source_deck  {manifest key: level3/<app>-relative path template} -- the manifest file IS the
                                #                frozen source deck: its recorded <key>_sha256 must equal the file's sha256 now
                                #   source_files [level3/<app>-relative templates] -- registered source files that must exist
                                #   generated    {manifest key: sha key} -- a file run.sh derived from the deck: must still exist
                                #                and hash as the manifest recorded (gone -> gap, changed -> FAIL)
                                #   timer_steps  expression over params: the step count the application's timer must report
                                #   defaults     {name: value} implicit values (run.sh defaults an input may leave unstated)
  cp2k:                         # run.sh: case h2o -> benchmarks/QS/H2O-<system>.inp, case regtest -> the named regtest input
    covers: [HPCPERF_CP2K_CASE, HPCPERF_SCALE_MODE, HPCPERF_CP2K_SYSTEM, HPCPERF_CP2K_REGTEST]
    manifest:
      case: ['^{HPCPERF_CP2K_CASE}$']
      mode: ['^{HPCPERF_SCALE_MODE}$']
      input: ['/H2O-{molecules}\.inp$', '/{HPCPERF_CP2K_REGTEST}$']
      threads_per_rank: ['^\d+$']
    output: ['^# CP2K .* case={HPCPERF_CP2K_CASE} ']
    timer_steps: 'md_steps - 1'                      # the .ener timer: MD steps 2..N (step 1 carries the initial force evaluation)
  dftfe:                        # run.sh: case al_md -> Input_MD_0.prm (verbatim), llzo -> parameterFile_LLZO.prm
    covers: [HPCPERF_DFTFE_CASE, HPCPERF_SCALE_MODE]
    manifest:
      case: ['^{HPCPERF_DFTFE_CASE}$']
      mode: ['^{HPCPERF_SCALE_MODE}$']
      upstream_prm_sha256: ['^[0-9a-f]{64}$']
      deck_sha256: ['^[0-9a-f]{64}$']
    output: ['^# DFT-FE .* case={HPCPERF_DFTFE_CASE} mode={HPCPERF_SCALE_MODE} ']
    timer_steps: 'md_steps - 1'                      # MD steps 1..N-1 after the initial ground state (step 0)
  exaca:                        # run.sh: NX/NY/NZ from HPCPERF_EXACA_N* or the mode's defaults; the deck is generated from the template
    covers: [HPCPERF_SCALE_MODE, HPCPERF_EXACA_NX, HPCPERF_EXACA_NY, HPCPERF_EXACA_NZ]
    derive: {nx: "cells.split('x')[0]", ny: "cells.split('x')[1]", nz: "cells.split('x')[2]",
             ncells: "int(cells.split('x')[0]) * int(cells.split('x')[1]) * int(cells.split('x')[2])"}
    manifest:
      mode: ['^{HPCPERF_SCALE_MODE}$']
      nx: ['^{nx}$']
      ny: ['^{ny}$']
      nz: ['^{nz}$']
      cells: ['^{ncells}$']
      template_sha256: ['^[0-9a-f]{64}$']
    generated: {input: input_sha256}
    output: ['^# ExaCA .* box={nx}x{ny}x{nz} cells = {ncells} ']
  lammps:                       # run.sh: the registered deck (bench/ or examples/reaxff/HNS) with its x/y/z replication and steps
    defaults: {deck_dir: bench, variant: default}
    manifest:
      input_id: ['^{input_id}$']
      deck: ['^{deck_dir}/{deck}$']
      steps: ['^{steps}$']
      atoms: ['^{atoms}$']
      variant: ['^{variant}$']
    source_files: ['src/{deck_dir}/{deck}']
    generated: {input: input_sha256}
    output: ['^# LAMMPS .* input={input_id} deck={deck_dir}/{deck} ranks=\d+ .* {atoms} atoms .*, {steps} steps,']
    timer_steps: 'steps'
  nekrs:                        # run.sh: ethier case, h-refinement and step count from the knobs / mode defaults
    covers: [HPCPERF_SCALE_MODE, HPCPERF_NEKRS_HREFINE]
    defaults: {hrefine: 0}
    manifest:
      mode: ['^{HPCPERF_SCALE_MODE}$']
      elements: ['^{elements}$']
      order: ['^{order}$']
      steps: ['^{steps}$']
      par_sha256: ['^[0-9a-f]{64}$']
    output: ['^# nekRS .* case=ethier hrefine={hrefine} elements={elements} .* N={order} ']
    timer_steps: 'steps'
  nyx:                          # run.sh: case decks derived from upstream; the heat/cool case needs the heatcool build profile
    covers: [HPCPERF_NYX_CASE, HPCPERF_SCALE_MODE, HPCPERF_NYX_HEATCOOL]
    derive: {n: "cells.split('^')[0]", hc_profile: "'heatcool' if HPCPERF_NYX_HEATCOOL == 'YES' else 'adiabatic'"}
    manifest:
      case: ['^{HPCPERF_NYX_CASE}$']
      mode: ['^{HPCPERF_SCALE_MODE}$']
      grid: ['^{n}x{n}x{n}$']
      steps: ['^{steps}$']
      profile: ['-{hc_profile}$']
      deck_sha256: ['^[0-9a-f]{64}$']
    generated: {input: input_sha256}
    output: ['^# Nyx .* case={HPCPERF_NYX_CASE} mode={HPCPERF_SCALE_MODE} ranks=\d+ grid={n}x{n}x{n} ']
    timer_steps: 'steps'
  qmcpack:                      # run.sh: the diamondC_2x1x1 deck with walkers per GPU from the knob / mode default
    covers: [HPCPERF_QMCPACK_CASE, HPCPERF_SCALE_MODE, HPCPERF_QMCPACK_WALKERS]
    manifest:
      case: ['^{HPCPERF_QMCPACK_CASE}$']
      mode: ['^{HPCPERF_SCALE_MODE}$']
      walkers_per_gpu: ['^{walkers}$']
      upstream_input_sha256: ['^[0-9a-f]{64}$']
      deck_sha256: ['^[0-9a-f]{64}$']
      timers: ['^(medium|fine)$']
    output: ['^# QMCPACK .* case={HPCPERF_QMCPACK_CASE} mode={HPCPERF_SCALE_MODE} ']
  sparta:                       # run.sh: the frozen bench deck as shipped (no derivation), x/y/z as -var arguments
    manifest:
      input_id: ['^{input_id}$']
      deck: ['^{deck}$']
      cells: ['^{cells}$']
      particles: ['^{particles}$']
    source_deck: {input: 'src/bench/{deck}'}
    output: ['^# SPARTA .* input={input_id} deck={deck} ranks=\d+ grid={x}x{y}x{z} = {cells} cells, {particles} particles']
    timer_steps: 'bench_steps'
  specfem3d:                    # run.sh: homogeneous half-space, mesh refinement and NSTEP from the knobs / mode defaults
    covers: [HPCPERF_SCALE_MODE, HPCPERF_SPECFEM_STRONG, HPCPERF_SPECFEM_STEPS]
    manifest:
      mode: ['^{HPCPERF_SCALE_MODE}$']
      elements: ['^{elements}$']
      nstep: ['^{nstep}$']
      par_file_sha256: ['^[0-9a-f]{64}$']
    output: ['^# SPECFEM3D .* mode={HPCPERF_SCALE_MODE} ranks=\d+ elements={elements} .* NSTEP={nstep} ']
    timer_steps: 'nstep'
  warpx:                        # run.sh: the case deck derived from upstream with the grid and step count of the mode / knobs
    covers: [HPCPERF_SCALE_MODE, HPCPERF_WARPX_CASE, HPCPERF_WARPX_LOCAL, HPCPERF_WARPX_GLOBAL, HPCPERF_WARPX_STEPS]
    # run.sh runs the langmuir case as upstream's test as shipped (64^3, 40 steps) and labels it mode=validate whatever
    # HPCPERF_SCALE_MODE says (level3/warpx/run.sh); the mode label is derived the same way here
    derive: {grid: "'x'.join(n_cell.split())", mode: "'validate' if HPCPERF_WARPX_CASE == 'langmuir' else HPCPERF_SCALE_MODE"}
    manifest:
      case: ['^{HPCPERF_WARPX_CASE}$']
      mode: ['^{mode}$']
      grid: ['^{grid}$']
      steps: ['^{steps}$']
    generated: {input: input_sha256}
    output: ['^# WarpX .* case={HPCPERF_WARPX_CASE} mode={mode} ranks=\d+ grid={grid} ']
    timer_steps: 'steps'
