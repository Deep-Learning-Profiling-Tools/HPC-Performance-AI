# Registered inputs of histogram (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: histogram
level: 1
selector: null
default_input: w1920-h1080
entry:
  kind: binary
  path: build/histogram/cuda/histogram_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: two atomics variants (shared / global) each print 'Avg time'; no total
baseline:
  method: 'the six histograms (3 genres x shared/global atomics) against the frozen B200 golden reference (`check:` /
    `golden:` below); the upstream CPU histogram HistogramGold (cuda/histogram_compare.cu) runs only once, offline, to
    validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: FAIL
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the histograms
  # only when the upstream check passed (a mismatching variant prints FAIL / INCORRECT and exits 1 via AssertEquals);
  # every later run is compared with those frozen outputs instead. Names: hist.<uchar1|uchar4|float4>.<smem|gmem>.
  mode: data
  cpu_check: {pass_regex: '\sPASS$', fail_regex: '\sFAIL$|INCORRECT'}
  outputs:
  - match: 'hist\.(uchar1|uchar4|float4)\.(smem|gmem)'
    count: 6
    dtype: u32
    rule: {metric: exact}
    cpu: null
    basis: upstream's exact comparison CompareDeviceResults(h_hist, d_hist) of each variant's histogram (the verification
      launch before the timed iterations) against HistogramGold (cuda/histogram_compare.cu:439, element-wise != in
      cuda/test_util.h:545); integer bin counts, compared byte for byte
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the six histograms (uchar1 / uchar4 / float4 x smem / gmem atomics) against the frozen B200 golden reference
    reference/<input_id>.json, byte for byte (sha256), as upstream compared them with the CPU histogram; no CPU
    reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: ctest run line plus two larger random images through the program's own --width/--height
inputs:
- id: w1920-h1080
  case: histogram-256bin
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/histogram-cuda (= ctest): ./main --i=100 (random 1920x1080 image)'
  params:
    width: 1920
    height: 1080
    iterations: 100
  args:
  - --i=100
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: w3840-h2160
  case: histogram-256bin
  variant: size
  source:
    kind: derived
    derivation: --width/--height 3840x2160 (4x pixels)
  params:
    width: 3840
    height: 2160
    iterations: 100
  args:
  - --i=100
  - --width=3840
  - --height=2160
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: w7680-h4320
  case: histogram-256bin
  variant: size
  source:
    kind: derived
    derivation: --width/--height 7680x4320 (16x pixels)
  params:
    width: 7680
    height: 4320
    iterations: 100
  args:
  - --i=100
  - --width=7680
  - --height=4320
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
