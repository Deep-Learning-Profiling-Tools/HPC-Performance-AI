# Registered inputs of spadd (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: spadd
level: 1
selector: null
default_input: m10000
entry:
  kind: binary
  path: build/spadd/cuda/spadd_cuda
timing:
  scope: the port's mean over `repeat` of symbolic + numeric sparse-add time (upstream perf_test metric)
  kind: total
  unit: s
  regex: ^Mean total time:\s*(?P<value>[0-9.eE+-]+)
  select: only
baseline:
  method: 'added check: C recomputed on the CPU (structure exact, values rel 1e-13): PASS/FAIL'
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: pass_marker
    role: required
    regex: ^PASS$
    compare:
      rule: present
  - name: fail_marker
    role: required
    regex: ^FAIL$
    compare:
      rule: absent
coverage:
  status: MULTI_INPUT
  reason: default generated matrices plus a 10x larger pair
inputs:
- id: m10000
  case: spadd-random
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: kokkos/kokkos-kernels
      version: 23a699f3c5bd662bf2ed52116e56533ecc3ddae0
      path: 'perf_test sparse spadd: m = n = 10000, 30 nnz/row generated (= ctest defaults)'
  params:
    m: 10000
    n: 10000
    nnz_per_row: 30
    repeat: 1
  args: []
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: m100000
  case: spadd-random
  variant: size
  source:
    kind: derived
    derivation: --m 100000 --n 100000
  params:
    m: 100000
    n: 100000
    nnz_per_row: 30
    repeat: 1
  args:
  - --m
  - '100000'
  - --n
  - '100000'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
