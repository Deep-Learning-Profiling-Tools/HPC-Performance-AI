# Registered inputs of spadd (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: spadd
level: 1
selector: null
default_input: m10000
entry:
  kind: binary
  path: build/spadd/cuda/spadd_cuda
timing:
  scope: the port's mean over `repeat` of symbolic + numeric sparse-add time (upstream perf_test metric)
  kind: total
  unit: s
  regex: ^Mean total time:\s*(?P<value>[0-9.eE+-]+)
  select: only
baseline:
  method: 'C (row pointers, column indices, values) against the frozen B200 golden reference (`check:` / `golden:`
    below); the added CPU recomputation of C runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes C only when
  # the added CPU check printed PASS; every later run is compared with that frozen output instead.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: nnzC
    dtype: u64
    rule: {metric: exact}
    cpu: null
    basis: the check requires Ccol_ref.size() == nnzC (cuda/main.cu:415)
  - name: Crow
    dtype: u64
    rule: {metric: exact}
    cpu: null
    basis: the check requires Crow_ref == Crow, the full row-pointer array (size_t; cuda/main.cu:415)
  - name: Ccol
    dtype: i32
    rule: {metric: exact}
    cpu: null
    basis: the check requires Ccol[k] == Ccol_ref[k] for every entry (cuda/main.cu:418)
  - name: Cval
    dtype: f64
    rule: {metric: max_rel1p, tol: 1.0e-13}
    cpu: Cval.cpu
    basis: the check fails on |Cval[k] - Cval_ref[k]| > 1e-13 * (1 + |Cval_ref[k]|) (cuda/main.cu:419); the check
      allows 1e-13 minus the B200 output's own deviation from the CPU recomputation
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'nnzC, Crow and Ccol byte-identical and Cval within max |a - g| / (1 + |g|) <= 1e-13 - d0 of the
    frozen B200 golden reference reference/<input_id>.json (d0 = the golden''s deviation from the CPU recomputation
    measured when it was frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: default generated matrices plus a 10x larger pair
inputs:
- id: m10000
  case: spadd-random
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: kokkos/kokkos-kernels
      version: 23a699f3c5bd662bf2ed52116e56533ecc3ddae0
      path: 'perf_test sparse spadd: m = n = 10000, 30 nnz/row generated (= ctest defaults)'
  params:
    m: 10000
    n: 10000
    nnz_per_row: 30
    repeat: 1
  args: []
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: m100000
  case: spadd-random
  variant: size
  source:
    kind: derived
    derivation: --m 100000 --n 100000
  params:
    m: 100000
    n: 100000
    nnz_per_row: 30
    repeat: 1
  args:
  - --m
  - '100000'
  - --n
  - '100000'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
