# Registered inputs of hotspot_3d (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: hotspot_3d
level: 1
selector: null
default_input: g64-l8-i100
entry:
  kind: binary
  path: build/hotspot_3d/cuda/hotspot_3d_cuda
timing:
  scope: the benchmark's own timer around the 3D stencil iterations (printed with 3 decimals -- coarser than a 100-iteration
    run on the 64x64x8 grid)
  kind: total
  unit: s
  regex: '^Time: (?P<value>[0-9.]+) \(s\)'
  select: only
baseline:
  method: 'the temperature field tempOut against the frozen B200 golden reference (`check:` / `golden:` below); the
    built-in CPU reference computeTempCPU (cuda/3D.cu, RMSE ''Accuracy'' enforced <= 1e-2 by verify.py) runs only once,
    offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  # the former quantity accuracy_rmse ('Accuracy:' line) came from the CPU reference and is no longer printed by default.
  # The registry needs one quantity: the program's own failure line (fatal(), cuda/3D.cu:44 -- e.g. an input file that
  # cannot be opened or read), diagnostic only.
  - name: error_marker
    role: diagnostic
    regex: '^Error: '
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 through verify.py and freezes
  # tempOut only when verify.py printed PASS (RMSE vs the CPU reference <= 1e-2); every later run is compared with that
  # frozen output instead. Upstream quirk (kept): hotspot_opt1 copies back tOut_d after the final pointer swap, i.e. the
  # iterate numiter-1; for the registered (even) iteration counts the CPU reference's `answer` buffer also holds iterate
  # numiter-1, so both sides compare the same iterate and the final one is never checked.
  mode: data
  cpu_check:
    command: [python3, '{bench_dir}/verify.py', '{exe}', '{arg:0}', '{arg:1}', '{arg:2}', '{arg:3}', '{arg:4}']
    pass_regex: '^PASS: accuracy'
    fail_regex: '^FAIL'
  outputs:
  - name: tempOut
    dtype: f32
    rule: {metric: rmse, tol: 1.0e-2}
    cpu: tempOut.cpu
    basis: the built-in RMSE accuracy(tempOut, answer) = sqrt(sum (a - b)^2 / len) against computeTempCPU (cuda/3D.cu:144,
      :216), enforced acc > 1e-2 -> FAIL by verify.py:30; the check allows 1e-2 minus the B200 output's own RMSE from
      the CPU reference
  # a second rule on the same array (both must hold). Not upstream: the RMSE over 32768 elements lets one element be off
  # by up to ~1.8 K. Measured 2026-10-28 (B200): 23 legitimate variants within max |a - g| <= 3.9e-3 / 9.3e-3 / 1.13e-2 K
  # at i100 / i1000 / i10000 (>= 4.3x below this limit; for spread deviations the RMSE rule above stays the tighter
  # one, 6.5e-3 of 1e-2 at i10000), single-element errors >= 0.05 K fail.
  - name: tempOut
    dtype: f32
    rule: {metric: max_abs, tol: 5.0e-2}
    cpu: tempOut.cpu
    basis: 'per-element gate next to the upstream RMSE (no upstream equivalent): max |a - g| <= 5e-2 K minus the B200
      output''s own max deviation from computeTempCPU; legitimate implementations (FMA on/off, CPU-reference, reversed and
      pairwise term order, two factorized forms, delta form, precomputed source term, f64 arithmetic or state, other
      block shapes, a 3D grid, shared-memory tiles) <= 1.13e-2 K, a single element off by >= 0.05 K fails (the RMSE rule
      alone allows ~1.8 K)'
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'tempOut against the frozen B200 golden reference reference/<input_id>.json (RMSE <= 1e-2 - d0, d0 = the
    golden''s RMSE from the built-in CPU reference measured when it was frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: the vendored 64x8 grid at three iteration counts is registered; the canonical 512x8 grid is not vendored
  blocker: power/temp_512x8 (~42 MB) are not in the repository; needs the external-artifact mechanism
  upstream_inputs_not_added:
  - data/hotspot3D/power_512x8+temp_512x8
inputs:
- id: g64-l8-i100
  case: hotspot-3d
  variant: default
  source:
    kind: upstream-file
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: 'cuda/hotspot3D run: ./3D 64 8 100 power_64x8 temp_64x8 output.out (= ctest)'
  params:
    grid: 64
    layers: 8
    iterations: 100
  args:
  - '64'
  - '8'
  - '100'
  - level1/hotspot_3d/data/power_64x8
  - level1/hotspot_3d/data/temp_64x8
  - output.out
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/power_64x8
  - data/temp_64x8
  input_form: file
- id: g64-l8-i1000
  case: hotspot-3d
  variant: steps
  source:
    kind: derived
    derivation: 1000 iterations
  params:
    grid: 64
    layers: 8
    iterations: 1000
  args:
  - '64'
  - '8'
  - '1000'
  - level1/hotspot_3d/data/power_64x8
  - level1/hotspot_3d/data/temp_64x8
  - output.out
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/power_64x8
  - data/temp_64x8
  input_form: file
- id: g64-l8-i10000
  case: hotspot-3d
  variant: steps
  source:
    kind: derived
    derivation: 10000 iterations
  params:
    grid: 64
    layers: 8
    iterations: 10000
  args:
  - '64'
  - '8'
  - '10000'
  - level1/hotspot_3d/data/power_64x8
  - level1/hotspot_3d/data/temp_64x8
  - output.out
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/power_64x8
  - data/temp_64x8
  input_form: file
