# Registered inputs of hotspot (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: hotspot
level: 1
selector: null
default_input: g512-p2-t2
entry:
  kind: binary
  path: build/hotspot/cuda/hotspot_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: 'the port''s pin_stats timer macro (printf "timer: ...") is compiled out in this build: the binary prints
    only the configuration lines (survey log); the temperature field goes to output.out'
baseline:
  method: 'no PASS line; the temperature field against the frozen B200 golden reference (`check:` / `golden:` below);
    verify.py (numpy float32 re-simulation) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: grid_line
    role: diagnostic
    regex: '^gridSize: \[\d+, \d+\]'
    compare:
      rule: present
coverage:
  status: MULTI_INPUT
  reason: the vendored 512 grid at three iteration counts is registered; upstream's 64 and 1024 grids are not vendored
  blocker: temp/power_64 and temp/power_1024 (upstream data package, ~11 MB each at 1024) are not in the repository;
    needs the external-artifact mechanism
  upstream_inputs_not_added:
  - data/hotspot/temp_64+power_64
  - data/hotspot/temp_1024+power_1024
inputs:
- id: g512-p2-t2
  case: hotspot-2d
  variant: default
  source:
    kind: upstream-file
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: 'cuda/hotspot run.sh: ./hotspot 512 2 2 temp_512 power_512 output.out (= ctest)'
  params:
    grid: 512
    pyramid_height: 2
    sim_time: 2
  args:
  - '512'
  - '2'
  - '2'
  - level1/hotspot/data/temp_512
  - level1/hotspot/data/power_512
  - output.out
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/temp_512
  - data/power_512
  input_form: file
- id: g512-p2-t20
  case: hotspot-2d
  variant: steps
  source:
    kind: derived
    derivation: sim_time (iterations) 20 on the upstream 512 grid
  params:
    grid: 512
    pyramid_height: 2
    sim_time: 20
  args:
  - '512'
  - '2'
  - '20'
  - level1/hotspot/data/temp_512
  - level1/hotspot/data/power_512
  - output.out
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/temp_512
  - data/power_512
  input_form: file
- id: g512-p2-t200
  case: hotspot-2d
  variant: steps
  source:
    kind: derived
    derivation: sim_time 200
  params:
    grid: 512
    pyramid_height: 2
    sim_time: 200
  args:
  - '512'
  - '2'
  - '200'
  - level1/hotspot/data/temp_512
  - level1/hotspot/data/power_512
  - output.out
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/temp_512
  - data/power_512
  input_form: file
golden:
  # tools/golden/README.md. make runs verify.py once with HPCPERF_CPU_REFERENCE=1 and HPCPERF_GOLDEN_DUMP: verify.py runs
  # the unmodified binary (which captures the float32 field it writes to output.out) and re-simulates the transient in
  # numpy float32 (captured as temperature.cpu); the capture is frozen only when verify.py printed PASS.
  mode: data
  cpu_check:
    command: [python3, '{bench_dir}/verify.py', '{exe}', '{param:grid}', '{param:pyramid_height}', '{param:sim_time}', '{arg:3}', '{arg:4}']
    pass_regex: '^PASS: hotspot output matches CPU reference'
    fail_regex: '^FAIL'
  outputs:
  - name: temperature
    dtype: f32
    rule: {metric: max_rel1p, tol: 1.0e-3}
    cpu: temperature.cpu
    basis: verify.py's check max |gpu - ref| / (1 + |ref|) <= 1e-3 against its numpy float32 re-simulation
      (level1/hotspot/verify.py:53-54), here on the binary's float32 MatrixOut (cuda/hotspot.cu, after the final copy-back)
      instead of output.out's %g text; the check allows 1e-3 minus the B200 field's own deviation from that CPU reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the temperature field against the frozen B200 golden reference reference/<input_id>.json (max |a - g| / (1 + |g|)
    <= 1e-3 - d0, d0 = the golden''s deviation from verify.py''s CPU re-simulation measured when it was frozen); no CPU
    reference is run'
  covers: all
