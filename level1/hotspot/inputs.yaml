# Registered inputs of hotspot (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: hotspot
level: 1
selector: null
default_input: g512-p2-t2
entry:
  kind: binary
  path: build/hotspot/cuda/hotspot_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: 'the port''s pin_stats timer macro (printf "timer: ...") is compiled out in this build: the binary prints
    only the configuration lines (survey log); the temperature field goes to output.out'
baseline:
  method: 'no PASS line; the temperature field against the frozen B200 golden reference (`check:` / `golden:` below);
    verify.py (numpy float32 re-simulation) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: grid_line
    role: diagnostic
    regex: '^gridSize: \[\d+, \d+\]'
    compare:
      rule: present
coverage:
  status: MULTI_INPUT
  reason: the vendored 512 grid at three iteration counts is registered; upstream's 64 and 1024 grids are not vendored
  blocker: temp/power_64 and temp/power_1024 (upstream data package, ~11 MB each at 1024) are not in the repository;
    needs the external-artifact mechanism
  upstream_inputs_not_added:
  - data/hotspot/temp_64+power_64
  - data/hotspot/temp_1024+power_1024
inputs:
- id: g512-p2-t2
  case: hotspot-2d
  variant: default
  source:
    kind: upstream-file
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: 'cuda/hotspot run.sh: ./hotspot 512 2 2 temp_512 power_512 output.out (= ctest)'
  params:
    grid: 512
    pyramid_height: 2
    sim_time: 2
  args:
  - '512'
  - '2'
  - '2'
  - level1/hotspot/data/temp_512
  - level1/hotspot/data/power_512
  - output.out
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/temp_512
  - data/power_512
  input_form: file
- id: g512-p2-t20
  case: hotspot-2d
  variant: steps
  source:
    kind: derived
    derivation: sim_time (iterations) 20 on the upstream 512 grid
  params:
    grid: 512
    pyramid_height: 2
    sim_time: 20
  args:
  - '512'
  - '2'
  - '20'
  - level1/hotspot/data/temp_512
  - level1/hotspot/data/power_512
  - output.out
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/temp_512
  - data/power_512
  input_form: file
- id: g512-p2-t200
  case: hotspot-2d
  variant: steps
  source:
    kind: derived
    derivation: sim_time 200
  params:
    grid: 512
    pyramid_height: 2
    sim_time: 200
  args:
  - '512'
  - '2'
  - '200'
  - level1/hotspot/data/temp_512
  - level1/hotspot/data/power_512
  - output.out
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/temp_512
  - data/power_512
  input_form: file
- id: g512-p2-t21-pnoise9
  purpose: correctness-probe
  probe_basis: >-
    with the vendored power map every cell changes by only 0.016-0.018 K per step (the leakage term (80 - T) * Rz_1;
    the power term is <= 0.00096 K per step because the time step makes the maximum power density heat a cell by
    PRECISION = 0.001 K, cuda/hotspot.cu:237-238), i.e. 5.7e-5 per step of the 1 + |T| ~ 324 K denominator of
    max_rel1p, against 1e-3 (0.32 K, ~19 steps): a no-op passes g512-p2-t2, one skipped iteration, a dropped power
    term and an f16-rounded output pass all three performance inputs, a stale block in the last launch passes t20 and
    t200 (measured 2026-10-28).
    This probe heats the vendored temp_512 with power_512 + 0..9 W of deterministic random power per cell (0..3.1 K
    per step, different in every cell) for 21 steps (10 pyramid launches of 2 steps and a 1-step remainder). Measured
    2026-10-28 (B200, max_rel1p against the frozen probe reference): no-op 0.147, one iteration fewer or more 6.4e-3,
    time step +1% 1.3e-3, one stale block in the last launch 1.65e-2..1.74e-2 (centre, corner, edge block), stale
    pyramid halo 3.4e-3, ghost zone one cell short 0.33, tiles without halo 4.1e-2, frozen or periodic boundary 0.147 /
    3.6e-2, dropped power / leakage term 0.148 / 1.1e-3, ambient 0 instead of 80 3.4e-4, wrong neighbour 2.9e-2,
    f16 state 3.6e-3, f16-rounded input or output field 3.5e-4 / 3.7e-4; legitimate variants (fmad off, fast math,
    blocks 8/32, pyramid heights 1-7 and 12, f32 or f64 arithmetic, f64 state, precomputed, centre-coefficient and
    delta forms, other summation orders, one step per launch) <= 2.7e-6. Not caught robustly: an f16-stored power map
    (4.3e-5, 1.4x above the tolerance) and f16-rounded increments on an f32 state (1.3e-5, passes)
  case: hotspot-2d
  variant: case
  source:
    kind: derived
    derivation: 'the vendored 512 grid: initial temperature temp_512 unchanged; power map power_512 + 9 W x u(k),
      u(k) = lowbias32(k) / 2^32 of the row-major cell index k, written at configure time by data/gen_probe.py to
      build/hotspot/cuda/data/power_512_pnoise9; sim_time 21 with upstream''s pyramid height 2; no source change'
  params:
    grid: 512
    pyramid_height: 2
    sim_time: 21
    power: power_512 + 9 W x lowbias32(k) / 2^32 (data/gen_probe.py)
  args:
  - '512'
  - '2'
  - '21'
  - level1/hotspot/data/temp_512
  - build/hotspot/cuda/data/power_512_pnoise9
  - output.out
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/temp_512
  - data/power_512
  - data/gen_probe.py
  input_form: file
  golden:
    # per-input rule (the benchmark-level spec below and the performance inputs' references are unchanged)
    mode: data
    cpu_check:
      command: [python3, '{bench_dir}/verify.py', '{exe}', '{param:grid}', '{param:pyramid_height}', '{param:sim_time}', '{arg:3}', '{arg:4}']
      pass_regex: '^PASS: hotspot output matches CPU reference'
      fail_regex: '^FAIL'
    outputs:
    - name: temperature
      dtype: f32
      rule: {metric: max_rel1p, tol: 3.0e-5}
      cpu: temperature.cpu
      basis: 'the metric of verify.py''s check max |gpu - ref| / (1 + |ref|) (level1/hotspot/verify.py:53-54; upstream Rodinia
        has no check, verify.py and its 1e-3 are this repository''s) on the binary''s float32 MatrixOut; the tolerance from
        measurements on this probe (2026-10-28): legitimate variants <= 2.7e-6, the smallest deviations that must fail
        3.4e-4 (ambient temperature 0), 3.5e-4 / 3.7e-4 (f16-rounded input / output field); 3e-5 is their geometric
        mean (about 11x margin on each side), minus the B200 field''s own deviation from the CPU reference'
golden:
  # tools/golden/README.md. make runs verify.py once with HPCPERF_CPU_REFERENCE=1 and HPCPERF_GOLDEN_DUMP: verify.py runs
  # the unmodified binary (which captures the float32 field it writes to output.out) and re-simulates the transient in
  # numpy float32 (captured as temperature.cpu); the capture is frozen only when verify.py printed PASS.
  mode: data
  cpu_check:
    command: [python3, '{bench_dir}/verify.py', '{exe}', '{param:grid}', '{param:pyramid_height}', '{param:sim_time}', '{arg:3}', '{arg:4}']
    pass_regex: '^PASS: hotspot output matches CPU reference'
    fail_regex: '^FAIL'
  outputs:
  - name: temperature
    dtype: f32
    rule: {metric: max_rel1p, tol: 1.0e-3}
    cpu: temperature.cpu
    basis: verify.py's check max |gpu - ref| / (1 + |ref|) <= 1e-3 against its numpy float32 re-simulation
      (level1/hotspot/verify.py:53-54), here on the binary's float32 MatrixOut (cuda/hotspot.cu, after the final copy-back)
      instead of output.out's %g text; the check allows 1e-3 minus the B200 field's own deviation from that CPU reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the temperature field against the frozen B200 golden reference reference/<input_id>.json (max |a - g| / (1 + |g|)
    <= 1e-3 - d0, d0 = the golden''s deviation from verify.py''s CPU re-simulation measured when it was frozen); no CPU
    reference is run'
  covers: all
