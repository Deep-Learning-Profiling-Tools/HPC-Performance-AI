# Registered inputs of black_scholes (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: black_scholes
level: 1
selector: null
default_input: x1048576
entry:
  kind: binary
  path: build/black_scholes/cuda/black_scholes_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: the port exposes no timing option (upstream's benchmark_runner -t timing mode is not wired into the CLI);
    only the verification line is printed
baseline:
  method: 'call/put prices against the frozen B200 golden reference (`check:` / `golden:` below); the upstream
    CPU implementation (Verify, BlackScholesCPU) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: (FAIL|[Ff]ail)
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the prices
  # only when upstream Verify printed 'Passed.'; every later run is compared with that frozen output instead.
  mode: data
  cpu_check: {pass_regex: '^Passed\.$', fail_regex: '^Verification failed'}
  outputs:
  - name: call_price
    dtype: f32
    rule: {metric: max_abs, tol: 1.0e-4}
    cpu: call_price.cpu
    basis: upstream Verify fails on fabs(verify_call_price_[y] - call_price_[y]) > 1e-4f for every padded element
      (num_tiles_ * tile_size_; common/bs_benchmark.cc:168); the check allows 1e-4 minus the B200 output's own
      deviation from the CPU reference
  - name: put_price
    dtype: f32
    rule: {metric: max_abs, tol: 1.0e-4}
    cpu: put_price.cpu
    basis: upstream Verify fails on fabs(verify_put_price_[y] - put_price_[y]) > 1e-4f (common/bs_benchmark.cc:175);
      the check allows 1e-4 minus the B200 output's own deviation from the CPU reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'call_price and put_price against the frozen B200 golden reference reference/<input_id>.json
    (max |a - g| <= 1e-4 - d0 each, d0 = the golden''s deviation from the upstream CPU implementation measured when
    it was frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: three points of the upstream -x size sweep
inputs:
- id: x1048576
  case: black-scholes
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: NUCAR-DEV/Hetero-Mark
      version: aa685e02705f4be380cba215c6df10b42262a9cd
      path: bs benchmark -x 1048576 (= ctest; upstream benchmark.py sweeps -x)
  params:
    options: 1048576
  args:
  - -x
  - '1048576'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: x4194304
  case: black-scholes
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: NUCAR-DEV/Hetero-Mark
      version: aa685e02705f4be380cba215c6df10b42262a9cd
      path: upstream sweep parameter -x, 4 M options
  params:
    options: 4194304
  args:
  - -x
  - '4194304'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: x16777216
  case: black-scholes
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: NUCAR-DEV/Hetero-Mark
      version: aa685e02705f4be380cba215c6df10b42262a9cd
      path: upstream sweep parameter -x, 16 M options
  params:
    options: 16777216
  args:
  - -x
  - '16777216'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
