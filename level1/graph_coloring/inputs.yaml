# Registered inputs of graph_coloring (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: graph_coloring
level: 1
selector: null
default_input: nv200000
entry:
  kind: binary
  path: build/graph_coloring/cuda/graph_coloring_cuda
timing:
  scope: the port's own timer around the coloring phases (graph generation excluded)
  kind: total
  unit: s
  regex: '^Time: (?P<value>[0-9.eE+-]+) Num colors'
  select: only
baseline:
  method: 'added check: coloring validity on the CPU: PASS/FAIL; colour and phase counts recorded'
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: pass_marker
    role: required
    regex: ^PASS$
    compare:
      rule: present
  - name: fail_marker
    role: required
    regex: ^FAIL$
    compare:
      rule: absent
  - name: num_colors
    role: diagnostic
    regex: 'Num colors: (?P<value>\d+)'
    select: only
    compare:
      rule: record
coverage:
  status: MULTI_INPUT
  reason: default generated graph plus a 5x larger one through --nv (upstream reads .mtx files, none vendored)
inputs:
- id: nv200000
  case: graph-coloring-random
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: kokkos/kokkos-kernels
      version: 23a699f3c5bd662bf2ed52116e56533ecc3ddae0
      path: 'perf_test graph_color on a kk_sparseMatrix_generate graph (srand 13721): --nv 200000, 30 nnz/row (=
        ctest defaults)'
  params:
    nv: 200000
    nnz_per_row: 30
    repeat: 1
  args: []
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: nv1000000
  case: graph-coloring-random
  variant: size
  source:
    kind: derived
    derivation: --nv 1000000 with the same generator
  params:
    nv: 1000000
    nnz_per_row: 30
    repeat: 1
  args:
  - --nv
  - '1000000'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
