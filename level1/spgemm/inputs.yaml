# Registered inputs of spgemm (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: spgemm
level: 1
selector: null
default_input: m10000
entry:
  kind: binary
  path: build/spgemm/cuda/spgemm_cuda
timing:
  scope: the port's numeric-phase time (upstream perf_test mm_time)
  kind: total
  unit: s
  regex: '^mm_time: (?P<value>[0-9.eE+-]+) \(numeric phase'
  select: only
baseline:
  method: 'added check: C compared with a CPU product: PASS/FAIL'
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: pass_marker
    role: required
    regex: ^PASS$
    compare:
      rule: present
  - name: fail_marker
    role: required
    regex: ^FAIL$
    compare:
      rule: absent
coverage:
  status: MULTI_INPUT
  reason: default generated matrix plus a 10x larger one
inputs:
- id: m10000
  case: spgemm-kkmem
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: kokkos/kokkos-kernels
      version: 23a699f3c5bd662bf2ed52116e56533ecc3ddae0
      path: 'perf_test sparse spgemm --algorithm KKMEM: m = 10000, 30 nnz/row generated (= ctest defaults)'
  params:
    m: 10000
    nnz_per_row: 30
    repeat: 1
  args: []
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: m100000
  case: spgemm-kkmem
  variant: size
  source:
    kind: derived
    derivation: --m 100000
  params:
    m: 100000
    nnz_per_row: 30
    repeat: 1
  args:
  - --m
  - '100000'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
