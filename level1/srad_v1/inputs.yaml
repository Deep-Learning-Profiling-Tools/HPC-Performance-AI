# Registered inputs of srad_v1 (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: srad_v1
level: 1
selector: null
default_input: iter100
entry:
  kind: binary
  path: build/srad_v1/cuda/srad_v1_cuda
timing:
  scope: 'upstream''s own stage timer for the COMPUTE stage (all SRAD iterations: prepare/reduce/srad/srad2 kernels;
    cuda/main.cu time7 -> time8): host wall clock WITHOUT a device synchronize -- it is complete only because every
    iteration blocks on the cudaMemcpy of the two sums; it starts after the asynchronous extract launch and stops before
    the last iteration''s srad/srad2 finish (B200, 2026-10-27: 0.27-0.31 ms less than the synchronized tools/timing ROI,
    which also covers extract and compress). A variant without the per-iteration host round-trip would be timed as
    launch overhead only, so candidates are timed with tools/timing (synchronized ROI), not with this line; setup,
    image I/O and transfers are separate stages'
  kind: total
  unit: s
  regex: '^\s*(?P<value>[0-9.]+) s,\s+[0-9.]+ % : COMPUTE$'
  select: only
baseline:
  method: 'no PASS line; the output image against the frozen B200 golden reference (`check:` / `golden:` below);
    verify.py (numpy float32 re-implementation) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: total_time_line
    role: diagnostic
    regex: '^Total time:'
    compare:
      rule: present
coverage:
  status: MULTI_INPUT
  reason: the upstream image at three iteration counts (the image size is fixed by the only upstream input file)
inputs:
- id: iter100
  case: srad-v1-image
  variant: default
  source:
    kind: upstream-file
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: 'cuda/srad_v1 run: ./srad 100 0.5 502 458 image.pgm (= ctest; upstream image)'
  params:
    iterations: 100
    lambda: 0.5
    rows: 502
    cols: 458
  args:
  - '100'
  - '0.5'
  - '502'
  - '458'
  - level1/srad_v1/data/image.pgm
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/image.pgm
  input_form: file
- id: iter500
  case: srad-v1-image
  variant: steps
  source:
    kind: derived
    derivation: 500 SRAD iterations on the upstream image
  params:
    iterations: 500
    lambda: 0.5
    rows: 502
    cols: 458
  args:
  - '500'
  - '0.5'
  - '502'
  - '458'
  - level1/srad_v1/data/image.pgm
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/image.pgm
  input_form: file
- id: iter2000
  case: srad-v1-image
  variant: steps
  source:
    kind: derived
    derivation: 2000 iterations
  params:
    iterations: 2000
    lambda: 0.5
    rows: 502
    cols: 458
  args:
  - '2000'
  - '0.5'
  - '502'
  - '458'
  - level1/srad_v1/data/image.pgm
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/image.pgm
  input_form: file
golden:
  # tools/golden/README.md. make runs verify.py once with HPCPERF_CPU_REFERENCE=1 and HPCPERF_GOLDEN_DUMP: verify.py runs
  # the unmodified binary (which captures the float image before write_graphics truncates it to int) and re-implements
  # extract -> niter x (statistics, srad, srad2) -> compress in numpy float32 (captured as image.cpu, same column-major
  # order); the capture is frozen only when verify.py printed PASS.
  mode: data
  cpu_check:
    command: [python3, '{bench_dir}/verify.py', '{exe}', '{arg:0}', '{arg:1}', '{arg:2}', '{arg:3}', '{arg:4}']
    pass_regex: '^PASS: srad output image matches CPU reference'
    fail_regex: '^FAIL'
  outputs:
  - name: image
    dtype: f32
    rule: {metric: trunc_int, tol: 3, frac_tol: 0.001}
    cpu: image.cpu
    basis: verify.py's check on the (int)-truncated image (what write_graphics writes) -- max pixel difference <= 3 and
      at most 0.1 % of the pixels differ by more than 1 (level1/srad_v1/verify.py:78-81); made conservative here (the
      share counts pixels differing by >= 1) and applied to the binary's float image (cuda/main.cu, after the copy-back)
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the output image against the frozen B200 golden reference reference/<input_id>.json (truncated pixels: max
    difference <= 3 - d0 and share of pixels differing by >= 1 <= 0.001 - f0, d0 / f0 = the golden''s deviation from
    verify.py''s CPU re-implementation measured when it was frozen); no CPU reference is run'
  covers: all
