# Registered inputs of srad_v1 (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: srad_v1
level: 1
selector: null
default_input: iter100
entry:
  kind: binary
  path: build/srad_v1/cuda/srad_v1_cuda
timing:
  scope: 'upstream''s own stage timer for the COMPUTE stage (all SRAD iterations: prepare/reduce/srad/srad2 kernels;
    cuda/main.cu time7 -> time8): host wall clock WITHOUT a device synchronize -- it is complete only because every
    iteration blocks on the cudaMemcpy of the two sums; it starts after the asynchronous extract launch and stops before
    the last iteration''s srad/srad2 finish (B200, 2026-10-27: 0.27-0.31 ms less than the synchronized tools/timing ROI,
    which also covers extract and compress). A variant without the per-iteration host round-trip would be timed as
    launch overhead only, so candidates are timed with tools/timing (synchronized ROI), not with this line; setup,
    image I/O and transfers are separate stages'
  kind: total
  unit: s
  regex: '^\s*(?P<value>[0-9.]+) s,\s+[0-9.]+ % : COMPUTE$'
  select: only
baseline:
  method: 'no PASS line; the output image against the frozen B200 golden reference (`check:` / `golden:` below);
    verify.py (numpy float32 re-implementation) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: total_time_line
    role: diagnostic
    regex: '^Total time:'
    compare:
      rule: present
coverage:
  status: MULTI_INPUT
  reason: the upstream image at three iteration counts (the image size is fixed by the only upstream input file)
inputs:
- id: iter100
  case: srad-v1-image
  variant: default
  source:
    kind: upstream-file
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: 'cuda/srad_v1 run: ./srad 100 0.5 502 458 image.pgm (= ctest; upstream image)'
  params:
    iterations: 100
    lambda: 0.5
    rows: 502
    cols: 458
  args:
  - '100'
  - '0.5'
  - '502'
  - '458'
  - level1/srad_v1/data/image.pgm
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/image.pgm
  input_form: file
- id: iter500
  case: srad-v1-image
  variant: steps
  source:
    kind: derived
    derivation: 500 SRAD iterations on the upstream image
  params:
    iterations: 500
    lambda: 0.5
    rows: 502
    cols: 458
  args:
  - '500'
  - '0.5'
  - '502'
  - '458'
  - level1/srad_v1/data/image.pgm
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/image.pgm
  input_form: file
- id: iter2000
  case: srad-v1-image
  variant: steps
  source:
    kind: derived
    derivation: 2000 iterations
  params:
    iterations: 2000
    lambda: 0.5
    rows: 502
    cols: 458
  args:
  - '2000'
  - '0.5'
  - '502'
  - '458'
  - level1/srad_v1/data/image.pgm
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/image.pgm
  input_form: file
- id: probe-edges-n20
  purpose: correctness-probe
  probe_basis: >-
    on the registered image (data/image.pgm) the SRAD coefficient c is < 1 at only 124 pixels (iteration 0) and 54
    (iteration 1) and nowhere afterwards, so plain isotropic diffusion (c = 1), upstream's reduction bug (q0sqr 0.85), a
    constant, stale or once-computed q0sqr and statistics of half the image all pass the image check of the three
    performance inputs (plain diffusion differs by 0.0334 / 0.00264 / 2.7e-4 grey levels; measured 2026-10-27/28).
    data/probe_edges.pgm (small high-contrast objects on a strongly textured background) keeps c < 1 at 5247-134096
    pixels in every one of its 20 iterations and its q0sqr changes quickly (0.0187 -> 0.0083, 24 % in the first
    iteration). Against the fixed B200 output (max |difference|, grey levels; real gate, 2026-10-28): plain diffusion
    and the reduction bug 130, a constant q0sqr 0.02 / 0.05 88 / 126, q0sqr computed once 81, refreshed every 10th / 5th
    / 2nd iteration 45 / 23.7 / 4.4, statistics of half the image 17.6, q0sqr of the previous iteration 7.3, an fp16
    image 1.51 -- all fail; legitimate variants stay within 0.11: per-element float atomics 0.015-0.109 (23 runs),
    one-thread float32 sums in Rodinia OpenMP's / memory order 0.098 / 0.036, thread-coarsened sums (8-32768 elements
    per thread) <= 0.024, block partials + atomics, Thrust, double accumulation, 128-1024 threads per block <= 1.4e-3,
    float constants, -fmad=false, --use_fast_math <= 2.2e-4; upstream's own CPU implementation (Rodinia 3.1 OpenMP
    srad_v1, unmodified) 0.099 and verify.py 9.7e-4. Resolution: a q0sqr bias of 0.5 % moves the image by 0.69, 1 % by
    1.40
  case: srad-v1-probe
  variant: case
  source:
    kind: custom
    derivation: >-
      data/probe_edges.pgm, generated by data/make_probe_edges.py (deterministic integer hash, no random-number
      library): the upstream image size (502 x 458, cuda/main.cu reads exactly that) and header, a textured background
      (grey 50..70 +-40) with small objects of grey 200 +-40 (1.9 % of the pixels); 20 SRAD iterations, lambda 0.5 as
      upstream. Upstream has no input on which the diffusion coefficient matters, hence custom
  params:
    iterations: 20
    lambda: 0.5
    rows: 502
    cols: 458
  args:
  - '20'
  - '0.5'
  - '502'
  - '458'
  - level1/srad_v1/data/probe_edges.pgm
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/probe_edges.pgm
  input_form: file
  golden:
    mode: data
    cpu_check:
      command: [python3, '{bench_dir}/verify.py', '{exe}', '{arg:0}', '{arg:1}', '{arg:2}', '{arg:3}', '{arg:4}']
      pass_regex: '^PASS: srad output image matches CPU reference'
      fail_regex: '^FAIL'
    outputs:
    - name: image
      dtype: f32
      rule: {metric: max_abs, tol: 1.0}
      cpu: image.cpu
      basis: >-
        the float image (before write_graphics truncates it) within 1 grey level of the frozen B200 output (tol 1 - d0,
        d0 = max |B200 - verify.py's CPU reference|). |a - g| <= 1 implies |trunc a - trunc g| <= 1 at every pixel, so
        the rule is stricter than verify.py's own check (max <= 3, <= 0.1 % of the pixels off by more than 1;
        verify.py:78-81), which make still requires of the CPU validation. Measured 2026-10-28: legitimate variants
        within 0.11 (9x below the limit), the closest wrong candidate (an fp16 image) 1.51, a stale q0sqr 7.3. The
        performance inputs' share clause (pixels off by >= 1) is not used here -- legitimate float32 summation orders of
        the statistic move up to 0.14 % of this image's pixels across an integer (Rodinia 3.1 OpenMP) while staying
        within 0.11 grey levels (README "Correctness probe")
golden:
  # tools/golden/README.md. make runs verify.py once with HPCPERF_CPU_REFERENCE=1 and HPCPERF_GOLDEN_DUMP: verify.py runs
  # the unmodified binary (which captures the float image before write_graphics truncates it to int) and re-implements
  # extract -> niter x (statistics, srad, srad2) -> compress in numpy float32 (captured as image.cpu, same column-major
  # order); the capture is frozen only when verify.py printed PASS.
  mode: data
  cpu_check:
    command: [python3, '{bench_dir}/verify.py', '{exe}', '{arg:0}', '{arg:1}', '{arg:2}', '{arg:3}', '{arg:4}']
    pass_regex: '^PASS: srad output image matches CPU reference'
    fail_regex: '^FAIL'
  outputs:
  - name: image
    dtype: f32
    rule: {metric: trunc_int, tol: 3, frac_tol: 0.001}
    cpu: image.cpu
    basis: verify.py's check on the (int)-truncated image (what write_graphics writes) -- max pixel difference <= 3 and
      at most 0.1 % of the pixels differ by more than 1 (level1/srad_v1/verify.py:78-81); made conservative here (the
      share counts pixels differing by >= 1) and applied to the binary's float image (cuda/main.cu, after the copy-back)
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the output image against the frozen B200 golden reference reference/<input_id>.json (truncated pixels: max
    difference <= 3 - d0 and share of pixels differing by >= 1 <= 0.001 - f0, d0 / f0 = the golden''s deviation from
    verify.py''s CPU re-implementation measured when it was frozen); no CPU reference is run'
  covers: all
