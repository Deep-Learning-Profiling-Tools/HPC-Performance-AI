# Registered inputs of murmurhash3 (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: murmurhash3
level: 1
selector: null
default_input: k100000
entry:
  kind: binary
  path: build/murmurhash3/cuda/murmurhash3_cuda
timing:
  scope: the benchmark's own timer around the hash kernel averaged over `repeat` launches (main_compute = average
    x repeat)
  kind: per_iteration
  unit: s
  regex: ^Average kernel execution time (?P<value>[0-9.eE+-]+) \(s\)
  select: only
  work:
    key: repeat
    offset: 0
baseline:
  method: 'the 128-bit hashes against the frozen B200 golden reference (`check:` / `golden:` below); the upstream host
    MurmurHash3_x64_128 reference (cuda/murmurhash3.cu) runs only once, offline, to validate that reference (tools/golden
    make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: FAIL
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the hashes only
  # when the upstream check printed SUCCESS; every later run is compared with that frozen output instead.
  mode: data
  cpu_check: {pass_regex: '^SUCCESS$', fail_regex: '^FAIL$'}
  outputs:
  - name: hash
    dtype: u64
    rule: {metric: exact}
    cpu: null
    basis: upstream's exact comparison of both 64-bit halves of every key's hash, d_out[2*i] != out[i][0] ||
      d_out[2*i+1] != out[i][1] -> FAIL, against the host MurmurHash3_x64_128 (cuda/murmurhash3.cu:244); 2 x numKeys
      integers, compared byte for byte
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the 2 x numKeys 64-bit hash words against the frozen B200 golden reference reference/<input_id>.json, byte for
    byte (sha256), as upstream compared them with the host MurmurHash3; no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus two larger key counts
inputs:
- id: k100000
  case: murmurhash3-128
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/murmurhash3-cuda Makefile run: ./main 100000 100 (= ctest)'
  params:
    keys: 100000
    repeat: 100
  args:
  - '100000'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: k200000
  case: murmurhash3-128
  variant: size
  source:
    kind: derived
    derivation: >-
      keys x2. The port draws every key length as rand() % 10000 (mean ~5,000 bytes) and stores the key
      offsets as uint32_t, so the concatenated key buffer must stay below 4 GiB (about 850,000 keys):
      the x10 size (1,000,000 keys, ~5 GB) segfaults during the host copy; that attempt is kept in the
      rollout measurements as an unregistered record (k1000000).
  params:
    keys: 200000
    repeat: 100
  args:
  - '200000'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: k400000
  case: murmurhash3-128
  variant: size
  source:
    kind: derived
    derivation: keys x4 (~2 GB of keys, half of the port's uint32 offset limit; see k200000)
  params:
    keys: 400000
    repeat: 100
  args:
  - '400000'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
