# Registered inputs of bfs (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: bfs
level: 1
selector: null
default_input: graph65536
entry:
  kind: binary
  path: build/bfs/cuda/bfs_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: the CUDA port prints only 'Kernel Executed N times'; hop counts go to result.txt (golden check)
baseline:
  method: 'no PASS line from the binary; the hop counts against the frozen B200 golden reference (`check:` / `golden:`
    below); verify.py (CPU BFS) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: kernel_executed
    role: diagnostic
    regex: ^Kernel Executed \d+ times
    compare:
      rule: present
coverage:
  status: MULTI_INPUT
  reason: two upstream graph files are vendored and registered; the canonical graph1MW_6.txt (1 M nodes, 64 MB)
    is not
  blocker: graph1MW_6.txt is too large for git and upstream's inputGen generator is not vendored; needs the external-artifact
    mechanism or a vendored deterministic generator
  upstream_inputs_not_added:
  - data/bfs/graph1MW_6.txt (1,000,000 nodes)
inputs:
- id: graph65536
  case: bfs-rodinia-graph
  variant: default
  source:
    kind: upstream-file
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: data/bfs/graph65536.txt (upstream file, = ctest)
  params:
    nodes: 65536
  args:
  - level1/bfs/data/graph65536.txt
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/graph65536.txt
  input_form: file
- id: graph4096
  case: bfs-rodinia-graph
  variant: size
  source:
    kind: upstream-file
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: data/bfs/graph4096.txt (upstream file)
  params:
    nodes: 4096
  args:
  - level1/bfs/data/graph4096.txt
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/graph4096.txt
  input_form: file
golden:
  # tools/golden/README.md. make runs verify.py once with HPCPERF_CPU_REFERENCE=1 and HPCPERF_GOLDEN_DUMP: verify.py runs
  # the unmodified binary (which captures its hop counts) and recomputes every hop count with an independent CPU BFS;
  # the capture is frozen only when verify.py printed PASS; every later run is compared with that frozen output instead.
  mode: data
  cpu_check:
    command: [python3, '{bench_dir}/verify.py', '{exe}', '{arg:0}']
    pass_regex: '^PASS: all \d+ BFS costs match the CPU reference'
    fail_regex: '^FAIL'
  outputs:
  - name: cost
    dtype: i32
    rule: {metric: exact}
    basis: verify.py's exact comparison of every node's hop count (result.txt, written from this buffer) with a CPU BFS
      of the same graph (level1/bfs/verify.py:44-56; cuda/bfs.cu h_cost after the final copy-back); integers -> byte-identical
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'every node''s hop count byte-identical to the frozen B200 golden reference reference/<input_id>.json (made once
    and validated there by verify.py''s CPU BFS, exact); no CPU reference is run'
  covers: all
