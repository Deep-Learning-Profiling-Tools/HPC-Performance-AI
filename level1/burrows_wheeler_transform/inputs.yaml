# Registered inputs of burrows_wheeler_transform (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: burrows_wheeler_transform
level: 1
selector: null
default_input: n10000000
entry:
  kind: binary
  path: build/burrows_wheeler_transform/cuda/burrows_wheeler_transform_cuda
timing:
  scope: the benchmark's own device timer (suffix comparison sort on the GPU); the host reference time is printed
    separately and excluded
  kind: total
  unit: ms
  regex: '^Device time: (?P<value>[0-9.eE+-]+) ms'
  select: only
baseline:
  method: 'the transformed sequence against the frozen B200 golden reference (`check:` / `golden:` below); the upstream
    host transform bwt_cpu (common/main.cpp) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the output
  # only when the upstream check printed PASS; every later run is compared with that frozen output instead.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: bwt
    dtype: u8
    rule: {metric: exact}
    cpu: null
    basis: upstream's exact string comparison cpu_seq.compare(gpu_seq) == 0 of the n transformed characters against
      the host transform bwt_cpu (common/main.cpp:91); a deterministic permutation of the input, compared byte for byte
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the transformed sequence (n bytes) against the frozen B200 golden reference reference/<input_id>.json, byte
    for byte (sha256), as upstream compared it with the host transform; no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus a 4x string
inputs:
- id: n10000000
  case: bwt
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/bwt-cuda Makefile run: ./main 10000000 (= ctest)'
  params:
    string_length: 10000000
  args:
  - '10000000'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n40000000
  case: bwt
  variant: size
  source:
    kind: derived
    derivation: string length x4
  params:
    string_length: 40000000
  args:
  - '40000000'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
