# Registered inputs of channel_shuffle (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: channel_shuffle
level: 1
selector: null
default_input: g2-w224-h224
entry:
  kind: binary
  path: build/channel_shuffle/cuda/channel_shuffle_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: per-layout timers (NHWC, NCHW) for several kernel variants; no total
baseline:
  method: 'the 24 shuffled outputs (12 (N, C) configurations x NHWC/NCHW) against the frozen B200 golden reference
    (`check:` / `golden:` below), sha256 only; the upstream CPU reference (common/reference.h) runs only once,
    offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: (FAIL|[Ff]ail|[Mm]ismatch|[Ee]rror)
    compare:
      rule: absent
  # An aborted sweep is a failure: upstream computes numel as int (cuda/main.cu, "assume no integer overflow"); for
  # maps of 256x256 and larger it overflows at N=16, C=512, cudaMalloc fails and the program prints "Device memory
  # allocation failed. Exit" and exits 0 (this is how the deregistered g2-w512-h512 was found never to complete its
  # sweep). The golden check fails such a run as well: the outputs of the configurations it never reached are missing.
  - name: sweep_aborted
    role: diagnostic
    regex: Device memory allocation failed
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the outputs
  # only when every memcmp against the CPU reference passed (the NCHW "Average time" line of the last configuration is
  # printed only after its comparison passed; any mismatch prints "Failed to pass"). The 24 outputs are 11-30 GB per
  # run (N * C * W * H floats each), so only their sha256 is recorded (mode hash); they are compared exactly.
  mode: hash
  cpu_check:
    pass_regex: '^Average time of channel shuffle \(NCHW\):'
    fail_regex: 'Failed to pass channel shuffle|Device memory allocation failed'
  outputs:
  - match: 'Y\.(nhwc|nchw)\.N[0-9]+\.C[0-9]+'
    count: 24
    dtype: f32
    rule: {metric: exact}
    cpu: null
    basis: upstream's memcmp(h_Y, h_Y_ref) of every (N, C) configuration and layout against the CPU reference
      (cuda/main.cu:183 NHWC, :202 NCHW); a pure permutation of the input, compared byte for byte (sha256)
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture', HPCPERF_GOLDEN_MODE: hash}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the 24 outputs (12 (N, C) configurations x NHWC/NCHW) against the frozen B200 golden reference
    reference/<input_id>.json, byte for byte (sha256), as upstream memcmp''ed them against the CPU reference; an aborted
    sweep misses outputs and fails; no CPU reference is run'
  covers: all
  timeout: 7200
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus the largest map the program can sweep completely and another group count
  # The earlier derived input g2-w512-h512 (feature map 512x512) was deregistered on 2026-09-28: upstream's
  # main.cu computes `const int numel = N * C * W * H` ("assume no integer overflow", cuda/main.cu:151) and
  # the sweep N in {1,4,16,64} x C in {32,128,512} overflows at (N=16, C=512, 512x512); cudaMalloc fails,
  # the program prints "Device memory allocation failed. Exit" and exits 0 after 8 of its 12 configurations.
  # Every measurement of that input ran the truncated sweep and is INVALIDATED (results directory
  # inputs-roi-timing-2026-09-23/invalidations.json). HeCBench master still has the int numel (checked
  # 2026-09-28); the kernels take `int numel` and index in int, so a size_t change is not a pure
  # representation fix and was not applied. The sweep completes for W*H < 65536 (64 * 512 * W * H < 2^31):
  # g2-w255-h255 is the largest square map that runs the whole intended workload.
  upstream_inputs_not_added:
  - 'feature maps of 256x256 and larger (the full N/C sweep overflows the int element count)'
inputs:
- id: g2-w224-h224
  case: channel-shuffle
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/channelShuffle-cuda Makefile run: ./main 2 224 224 100 (= ctest)'
  params:
    group: 2
    width: 224
    height: 224
    repeat: 100
  args:
  - '2'
  - '224'
  - '224'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: g2-w255-h255
  case: channel-shuffle
  variant: size
  source:
    kind: derived
    derivation: feature map 255x255 -- the largest square map for which the program's N x C sweep completes
      (64 * 512 * 255 * 255 = 2 130 739 200 < 2^31; replaces the deregistered 512x512 input, see coverage)
  params:
    group: 2
    width: 255
    height: 255
    repeat: 100
  args:
  - '2'
  - '255'
  - '255'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: g4-w224-h224
  case: channel-shuffle
  variant: parameter
  source:
    kind: derived
    derivation: group size 4 on the default map
  params:
    group: 4
    width: 224
    height: 224
    repeat: 100
  args:
  - '4'
  - '224'
  - '224'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
