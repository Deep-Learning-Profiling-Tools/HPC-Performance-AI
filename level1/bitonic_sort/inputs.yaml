# Registered inputs of bitonic_sort (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: bitonic_sort
level: 1
selector: null
default_input: exp25
entry:
  kind: binary
  path: build/bitonic_sort/cuda/bitonic_sort_cuda
timing:
  scope: the benchmark's own timer over all bitonic stages of the sort (total)
  kind: total
  unit: ms
  regex: '^Total kernel execution time: (?P<value>[0-9.eE+-]+) \(ms\)'
  select: only
baseline:
  method: 'the sorted array against the frozen B200 golden reference (`check:` / `golden:` below), compared by
    sha256; the upstream CPU reference (serial BitonicSort + memcmp) runs only once, offline, to validate that
    reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the sorted
  # array only when the upstream check printed PASS. mode hash: the output is compared exactly and is 128 MB (exp25)
  # to 512 MB (exp27), so only its sha256 is recorded (no bytes are written).
  mode: hash
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: sorted
    dtype: i32
    rule: {metric: exact}
    basis: upstream's memcmp of the 2^n sorted ints with the serial host BitonicSort of the same input
      (cuda/main.cu:237-240); integer, exact
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture', HPCPERF_GOLDEN_MODE: hash}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the sorted array byte-identical (sha256) to the frozen B200 golden reference reference/<input_id>.json
    (upstream compares it exactly with memcmp); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus two other array sizes via the exponent parameter
inputs:
- id: exp25
  case: bitonic-sort
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/bitonic-sort-cuda Makefile run: ./main 25 2 (= ctest)'
  params:
    exponent: 25
    elements: 33554432
    k: 2
  args:
  - '25'
  - '2'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: exp22
  case: bitonic-sort
  variant: size
  source:
    kind: derived
    derivation: exponent 22 (4 M elements)
  params:
    exponent: 22
    elements: 4194304
    k: 2
  args:
  - '22'
  - '2'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: exp27
  case: bitonic-sort
  variant: size
  source:
    kind: derived
    derivation: exponent 27 (134 M elements)
  params:
    exponent: 27
    elements: 134217728
    k: 2
  args:
  - '27'
  - '2'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
