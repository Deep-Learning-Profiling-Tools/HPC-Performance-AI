# Registered inputs of ao_bench (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: ao_bench
level: 1
selector: null
default_input: iter100
entry:
  kind: binary
  path: build/ao_bench/cuda/ao_bench_cuda
timing:
  scope: the benchmark's own timer around the rendering kernel, averaged over `iterations` renders of the fixed
    256x256 scene (main_compute = average x iterations)
  kind: per_iteration
  unit: us
  regex: '^Average kernel time: (?P<value>[0-9.eE+-]+) usec\.'
  select: only
  work:
    key: iterations
    offset: 0
baseline:
  method: no built-in check; ctest's verify.py checks the PPM structure and run-to-run byte identity (not wired
    into the registry)
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: ppm_written
    role: diagnostic
    regex: ^
    compare:
      rule: present
coverage:
  status: SINGLE_INPUT
  reason: the only runtime parameter is the number of renders of the same fixed scene (a repetition count); image
    size and scene are compile-time constants upstream
inputs:
- id: iter100
  case: ambient-occlusion-render
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/aobench-cuda Makefile run: ./main 100 (= ctest)'
  params:
    iterations: 100
    image: 256x256 (compile-time)
  args:
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
