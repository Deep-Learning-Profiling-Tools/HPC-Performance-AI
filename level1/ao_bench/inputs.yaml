# Registered inputs of ao_bench (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: ao_bench
level: 1
selector: null
default_input: iter100
entry:
  kind: binary
  path: build/ao_bench/cuda/ao_bench_cuda
timing:
  scope: the benchmark's own timer around the rendering kernel, averaged over `iterations` renders of the fixed
    256x256 scene (main_compute = average x iterations)
  kind: per_iteration
  unit: us
  regex: '^Average kernel time: (?P<value>[0-9.eE+-]+) usec\.'
  select: only
  work:
    key: iterations
    offset: 0
baseline:
  method: no built-in check; ctest's verify.py checks the PPM structure and run-to-run byte identity (not wired
    into the registry)
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: ppm_written
    role: diagnostic
    regex: ^
    compare:
      rule: present
coverage:
  status: SINGLE_INPUT
  reason: the only runtime parameter is the number of renders of the same fixed scene (a repetition count); image
    size and scene are compile-time constants upstream
inputs:
- id: iter100
  case: ambient-occlusion-render
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/aobench-cuda Makefile run: ./main 100 (= ctest)'
  params:
    iterations: 100
    image: 256x256 (compile-time)
  args:
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
check:
  # The rendered image (ao.ppm, written into the run directory) against the image the unoptimized reference build of
  # this repository rendered for the same input: exact bytes (deterministic per-pixel RNG, verify.py). The reference
  # hash lives in reference/iter100.sha256 with its provenance sidecar; it is captured once from the reference build
  # (correctness_runs2.sh) -- until then the check fails with "no reference image hash". A per-channel tolerance for a
  # candidate that reorders floating-point work is not established (decision).
  kind: post_run
  outputs: ['{run_dir}/ao.ppm']
  command: [python3, '{bench_dir}/check_ppm.py', '{outputs}/ao.ppm', '--reference', '{bench_dir}/reference/iter100.sha256']
  pass_regex: '^PASS: aobench image check'
  fail_regex: '^FAIL: aobench image check'
  basis: 'well-formed 256x256 P6 PPM, byte-identical (sha256) to the image rendered by the unoptimized reference build
    for the same iteration count (reference/iter100.sha256, provenance in the sidecar); exact deterministic comparison'
  covers: all
