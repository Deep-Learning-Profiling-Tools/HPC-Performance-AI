# Registered inputs of pressure (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: pressure
level: 1
selector: null
default_input: size1000000
entry:
  kind: binary
  path: build/pressure/cuda/pressure_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: the standalone port prints only PASS/FAIL; upstream RAJAPerf's kernel timer is not ported
baseline:
  method: 'the outputs bvc and p_new against the frozen B200 golden reference (`check:` / `golden:` below); the added
    driver''s upstream Base_Seq CPU reference (element-wise, rel tol 1e-10) runs only once, offline, to validate that
    reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes bvc and p_new only when the
  # driver's CPU check printed PASS; every later run is compared with those frozen outputs instead.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: bvc
    dtype: f64
    rule: {metric: max_rel1p, tol: 1.0e-10}
    cpu: bvc.cpu
    basis: the driver's element-wise check of bvc (f64[size]) against the upstream Base_Seq CPU reference,
      max |g - r| / (1 + |r|) <= 1e-10 (common/rp_common.hpp:121-124 compareArrays, cuda/main.cu:137); the check
      allows 1e-10 minus the B200 output's own deviation from the CPU reference
  - name: p_new
    dtype: f64
    rule: {metric: max_rel1p, tol: 1.0e-10}
    cpu: p_new.cpu
    basis: the driver's element-wise check of p_new (f64[size]) against the upstream Base_Seq CPU reference,
      max |g - r| / (1 + |r|) <= 1e-10 (common/rp_common.hpp:121-124 compareArrays, cuda/main.cu:138); the check
      allows 1e-10 minus the B200 output's own deviation from the CPU reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'bvc and p_new against the frozen B200 golden reference reference/<input_id>.json (max |a - g| / (1 + |g|) <= 1e-10
    - d0 per output, d0 = the golden''s deviation from the upstream Base_Seq CPU reference measured when it was
    frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream default size plus larger sizes through the port's size argument (upstream --size)
inputs:
- id: size1000000
  case: pressure-eos
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/RAJAPerf
      version: b0f1cd36afd7c2ac57fcb1dc676012be28fb1327
      path: upstream default problem size 1000000 (elements), 700 reps (= ctest, no arguments)
  params:
    size: 1000000
    reps: 700
  args: []
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: size4000000
  case: pressure-eos
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/RAJAPerf
      version: b0f1cd36afd7c2ac57fcb1dc676012be28fb1327
      path: 'upstream --size mechanism: problem size 4000000 (elements); reps unchanged'
  params:
    size: 4000000
    reps: 700
  args:
  - '4000000'
  - '700'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: size16000000
  case: pressure-eos
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/RAJAPerf
      version: b0f1cd36afd7c2ac57fcb1dc676012be28fb1327
      path: 'upstream --size mechanism: problem size 16000000 (elements); reps unchanged'
  params:
    size: 16000000
    reps: 700
  args:
  - '16000000'
  - '700'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: probe-randvalue
  purpose: correctness-probe
  probe_basis: >-
    upstream's set-up data (initData) gives p_new = bvc * e_old ~ 0.0117 < p_cut and vnewc >= eosvmax for every element,
    so every p_new is clamped to pmin: a constant fill (p_new = pmin) passes every performance input with error 0
    (measured 2026-10-27). Here vnewc comes from upstream's own initDataRandValue (values in [0, 1]) and p_cut, pmin are
    scaled by 1e-2: 19.6% of the elements (vnewc < eosvmax) keep p_new = bvc * e_old (0.0115-0.0117), the rest are
    clamped, so a constant fill or a skipped / short-circuited pressurecalc2 fails
  case: pressure-eos
  variant: parameter
  source:
    kind: derived
    derivation: >-
      upstream default size and reps (1000000, 700); set-up data only (`--probe`, cuda/main.cu setUp): vnewc is
      initialized with upstream DataUtils initDataRandValue instead of initData (same init count), p_cut and pmin are
      multiplied by 1e-2; both Base_CUDA kernels and the Base_Seq CPU reference are unchanged
  params:
    size: 1000000
    reps: 700
    probe_data: vnewc initDataRandValue; p_cut and pmin x 1e-2
  args:
  - '1000000'
  - '700'
  - --probe
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
