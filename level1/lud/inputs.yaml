# Registered inputs of lud (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: lud
level: 1
selector: null
default_input: s256
entry:
  kind: binary
  path: build/lud/cuda/lud_cuda
timing:
  scope: the benchmark's own timer around the LU decomposition kernels (matrix generation and the -v verification
    excluded)
  kind: total
  unit: ms
  regex: '^Time consumed\(ms\): (?P<value>[0-9.eE+-]+)'
  select: only
baseline:
  method: 'the post-run residual check (`check:` below): upstream''s lud_verify criterion, every element of A - L*U
    within 1e-4, applied by lud_residual_check.py to the factors captured after the timed region; upstream''s own
    single-thread host recomposition (-v, common/common.c lud_verify) runs only offline with HPCPERF_CPU_REFERENCE=1'
  reference: none needed (reference-free; the residual against the input matrix regenerated from create_matrix)
  quantities:
  - name: dismatch
    role: diagnostic
    regex: dismatch
    compare:
      rule: absent
check:
  # The run captures the packed factor matrix after the timed region and the final device-to-host copy
  # (cuda/lud.cu hpcperf_golden_output "lu", HPCPERF_GOLDEN_DUMP); -v no longer runs the O(n^3) host check by
  # default (15 min at s8192). lud_residual_check.py regenerates A bit-identically from create_matrix, forms
  # A - L*U in float64 with BLAS and applies upstream's per-element 1e-4 to all n*n elements; a non-finite
  # factor fails. No golden, no CPU reference: the criterion needs only the factors and the input.
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/lud-capture'}
  command: [python3, '{bench_dir}/lud_residual_check.py', --dump, '{run_dir}/lud-capture', --, '{args}']
  pass_regex: '^PASS: lud residual'
  fail_regex: '^FAIL: lud residual'
  basis: 'upstream lud_verify (common/common.c): any i, j with fabs(A_ij - (L U)_ij) > 0.0001 prints "dismatch";
    here PASS iff every factor is finite and max_ij |A_ij - (L U)_ij| <= 1e-4 over all n*n elements, L U and the
    difference evaluated in float64 (upstream accumulates in float32: its own rounding, up to 1.3e-5 / 1.8e-5 /
    1.9e-5 at s256 / s2048 / s8192, is part of its verdict; README "Validation"); upstream passes NaN factors
    (the comparison is false), this check fails them'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: three matrix sizes through upstream's built-in generator (-s)
inputs:
- id: s256
  case: lud-generated
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: 'cuda/lud run: ./lud -s 256 -v (= ctest; upstream''s built-in matrix generator)'
  params:
    n: 256
  args:
  - -s
  - '256'
  - -v
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: s2048
  case: lud-generated
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: -s 2048 (the size of upstream's 2048.dat)
  params:
    n: 2048
  args:
  - -s
  - '2048'
  - -v
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: s8192
  case: lud-generated
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: -s 8192
  params:
    n: 8192
  args:
  - -s
  - '8192'
  - -v
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
