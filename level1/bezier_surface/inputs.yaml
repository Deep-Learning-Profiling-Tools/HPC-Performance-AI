# Registered inputs of bezier_surface (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: bezier_surface
level: 1
selector: null
default_input: n8192
entry:
  kind: binary
  path: build/bezier_surface/cuda/bezier_surface_cuda
timing:
  scope: the benchmark's own timer around the surface-evaluation kernel (host execution time and the CPU reference
    are printed separately and excluded)
  kind: total
  unit: ms
  regex: '^kernel execution time: (?P<value>[0-9.eE+-]+) ms'
  select: only
baseline:
  method: 'the evaluated surface (XYZ per output point) against the frozen B200 golden reference (`check:` /
    `golden:` below); the upstream CPU reference (BezierCPU + relative L1 norm) runs only once, offline, to validate
    that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the surface
  # only when the upstream check printed PASS; every later run is compared with that frozen output instead.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: surface
    dtype: f32
    rule: {metric: l1_rel, tol: 1.0e-6}
    cpu: surface.cpu
    basis: 'the out_size_i x out_size_j XYZ surface as 3 * n * n floats: upstream compare_output requires
      sum |gpu - cpu| / sum |cpu| over x, y and z of every point < 1e-6 against BezierCPU (cuda/main.cu:161-177);
      the check allows 1e-6 minus the B200 output''s own L1 deviation from the CPU reference'
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the surface against the frozen B200 golden reference reference/<input_id>.json (sum |a - g| / sum |g|
    <= 1e-6 - d0, d0 = the golden''s relative L1 deviation from the upstream CPU reference measured when it was
    frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: >-
    the upstream Makefile run (-n 8192) and the program's own default resolution (-n 300). The x2 and x4
    resolutions (16384, 32768) are NOT registered and cannot run on this port: run() sizes the device
    buffer as `int out_size = n * n * sizeof(XYZ)`, which wraps for n >= 13378 (n = 16384: 3221225472 bytes
    -> -1073741824), so cudaMalloc fails and the kernel writes through an unallocated pointer
    (compute-sanitizer 2026-10-27: cudaErrorMemoryAllocation, then invalid __global__ writes) -- that, not
    the float evaluation suspected earlier, is why the port's own check reported FAIL in the two
    unregistered rollout attempts. main() now refuses -n outside 2..13377 with an error (exit 1)
inputs:
- id: n8192
  case: bezier-surface
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/bezier-surface-cuda Makefile run: ./main -f control.txt -n 8192 (= ctest)'
  params:
    control_points_file: data/control.txt
    n: 8192
  args:
  - -f
  - level1/bezier_surface/data/control.txt
  - -n
  - '8192'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/control.txt
- id: n300
  case: bezier-surface
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/bezier-surface-cuda main.cu: the program default output resolution (-n 300, -m 3 control points)'
  params:
    control_points_file: data/control.txt
    n: 300
  args:
  - -f
  - level1/bezier_surface/data/control.txt
  - -n
  - '300'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/control.txt
