# Registered inputs of bezier_surface (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: bezier_surface
level: 1
selector: null
default_input: n8192
entry:
  kind: binary
  path: build/bezier_surface/cuda/bezier_surface_cuda
timing:
  scope: the benchmark's own timer around the surface-evaluation kernel (host execution time and the CPU reference
    are printed separately and excluded)
  kind: total
  unit: ms
  regex: '^kernel execution time: (?P<value>[0-9.eE+-]+) ms'
  select: only
baseline:
  method: 'built-in comparison with the CPU result: PASS/FAIL'
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: pass_marker
    role: required
    regex: ^PASS$
    compare:
      rule: present
  - name: fail_marker
    role: required
    regex: ^FAIL$
    compare:
      rule: absent
coverage:
  status: MULTI_INPUT
  reason: >-
    the upstream Makefile run (-n 8192) and the program's own default resolution (-n 300). The x2 and x4
    resolutions (16384, 32768) are NOT registered: the port's own check (relative L1 norm of the GPU
    surface against the double-precision CPU reference, threshold 1e-6) reports FAIL there while the
    default passes; the cause is not established (the float parametric evaluation is suspected, not
    verified) -- the two attempts are kept as unregistered records in the rollout measurements
inputs:
- id: n8192
  case: bezier-surface
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/bezier-surface-cuda Makefile run: ./main -f control.txt -n 8192 (= ctest)'
  params:
    control_points_file: data/control.txt
    n: 8192
  args:
  - -f
  - level1/bezier_surface/data/control.txt
  - -n
  - '8192'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/control.txt
- id: n300
  case: bezier-surface
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/bezier-surface-cuda main.cu: the program default output resolution (-n 300, -m 3 control points)'
  params:
    control_points_file: data/control.txt
    n: 300
  args:
  - -f
  - level1/bezier_surface/data/control.txt
  - -n
  - '300'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  files:
  - data/control.txt
