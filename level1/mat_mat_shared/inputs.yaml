# Registered inputs of mat_mat_shared (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: mat_mat_shared
level: 1
selector: null
default_input: size1000
entry:
  kind: binary
  path: build/mat_mat_shared/cuda/mat_mat_shared_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: the standalone port prints only PASS/FAIL; upstream RAJAPerf's kernel timer is not ported
baseline:
  method: 'the output C against the frozen B200 golden reference (`check:` / `golden:` below); the added
    driver''s upstream Base_Seq CPU reference (element-wise, rel tol 1e-10) runs only once, offline, to validate that
    reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes C only when the
  # driver's CPU check printed PASS; every later run is compared with that frozen output instead.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: C
    dtype: f64
    rule: {metric: max_rel1p, tol: 1.0e-10}
    cpu: C.cpu
    basis: the driver's element-wise check of C (f64[len]) against the upstream Base_Seq CPU reference,
      max |g - r| / (1 + |r|) <= 1e-10 (common/rp_common.hpp:121-124 compareArrays, cuda/main.cu:161); the check
      allows 1e-10 minus the B200 output's own deviation from the CPU reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'C against the frozen B200 golden reference reference/<input_id>.json (max |a - g| / (1 + |g|) <= 1e-10
    - d0 per output, d0 = the golden''s deviation from the upstream Base_Seq CPU reference measured when it was
    frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream default size plus larger sizes through the port's size argument (upstream --size)
inputs:
- id: size1000
  case: mat-mat-shared
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/RAJAPerf
      version: b0f1cd36afd7c2ac57fcb1dc676012be28fb1327
      path: upstream default problem size 1000 (matrix edge N), 5 reps (= ctest, no arguments)
  params:
    size: 1000
    reps: 5
  args: []
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: size2000
  case: mat-mat-shared
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/RAJAPerf
      version: b0f1cd36afd7c2ac57fcb1dc676012be28fb1327
      path: 'upstream --size mechanism: problem size 2000 (matrix edge N); reps unchanged'
  params:
    size: 2000
    reps: 5
  args:
  - '2000'
  - '5'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: size4000
  case: mat-mat-shared
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/RAJAPerf
      version: b0f1cd36afd7c2ac57fcb1dc676012be28fb1327
      path: 'upstream --size mechanism: problem size 4000 (matrix edge N); reps unchanged'
  params:
    size: 4000
    reps: 5
  args:
  - '4000'
  - '5'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: probe-rand
  purpose: correctness-probe
  probe_basis: >-
    upstream's set-up data A = B = 1 makes every element of C equal to N, so a constant fill (C = N) -- or any
    tiling / indexing / operand-order error that still sums N ones -- passes every performance input with error 0
    (measured 2026-10-27). Here A comes from upstream's own initDataRandValue (values in [0, 1]) and B from
    initDataRandSign (+-0.1 with random signs), so C spans -8.5 .. 8.0 and C = B A, A^T B, A B^T or C^T differ from the
    result by max |a - g| / (1 + |g|) = 6.8 .. 27 (tolerance 1e-10)
  case: mat-mat-shared
  variant: parameter
  source:
    kind: derived
    derivation: >-
      upstream default size and reps (N = 1000, 5); set-up data only (`--probe`, cuda/main.cu): A is initialized with
      upstream DataUtils initDataRandValue and B with initDataRandSign instead of the constant 1 (same init order);
      the Base_CUDA kernel and the Base_Seq CPU reference are unchanged
  params:
    size: 1000
    reps: 5
    probe_data: A initDataRandValue; B initDataRandSign
  args:
  - '1000'
  - '5'
  - --probe
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
