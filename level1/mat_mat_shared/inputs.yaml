# Registered inputs of mat_mat_shared (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: mat_mat_shared
level: 1
selector: null
default_input: size1000
entry:
  kind: binary
  path: build/mat_mat_shared/cuda/mat_mat_shared_cuda
timing:
