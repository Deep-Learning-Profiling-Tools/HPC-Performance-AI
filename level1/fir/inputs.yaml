# Registered inputs of fir (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest runs the default input.
# Every input is generated from the fixed seed 1 (params.seed, common/hpcperf_measure.h; upstream: time(NULL)).
schema: hpcperf-inputs-1
benchmark: fir
level: 1
selector: null
default_input: y1024-x4096
entry:
  kind: binary
  path: build/fir/cuda/fir_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: the port exposes no timing option (upstream's benchmark_runner -t timing mode is not wired into the CLI);
    only the verification line is printed
baseline:
  method: 'the filtered signal against the frozen B200 golden reference (`check:` / `golden:` below); the upstream
    CPU FIR (Verify) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: (FAIL|[Ff]ail)
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the filtered
  # signal only when upstream Verify printed 'Passed!'; every later run is compared with that frozen output instead.
  # The input is generated from the fixed default seed 1 (params.seed; common/hpcperf_measure.h): a run with another
  # seed (HPCPERF_RANDOM_SEED) prints 'NON-DEFAULT SEED', which make treats as a fail line, and its output differs.
  mode: data
  cpu_check: {pass_regex: '^Passed! [0-9]+ data points filtered', fail_regex: '^At position [0-9]+, expected|NON-DEFAULT SEED'}
  outputs:
  - name: output
    dtype: f32
    rule: {metric: max_abs, tol: 1.0e-5}
    cpu: output.cpu
    basis: upstream Verify fails on std::abs(cpu_output[i] - output_[i]) > 1e-5 for every one of the num_total_data_
      = blocks * block_size points (common/fir_benchmark.cc:91); captured by FirBenchmark::CaptureGoldenOutputs after
      the timed Run()s (common/benchmark_runner.cc); the check allows 1e-5 minus the B200 output's own deviation from
      the CPU reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the filtered signal (blocks * block_size f32) against the frozen B200 golden reference
    reference/<input_id>.json (max |a - g| <= 1e-5 - d0, d0 = the golden''s deviation from the upstream CPU FIR
    measured when it was frozen); the input comes from the fixed seed 1, a run with another seed fails; no CPU
    reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: three points of the upstream -y size sweep
inputs:
- id: y1024-x4096
  case: fir-filter
  variant: default
  source:
    kind: derived
    derivation: upstream generator (glibc rand_r over the input, then the 16 coefficients, each / RAND_MAX) and
      upstream run line -y 1024 -x 4096, with the seed fixed to 1 (params.seed) instead of upstream's time(NULL),
      which drew another input every run; HPCPERF_RANDOM_SEED=time restores the clock seed (not a registered input)
    upstream:
      repo: NUCAR-DEV/Hetero-Mark
      version: aa685e02705f4be380cba215c6df10b42262a9cd
      path: fir benchmark -y 1024 -x 4096 (= ctest)
  params:
    blocks: 1024
    block_size: 4096
    seed: 1
  args:
  - -y
  - '1024'
  - -x
  - '4096'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: y4096-x4096
  case: fir-filter
  variant: size
  source:
    kind: derived
    derivation: upstream generator (glibc rand_r over the input, then the 16 coefficients, each / RAND_MAX) and
      upstream run line -y 4096 -x 4096, with the seed fixed to 1 (params.seed) instead of upstream's time(NULL),
      which drew another input every run; HPCPERF_RANDOM_SEED=time restores the clock seed (not a registered input)
    upstream:
      repo: NUCAR-DEV/Hetero-Mark
      version: aa685e02705f4be380cba215c6df10b42262a9cd
      path: upstream sweep parameter -y (number of blocks) 4096
  params:
    blocks: 4096
    block_size: 4096
    seed: 1
  args:
  - -y
  - '4096'
  - -x
  - '4096'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: y16384-x4096
  case: fir-filter
  variant: size
  source:
    kind: derived
    derivation: upstream generator (glibc rand_r over the input, then the 16 coefficients, each / RAND_MAX) and
      upstream run line -y 16384 -x 4096, with the seed fixed to 1 (params.seed) instead of upstream's time(NULL),
      which drew another input every run; HPCPERF_RANDOM_SEED=time restores the clock seed (not a registered input)
    upstream:
      repo: NUCAR-DEV/Hetero-Mark
      version: aa685e02705f4be380cba215c6df10b42262a9cd
      path: -y 16384
  params:
    blocks: 16384
    block_size: 4096
    seed: 1
  args:
  - -y
  - '16384'
  - -x
  - '4096'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
