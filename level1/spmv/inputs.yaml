# Registered inputs of spmv (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: spmv
level: 1
selector: null
default_input: s110503
entry:
  kind: binary
  path: build/spmv/cuda/spmv_cuda
timing:
  scope: 'the port''s aveTime(ms) column: average time of one SpMV over the timed loop (upstream perf_test metric)'
  kind: total
  unit: ms
  regex: ^\s*\d+\s+\d+\s+\d+\s+[0-9.]+\s+[0-9.]+\s+[0-9.]+\s+(?P<value>[0-9.]+)\s+\d+\s*$
  select: only
baseline:
  method: 'y against the frozen B200 golden reference (`check:` / `golden:` below); the upstream CPU gold standard
    (generate_gold_standard / check_errors) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
  - name: num_errors
    role: diagnostic
    regex: ^\s*\d+\s+\d+\s+\d+\s+[0-9.]+\s+[0-9.]+\s+[0-9.]+\s+[0-9.]+\s+(?P<value>\d+)\s*$
    select: only
    compare:
      rule: le
      value: 0
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes y only when
  # upstream check_errors printed PASS; every later run is compared with that frozen output instead. y is, as in the
  # upstream check, the result of the single SpMV before the timed loop.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: y
    dtype: f64
    rule: {metric: l2_rel_sq, tol: 1.0e-5}
    cpu: y.cpu
    basis: upstream check_errors fails on sum (gold - y)^2 / sum gold^2 > 1e-5 (cuda/main.cu:249-253); the check
      allows (sqrt 1e-5 - sqrt d0)^2 with d0 the B200 output's own deviation from the CPU gold standard
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'y against the frozen B200 golden reference reference/<input_id>.json (sum (a - g)^2 / sum g^2 <=
    (sqrt 1e-5 - sqrt d0)^2, d0 = the golden''s deviation from the upstream CPU gold standard measured when it was
    frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: default generated matrix plus two larger ones through -s
inputs:
- id: s110503
  case: spmv-random
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: kokkos/kokkos-kernels
      version: 23a699f3c5bd662bf2ed52116e56533ecc3ddae0
      path: 'perf_test sparse spmv on a kk_sparseMatrix_generate matrix (seed 13721; = ctest defaults: 110503 rows,
        1.1 M nnz)'
  params:
    rows: 110503
    loop: default
  args: []
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: s442012
  case: spmv-random
  variant: size
  source:
    kind: derived
    derivation: -s 442012 (4x rows) with the same generator
  params:
    rows: 442012
    loop: default
  args:
  - -s
  - '442012'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: s1768048
  case: spmv-random
  variant: size
  source:
    kind: derived
    derivation: -s 1768048 (16x rows)
  params:
    rows: 1768048
    loop: default
  args:
  - -s
  - '1768048'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
