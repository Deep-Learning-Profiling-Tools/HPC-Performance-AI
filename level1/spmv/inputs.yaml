# Registered inputs of spmv (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: spmv
level: 1
selector: null
default_input: s110503
entry:
  kind: binary
  path: build/spmv/cuda/spmv_cuda
timing:
  scope: 'the port''s aveTime(ms) column: average time of one SpMV over the timed loop (upstream perf_test metric)'
  kind: total
  unit: ms
  regex: ^\s*\d+\s+\d+\s+\d+\s+[0-9.]+\s+[0-9.]+\s+[0-9.]+\s+(?P<value>[0-9.]+)\s+\d+\s*$
  select: only
baseline:
  method: 'y against the frozen B200 golden reference (`check:` / `golden:` below); the upstream CPU gold standard
    (generate_gold_standard / check_errors) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
  - name: num_errors
    role: diagnostic
    regex: ^\s*\d+\s+\d+\s+\d+\s+[0-9.]+\s+[0-9.]+\s+[0-9.]+\s+[0-9.]+\s+(?P<value>\d+)\s*$
    select: only
    compare:
      rule: le
      value: 0
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes y only when
  # upstream check_errors printed PASS; every later run is compared with that frozen output instead. y is, as in the
  # upstream check, the result of the single SpMV before the timed loop.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: y
    dtype: f64
    rule: {metric: l2_rel_sq, tol: 1.0e-5}
    cpu: y.cpu
    basis: upstream check_errors fails on sum (gold - y)^2 / sum gold^2 > 1e-5 (cuda/main.cu:249-253); the check
      allows (sqrt 1e-5 - sqrt d0)^2 with d0 the B200 output's own deviation from the CPU gold standard
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'y against the frozen B200 golden reference reference/<input_id>.json (sum (a - g)^2 / sum g^2 <=
    ((sqrt 1e-5 - sqrt d0) / (1 + sqrt d0))^2, d0 = the golden''s deviation from the upstream CPU gold standard
    measured when it was frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: default generated matrix plus two larger ones through -s
inputs:
- id: s110503
  case: spmv-random
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: kokkos/kokkos-kernels
      version: 23a699f3c5bd662bf2ed52116e56533ecc3ddae0
      path: 'perf_test sparse spmv on a kk_sparseMatrix_generate matrix (seed 13721; = ctest defaults: 110503 rows,
        1.1 M nnz)'
  params:
    rows: 110503
    loop: default
  args: []
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: s442012
  case: spmv-random
  variant: size
  source:
    kind: derived
    derivation: -s 442012 (4x rows) with the same generator
  params:
    rows: 442012
    loop: default
  args:
  - -s
  - '442012'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: s1768048
  case: spmv-random
  variant: size
  source:
    kind: derived
    derivation: -s 1768048 (16x rows)
  params:
    rows: 1768048
    loop: default
  args:
  - -s
  - '1768048'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: probe-real
  purpose: correctness-probe
  probe_basis: >-
    upstream's data are integers (values = colidx + row, x = rand() % 40 - 20), so y is integer-valued and every
    f64 summation order gives it exactly, while values and x stay exact even when stored in f32 (x in bf16): f32
    arithmetic or accumulation (max |a - g| 1 / 8 / 37-46), TF32-rounded inputs (l2_rel_sq 4.1e-8), f32-stored values
    or f32 / f16 / bf16-stored x (bit-exact) and a zeroed row (l2_rel_sq <= 4.5e-6), even 1.65 % of the rows zeroed
    (<= 9.7e-6), pass the performance inputs' l2_rel_sq 1e-5 (measured 2026-10-28). Here values and x are reals with
    full 53-bit mantissas on the same matrix structure: 18 legitimate variants (fmad off, vector lengths 1-32,
    reverse, pairwise, sorted, Kahan, double-double, f64 atomics, merge-path splits, cuSPARSE CSR ALG1 / ALG2)
    differ from the golden in 70-77 % of the elements by max |a - g| <= 1.8e-12, below the rounding bound of any
    f64 evaluation order, 2 gamma_10 max_i sum_j |a_ij x_j| = 1.4e-11; the wrong ones by 1.5e-4 (f32-stored values)
    to 7.4e3 (tolerance 1e-8). Not caught: how many of the 100 timed SpMVs ran (each recomputes the same y)
  case: spmv-random
  variant: parameter
  source:
    kind: derived
    derivation: >-
      the default matrix (110503 rows, kk_sparseMatrix_generate seed 13721, the same rand() stream) with set-up data
      only (`--probe`, cuda/main.cu probe_uniform): after upstream's generate_gold_standard the values are replaced by
      reals uniform in [-50, 50) (the range of upstream kk_sparseMatrix_generate's own fill_random) and x by reals
      uniform in [-20, 20) (the range of upstream's integer x), from fixed-seed splitmix64 streams (seeds 13718 and
      17312837, upstream's value-fill and driver seeds); the kernel, launch heuristics, timed loop and the CPU gold
      standard (now reading the probe values) are unchanged. Upstream has no real-valued x, hence a project choice
  params:
    rows: 110503
    loop: default
    probe_data: values uniform [-50, 50), x uniform [-20, 20) (splitmix64)
  args:
  - --probe
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  golden:
    # own rule (the benchmark-level l2_rel_sq would pass every reduced-precision variant on this probe, bf16-stored x
    # included at 3.1e-6): a per-element bound that every f64 evaluation order meets with margin
    mode: data
    cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
    outputs:
    - name: y
      dtype: f64
      rule: {metric: max_abs, tol: 1.0e-8}
      cpu: y.cpu
      basis: 'project criterion for the probe (upstream check_errors, l2_rel_sq 1e-5, still gates the one-time CPU
        validation): |a - g| <= 1e-8 per element. Every row has 10 nonzeros and sum_j |a_ij x_j| <= 6169, so any IEEE
        f64 evaluation order (FMA or not, any reduction tree, atomics) is within gamma_10 * 6169 = 6.8e-12 of the exact
        y and two of them within 1.4e-11 (730x below the tolerance); storing values or x in f32 moves y by >= 1.5e-4
        (15000x above)'
