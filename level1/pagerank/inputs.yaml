# Registered inputs of pagerank (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: pagerank
level: 1
selector: null
default_input: nodes16384
entry:
  kind: binary
  path: build/pagerank/cuda/pagerank_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: the port exposes no timing option (upstream's benchmark_runner -t timing mode is not wired into the CLI);
    only the verification line is printed
baseline:
  method: 'the PageRank vector against the frozen B200 golden reference (`check:` / `golden:` below); the upstream
    CPU implementation (Verify) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: (FAIL|[Ff]ail)
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes page_rank
  # only when upstream Verify printed 'Passed.'; every later run is compared with that frozen output instead.
  mode: data
  cpu_check: {pass_regex: '^Passed\.$', fail_regex: '^Error with node'}
  outputs:
  - name: page_rank
    dtype: f32
    # tightened from upstream's 1e-3 (measured 2026-10-28, B200, 500 iterations): 16 legitimate implementations stay
    # <= 1.4e-6, an f16-stored vector (6.2e-4..7.7e-4) passes 1e-3; 3e-5 is the geometric centre (>= 20x on both sides).
    # Iteration count and stale rows are not observable after ~12 iterations: that is the probe's job (nodes16384-m5).
    rule: {metric: max_rel, tol: 3.0e-5}
    cpu: page_rank.cpu
    basis: 'the metric of upstream Verify (isnan(page_rank_[i]) or fabs(page_rank_[i] - cpu_page_rank[i]) > cpu_page_rank[i]
      / 1000, common/pr_benchmark.cc:119-120, i.e. max |a - c| / c) with the tolerance 3e-5 instead of 1e-3, minus the B200
      output''s own deviation from the CPU reference (a NaN fails). Measured 2026-10-28: legitimate implementations (fmad
      off, 4/8/32 lanes per row with shuffle trees, merge-style nonzero chunks and push atomics, cuSPARSE CSR ALG1/ALG2,
      reverse / 4-accumulator / Kahan / f64 accumulation, f64 vectors, block sizes) <= 1.4e-6; a vector stored in f16 /
      bf16 6.2e-4 / 4.5e-3 and matrix values rounded to f16 / bf16 / tf32 >= 6.7e-2 fail'
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'page_rank against the frozen B200 golden reference reference/<input_id>.json (max |a - g| / |g|
    <= 1e-3 - d0, d0 = the golden''s deviation from the upstream CPU implementation measured when it was frozen); no
    CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: three sizes of the upstream N.data sweep from the repository's deterministic generator
inputs:
- id: nodes16384
  case: pagerank-csr
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: NUCAR-DEV/Hetero-Mark
      version: aa685e02705f4be380cba215c6df10b42262a9cd
      path: 'pr benchmark -i 16384.data: the largest size of the upstream N.data sweep, generated at configure time
        by data/gen_input.py (= ctest)'
  params:
    nodes: 16384
    avg_out_degree: 16
  args:
  - -i
  - build/pagerank/cuda/data/16384.data
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  input_form: file
- id: nodes4096
  case: pagerank-csr
  variant: size
  source:
    kind: derived
    derivation: 4096 nodes from the same deterministic generator (a smaller point of the upstream sweep)
  params:
    nodes: 4096
    avg_out_degree: 16
  args:
  - -i
  - build/pagerank/cuda/data/4096.data
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  input_form: file
- id: nodes1024
  case: pagerank-csr
  variant: size
  source:
    kind: derived
    derivation: 1024 nodes
  params:
    nodes: 1024
    avg_out_degree: 16
  args:
  - -i
  - build/pagerank/cuda/data/1024.data
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  input_form: file
- id: nodes16384-m5
  purpose: correctness-probe
  probe_basis: >-
    after ~12 power iterations the rank vector is converged to f32 rounding (the remaining signal is a global scale
    drift of ~2.1e-8 per iteration from the f32 matrix's column sums), so the 500-iteration performance inputs cannot
    see how many iterations ran or partial work in late iterations: 8 of 500 iterations (3.5e-5..5.1e-5), 12 or more
    (<= 1.1e-5), an in-place single-buffer update (<= 4.2e-5), one row, one 64-row block or 5 % of the rows left stale
    in the last iteration (<= 2.4e-7) pass their limit 3e-5 or exceed it by < 1.8x (measured 2026-10-28). With 5 iterations (the
    same matrix, upstream's -m option) one iteration fewer deviates by 6.5e-3, 5 % / a block / one stale row by 4.5e-3 /
    3.3e-3 / 4.9e-4, the in-place update by 1.7e-4..3.5e-4, an f16-stored vector by 6.1e-4, f16 / tf32 matrix values by
    8.7e-4 / 1.1e-3, while 16 legitimate implementations stay <= 4.2e-7 (max_rel, limit 1e-5: >= 17x on the wrong side,
    23x headroom). An odd count also exercises the other parity of the final copy-back
  case: pagerank-csr
  variant: steps
  source:
    kind: derived
    derivation: 'the default matrix (16384.data, the configure-time deterministic generator) with -m 5: 5 instead of
      500 power iterations; no source change'
  params:
    nodes: 16384
    avg_out_degree: 16
    max_iterations: 5
  args:
  - -i
  - build/pagerank/cuda/data/16384.data
  - -m
  - '5'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  input_form: file
  golden:
    # this input's own spec (replaces the benchmark-level one): the same metric, the tolerance centred on the probe's
    # own envelope (legitimate <= 4.2e-7 here vs <= 1.4e-6 after 500 iterations)
    mode: data
    cpu_check: {pass_regex: '^Passed\.$', fail_regex: '^Error with node'}
    outputs:
    - name: page_rank
      dtype: f32
      rule: {metric: max_rel, tol: 1.0e-5}
      cpu: page_rank.cpu
      basis: 'the metric of upstream Verify (isnan(page_rank_[i]) or fabs(page_rank_[i] - cpu_page_rank[i]) >
        cpu_page_rank[i] / 1000, common/pr_benchmark.cc:119-120, i.e. max |a - c| / c) with the tolerance 1e-5 at 5
        iterations, minus the B200 output''s own deviation from the CPU reference (a NaN fails). Measured 2026-10-28:
        legitimate implementations (as for the 500-iteration inputs) <= 4.2e-7; one iteration fewer 6.5e-3, one stale
        row in the last iteration 4.9e-4, an in-place update >= 1.7e-4, an f16 vector 6.1e-4 fail'
