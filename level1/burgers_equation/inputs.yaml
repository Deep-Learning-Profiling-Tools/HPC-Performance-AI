# Registered inputs of burgers_equation (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: burgers_equation
level: 1
selector: null
default_input: x8200-y8100-t100
entry:
  kind: binary
  path: build/burgers_equation/cuda/burgers_equation_cuda
timing:
  scope: the benchmark's own timer over all `nt` time steps of the 2D Burgers kernels (total)
  kind: total
  unit: s
  regex: ^Total kernel execution time (?P<value>[0-9.eE+-]+) \(s\)
  select: only
baseline:
  method: 'the outputs du/dv against the frozen B200 golden reference (`check:` / `golden:` below); the upstream
    serial CPU solver (cuda/main.cu) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes du/dv only
  # when the upstream check printed PASS; every later run is compared with those frozen outputs instead.
  # Each output is grid_elems = dim_x * dim_y doubles (531 MB per output for the default input).
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: du
    dtype: f64
    rule: {metric: max_abs, tol: 1.0e-6}
    cpu: du.cpu
    basis: upstream's element-wise check fabs(du - u) > 1e-6 -> FAIL against the serial CPU solver (cuda/main.cu:208);
      the check allows 1e-6 minus the B200 output's own deviation from the CPU reference
  - name: dv
    dtype: f64
    rule: {metric: max_abs, tol: 1.0e-6}
    cpu: dv.cpu
    basis: upstream's element-wise check fabs(dv - v) > 1e-6 -> FAIL against the serial CPU solver (cuda/main.cu:209);
      the check allows 1e-6 minus the B200 output's own deviation from the CPU reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'du and dv against the frozen B200 golden reference reference/<input_id>.json (max |a - g| <= 1e-6 - d0 per
    output, d0 = the golden''s deviation from the upstream CPU solver measured when it was frozen); no CPU reference
    is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus a larger grid and a longer integration
inputs:
- id: x8200-y8100-t100
  case: burgers-2d
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/burger-cuda Makefile run: ./main 8200 8100 100 (= ctest)'
  params:
    dim_x: 8200
    dim_y: 8100
    steps: 100
  args:
  - '8200'
  - '8100'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: x16400-y16200-t100
  case: burgers-2d
  variant: size
  source:
    kind: derived
    derivation: grid 2x in each direction
  params:
    dim_x: 16400
    dim_y: 16200
    steps: 100
  args:
  - '16400'
  - '16200'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: x8200-y8100-t1000
  case: burgers-2d
  variant: steps
  source:
    kind: derived
    derivation: 10x the time steps on the default grid
  params:
    dim_x: 8200
    dim_y: 8100
    steps: 1000
  args:
  - '8200'
  - '8100'
  - '1000'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: probe-x820-y810-t100
  purpose: correctness-probe
  probe_basis: >-
    upstream's initial condition gives u and v the same hat and the two equations are identical when u == v, so du ==
    dv bit for bit on every performance input: computing u and copying it to v (half the work) or swapping u and v in
    the cross-advection terms passes them (measured 2026-10-27). Here v's hat is moved by +0.25 in x (set-up only), so
    max |du - dv| = 1 and the cross terms couple two different fields; on a 1/10-per-axis grid of the upstream run
    (820 x 810, 100 steps) the fields move by up to 0.20 (u) and 0.22 (v) from the initial condition (tolerance 1e-6)
  case: burgers-2d
  variant: parameter
  source:
    kind: custom
    derivation: >-
      upstream's run line scaled to 1/10 per axis (820 810 100); set-up data only (`--probe`, cuda/main.cu
      probe_initial_v): after upstream's initialisation v (and v_new) is reset to 1 with the hat 2 on 0.75 < x < 1.25,
      0.5 < y < 1 (u unchanged); the four kernels and the serial CPU solver are unchanged. Upstream has no
      non-symmetric initial condition, hence custom
  params:
    dim_x: 820
    dim_y: 810
    steps: 100
    probe_data: v hat moved to 0.75 < x < 1.25, 0.5 < y < 1
  args:
  - '820'
  - '810'
  - '100'
  - --probe
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
