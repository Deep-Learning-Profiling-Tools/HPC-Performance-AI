# Registered inputs of needleman_wunsch (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: needleman_wunsch
level: 1
selector: null
default_input: n2048-p10
entry:
  kind: binary
  path: build/needleman_wunsch/cuda/needleman_wunsch_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: the CUDA port prints no timer (the golden check compares the traceback)
baseline:
  method: 'no PASS line; the traceback values against the frozen B200 golden reference (`check:` / `golden:` below);
    verify.py (CPU DP matrix + traceback) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: no_error
    role: required
    regex: (FAIL|[Ee]rror)
    compare:
      rule: absent
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus two longer sequences
inputs:
- id: n2048-p10
  case: needleman-wunsch
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: 'cuda/nw run: ./needle 2048 10 (= ctest)'
  params:
    max_rows: 2048
    penalty: 10
  args:
  - '2048'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n8192-p10
  case: needleman-wunsch
  variant: size
  source:
    kind: derived
    derivation: sequence length 8192 (positional)
  params:
    max_rows: 8192
    penalty: 10
  args:
  - '8192'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n16384-p10
  case: needleman-wunsch
  variant: size
  source:
    kind: derived
    derivation: sequence length 16384
  params:
    max_rows: 16384
    penalty: 10
  args:
  - '16384'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
golden:
  # tools/golden/README.md. make runs verify.py once with HPCPERF_CPU_REFERENCE=1 and HPCPERF_GOLDEN_DUMP: verify.py runs
  # the unmodified binary (which captures the traceback values it writes to result.txt) and recomputes the DP matrix and
  # the same traceback on the CPU; the capture is frozen only when verify.py printed PASS.
  mode: data
  cpu_check:
    command: [python3, '{bench_dir}/verify.py', '{exe}', '{arg:0}', '{arg:1}']
    pass_regex: '^PASS: NW traceback \(\d+ values\) matches CPU DP reference'
    fail_regex: '^FAIL'
  outputs:
  - name: traceback
    dtype: i32
    rule: {metric: exact}
    basis: verify.py compares exactly the traceback values of result.txt (first element + one per step) with its CPU DP
      traceback (level1/needleman_wunsch/verify.py:117); the same values in file order (cuda/needle.cu TRACEBACK block),
      integers -> byte-identical. The DP matrix itself is not compared (neither was it by verify.py)
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the traceback values byte-identical to the frozen B200 golden reference reference/<input_id>.json (made once and
    validated there by verify.py''s CPU DP, exact); no CPU reference is run'
  covers: all
