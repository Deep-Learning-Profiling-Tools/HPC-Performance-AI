# Registered inputs of nbody (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: nbody
level: 1
selector: null
default_input: n16000-s10
entry:
  kind: binary
  path: build/nbody/cuda/nbody_cuda
timing:
  scope: the benchmark's own total over all time steps of the N-body kernel
  kind: total
  unit: s
  regex: ^# Total Time \(s\)\s*:\s*(?P<value>[0-9.eE+-]+)
  select: only
baseline:
  method: 'built-in comparison with the CPU reference (GSimulationReference.hpp): PASS/FAIL'
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: pass_marker
    role: required
    regex: ^PASS$
    compare:
      rule: present
  - name: fail_marker
    role: required
    regex: ^FAIL$
    compare:
      rule: absent
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus two larger particle counts
inputs:
- id: n16000-s10
  case: nbody-allpairs
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/nbody-cuda Makefile run: ./main 16000 10 (= ctest)'
  params:
    particles: 16000
    steps: 10
  args:
  - '16000'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n64000-s10
  case: nbody-allpairs
  variant: size
  source:
    kind: derived
    derivation: particles x4
  params:
    particles: 64000
    steps: 10
  args:
  - '64000'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n256000-s10
  case: nbody-allpairs
  variant: size
  source:
    kind: derived
    derivation: particles x16
  params:
    particles: 256000
    steps: 10
  args:
  - '256000'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
