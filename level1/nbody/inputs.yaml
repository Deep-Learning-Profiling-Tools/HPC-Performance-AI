# Registered inputs of nbody (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: nbody
level: 1
selector: null
default_input: n16000-s10
entry:
  kind: binary
  path: build/nbody/cuda/nbody_cuda
timing:
  scope: the benchmark's own total over all time steps of the N-body kernel
  kind: total
  unit: s
  regex: ^# Total Time \(s\)\s*:\s*(?P<value>[0-9.eE+-]+)
  select: only
baseline:
  method: 'the final particle state (positions, velocities) and the final kinetic energy against the frozen B200 golden
    reference (`check:` / the per-input `golden:` blocks below); the upstream CPU reference
    (common/GSimulationReference.hpp) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
# Golden references: tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and
# freezes the outputs only when the upstream check printed PASS; every later run is compared with that frozen output.
# Each input carries its OWN golden block (no benchmark-level default): the state tolerances are measured per input
# (README "Validation"; the chaotic amplification of round-off depends on particles x steps -- at n64000 a legitimate
# reordering differs by 5.8e-6 of max|v| after 10 steps, 1.9e-5 after 15, 2.3e-4 after 20 and 6.4e-2 after 40), so an
# input added later has no spec, and make refuses it, until its tolerances are derived. Outputs (all f32, captured after
# the timed loop; HPCPERF_GOLDEN_DUMP only):
#   kenergy  the final kinetic energy (the only quantity upstream's check compares)
#   pos/vel  the final positions / velocities, 3 x n, particle-major (x0 y0 z0 x1 ...); pos.cpu / vel.cpu = the CPU
#            reference's state (d0). Budget: tol - d0 (max_abs), (tol - d0) / (1 + d0) (max_rel).
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the final positions, velocities and kinetic energy against the frozen B200 golden reference
    reference/<input_id>.json (per output tol minus d0, the golden''s deviation from the upstream CPU reference measured
    when it was frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus two larger particle counts
inputs:
- id: n16000-s10
  case: nbody-allpairs
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/nbody-cuda Makefile run: ./main 16000 10 (= ctest)'
  params:
    particles: 16000
    steps: 10
  args:
  - '16000'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  golden:
    mode: data
    cpu_check: &nbody_cpu_check {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
    outputs:
    - &nbody_kenergy
      name: kenergy
      dtype: f32
      rule: {metric: max_rel, tol: 1.0e-4}
      cpu: kenergy.cpu
      basis: the final kinetic energy (the program's own reduction over all particles) relative to the CPU reference's.
        Upstream's check fabsf(kenergy_ - ref_kenergy_) < 1e-3f (common/GSimulationReference.hpp:105) is 1 f32 ulp at
        n16000 and bit equality at n32000/n64000 and fails 16 to 29 of 38 legitimate reimplementations; relative 1e-4,
        measured 2026-10-28 (README "Validation"; legitimate reductions <= 1.0e-5, the energy summed over half the
        particles 0.5, from the previous step's velocities 0.2, a 0.1% wrong time step 2.2e-3 to 3.1e-3)
    - &nbody_pos
      name: pos
      dtype: f32
      rule: {metric: max_abs, tol: 1.0e-4}
      cpu: pos.cpu
      basis: not compared by upstream; the final positions within 1e-4 of the unit box they start in, measured
        2026-10-28 (README "Validation"; legitimate reimplementations <= 1.3e-6 at n64000, the last position update
        skipped >= 2.1e-3)
    - name: vel
      dtype: f32
      rule: {metric: max_abs, tol: 2.0e-6}
      cpu: vel.cpu
      basis: &nbody_vel_basis not compared by upstream; the final velocities within 1e-4 of the input's max |v| (golden
        0.02057 / 0.08552 / 0.41395 at n16000 / n32000 / n64000, rounded down), measured 2026-10-28 (README
        "Validation"; legitimate reimplementations <= 5.8e-6 of max |v|, fp16-rounded positions in the force >= 4.8e-4)
- id: n64000-s10
  case: nbody-allpairs
  variant: size
  source:
    kind: derived
    derivation: particles x4
  params:
    particles: 64000
    steps: 10
  args:
  - '64000'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  golden:
    mode: data
    cpu_check: *nbody_cpu_check
    outputs:
    - *nbody_kenergy
    - *nbody_pos
    - name: vel
      dtype: f32
      rule: {metric: max_abs, tol: 4.1e-5}
      cpu: vel.cpu
      basis: *nbody_vel_basis
- id: n32000-s10
  case: nbody-allpairs
  variant: size
  source:
    kind: derived
    derivation: >-
      particles x2. The port verifies the result with an O(n^2) host reference of EVERY step
      (common/GSimulationReference.hpp), so the wall time is ~n^2 x steps while the timed GPU loop stays
      below 0.1 s: n64000-s10 needs ~140 s per run and the x16 size (256,000 particles) exceeded the
      900 s per-run timeout in its warm-up (attempt kept as the unregistered record n256000-s10).
  params:
    particles: 32000
    steps: 10
  args:
  - '32000'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  golden:
    mode: data
    cpu_check: *nbody_cpu_check
    outputs:
    - *nbody_kenergy
    - *nbody_pos
    - name: vel
      dtype: f32
      rule: {metric: max_abs, tol: 8.5e-6}
      cpu: vel.cpu
      basis: *nbody_vel_basis
