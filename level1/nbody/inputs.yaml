# Registered inputs of nbody (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: nbody
level: 1
selector: null
default_input: n16000-s10
entry:
  kind: binary
  path: build/nbody/cuda/nbody_cuda
timing:
  scope: the benchmark's own total over all time steps of the N-body kernel
  kind: total
  unit: s
  regex: ^# Total Time \(s\)\s*:\s*(?P<value>[0-9.eE+-]+)
  select: only
baseline:
  method: 'the final kinetic energy against the frozen B200 golden reference (`check:` / `golden:` below); the upstream
    CPU reference (common/GSimulationReference.hpp) runs only once, offline, to validate that reference (tools/golden
    make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the output only
  # when the upstream check printed PASS; every later run is compared with that frozen output instead.
  # NOTE: upstream's check compares only this scalar; the particle state (positions/velocities) is never checked.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: kenergy
    dtype: f32
    rule: {metric: max_abs, tol: 1.0e-3}
    cpu: kenergy.cpu
    basis: upstream's check fabsf(kenergy_ - ref_kenergy_) < 1e-3f of the final kinetic energy against the CPU reference
      (common/GSimulationReference.hpp:103); the check allows 1e-3 minus the B200 value's own deviation from the CPU
      reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the final kinetic energy against the frozen B200 golden reference reference/<input_id>.json (|a - g| <= 1e-3 -
    d0, d0 = the golden''s deviation from the upstream CPU reference measured when it was frozen); no CPU reference is
    run. Like upstream, the particle state itself is not compared'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus two larger particle counts
inputs:
- id: n16000-s10
  case: nbody-allpairs
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/nbody-cuda Makefile run: ./main 16000 10 (= ctest)'
  params:
    particles: 16000
    steps: 10
  args:
  - '16000'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n64000-s10
  case: nbody-allpairs
  variant: size
  source:
    kind: derived
    derivation: particles x4
  params:
    particles: 64000
    steps: 10
  args:
  - '64000'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n32000-s10
  case: nbody-allpairs
  variant: size
  source:
    kind: derived
    derivation: >-
      particles x2. The port verifies the result with an O(n^2) host reference of EVERY step
      (common/GSimulationReference.hpp), so the wall time is ~n^2 x steps while the timed GPU loop stays
      below 0.1 s: n64000-s10 needs ~140 s per run and the x16 size (256,000 particles) exceeded the
      900 s per-run timeout in its warm-up (attempt kept as the unregistered record n256000-s10).
  params:
    particles: 32000
    steps: 10
  args:
  - '32000'
  - '10'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
