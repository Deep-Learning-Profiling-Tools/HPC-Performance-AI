# Registered inputs of aes (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: aes
level: 1
selector: null
default_input: plaintext-1mib
entry:
  kind: binary
  path: build/aes/cuda/aes_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: the port exposes no timing option (upstream's benchmark_runner -t timing mode is not wired into the CLI);
    only the verification line is printed
baseline:
  method: 'the ciphertext against the frozen B200 golden reference (`check:` / `golden:` below); the upstream
    CPU AES-256 reference (Verify) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: (FAIL|[Ff]ail)
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the
  # ciphertext only when upstream Verify printed 'Passed.'; every later run is compared with that frozen output.
  mode: data
  cpu_check: {pass_regex: '^Passed\. [0-9]+ bytes encrypted', fail_regex: 'expected to be 0x'}
  outputs:
  - name: ciphertext
    dtype: u8
    rule: {metric: exact}
    cpu: null
    basis: upstream Verify compares every ciphertext byte with the CPU AES-256 reference, ciphertext_cpu[i] !=
      ciphertext_[i] fails (common/aes_benchmark.cc:158); captured by AesBenchmark::CaptureGoldenOutputs after the
      timed Run()s (common/benchmark_runner.cc)
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'the ciphertext (text_length_ bytes) byte-identical to the frozen B200 golden reference
    reference/<input_id>.json (upstream Verify is an exact byte compare against the CPU AES reference); no CPU
    reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: three points of the upstream size sweep from the repository's deterministic generator (the upstream data
    server is offline)
inputs:
- id: plaintext-1mib
  case: aes-256-ecb
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: NUCAR-DEV/Hetero-Mark
      version: aa685e02705f4be380cba215c6df10b42262a9cd
      path: aes benchmark, 1 MiB plaintext (point of the upstream 1KB..32MB sweep) generated at configure time by
        data/gen_input.py (= ctest)
  params:
    plaintext_mib: 1
    key_bytes: 32
  args:
  - -i
  - build/aes/cuda/data/input_1MB.hex
  - -k
  - build/aes/cuda/data/key.hex
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  input_form: file
- id: plaintext-4mib
  case: aes-256-ecb
  variant: size
  source:
    kind: derived
    derivation: 4 MiB plaintext from the repository's deterministic generator (own seed); a further point of the
      upstream sweep
  params:
    plaintext_mib: 4
    key_bytes: 32
  args:
  - -i
  - build/aes/cuda/data/input_4MB.hex
  - -k
  - build/aes/cuda/data/key.hex
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  input_form: file
- id: plaintext-16mib
  case: aes-256-ecb
  variant: size
  source:
    kind: derived
    derivation: 16 MiB plaintext, same generator
  params:
    plaintext_mib: 16
    key_bytes: 32
  args:
  - -i
  - build/aes/cuda/data/input_16MB.hex
  - -k
  - build/aes/cuda/data/key.hex
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  input_form: file
