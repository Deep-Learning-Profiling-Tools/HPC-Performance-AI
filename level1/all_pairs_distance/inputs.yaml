      path: 'src/all-pairs-distance-cuda Makefile run: ./main 10000 (= ctest)'
  params:
    iterations: 10000
  args:
  - '10000'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
  notes: the only command-line parameter is the repetition count; the instance/attribute counts are compile-time
