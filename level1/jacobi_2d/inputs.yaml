# Registered inputs of jacobi_2d (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: jacobi_2d
level: 1
selector: null
default_input: size1002
entry:
  kind: binary
  path: build/jacobi_2d/cuda/jacobi_2d_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: the standalone port prints only PASS/FAIL; upstream RAJAPerf's kernel timer is not ported
baseline:
  method: 'the outputs A and B against the frozen B200 golden reference (`check:` / `golden:` below); the added
    driver''s upstream Base_Seq CPU reference (element-wise, rel tol 1e-10) runs only once, offline, to validate that
    reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes A and B only when the
  # driver's CPU check printed PASS; every later run is compared with those frozen outputs instead.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: A
    dtype: f64
    rule: {metric: max_rel1p, tol: 1.0e-10}
    cpu: A.cpu
    basis: the driver's element-wise check of A (f64[len]) against the upstream Base_Seq CPU reference,
      max |g - r| / (1 + |r|) <= 1e-10 (common/rp_common.hpp:121-124 compareArrays, cuda/main.cu:113); the check
      allows 1e-10 minus the B200 output's own deviation from the CPU reference
  - name: B
    dtype: f64
    rule: {metric: max_rel1p, tol: 1.0e-10}
    cpu: B.cpu
    basis: the driver's element-wise check of B (f64[len]) against the upstream Base_Seq CPU reference,
      max |g - r| / (1 + |r|) <= 1e-10 (common/rp_common.hpp:121-124 compareArrays, cuda/main.cu:114); the check
      allows 1e-10 minus the B200 output's own deviation from the CPU reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'A and B against the frozen B200 golden reference reference/<input_id>.json (max |a - g| / (1 + |g|) <= 1e-10
    - d0 per output, d0 = the golden''s deviation from the upstream Base_Seq CPU reference measured when it was
    frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream default size plus larger sizes through the port's size argument (upstream --size)
inputs:
- id: size1002
  case: jacobi-2d
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/RAJAPerf
      version: b0f1cd36afd7c2ac57fcb1dc676012be28fb1327
      path: upstream default problem size 1002 (grid edge N), 2000 reps (= ctest, no arguments)
  params:
    size: 1002
    reps: 2000
  args: []
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: size2004
  case: jacobi-2d
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/RAJAPerf
      version: b0f1cd36afd7c2ac57fcb1dc676012be28fb1327
      path: 'upstream --size mechanism: problem size 2004 (grid edge N); reps unchanged'
  params:
    size: 2004
    reps: 2000
  args:
  - '2004'
  - '2000'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: size4008
  case: jacobi-2d
  variant: size
  source:
    kind: upstream-parameterized
    upstream:
      repo: LLNL/RAJAPerf
      version: b0f1cd36afd7c2ac57fcb1dc676012be28fb1327
      path: 'upstream --size mechanism: problem size 4008 (grid edge N); reps unchanged'
  params:
    size: 4008
    reps: 2000
  args:
  - '4008'
  - '2000'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
