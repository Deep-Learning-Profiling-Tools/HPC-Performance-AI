# Registered inputs of backprop (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: backprop
level: 1
selector: null
default_input: n65536
entry:
  kind: binary
  path: build/backprop/cuda/backprop_cuda
timing:
  kind: none
  status: NEEDS_TIMING_SUPPORT
  reason: the CUDA port prints no timer (only the error lines and PASS)
baseline:
  method: 'the trained weights (input and hidden layer) against the frozen B200 golden reference (`check:` / `golden:`
    below); the added check''s CPU training step (upstream bpnn_train on a cloned network, cuda/facetrain.c) runs only
    once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes the weights only
  # when the added check printed PASS; every later run is compared with those frozen outputs instead.
  # The check also compares the output/hidden error scalars. Upstream's bpnn_train_cuda (cuda/backprop_cuda.cu:60) never
  # wrote *eo / *eh, so they were uninitialized in backprop_face (cuda/facetrain.c:70); since 2026-10-27 it returns
  # them (after the ROI). They are NOT captured: the frozen spec is unchanged.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: input_weights
    dtype: f32
    rule: {metric: max_rel1p, tol: 1.0e-3}
    cpu: input_weights.cpu
    basis: the added check's rel_diff |a - b| / (1 + |b|) <= 1e-3 of net->input_weights[0..in][0..hid] against the
      CPU-trained clone (cuda/facetrain.c:63, :102, :113); the check allows 1e-3 minus the B200 output's own deviation
      from the CPU reference
  - name: hidden_weights
    dtype: f32
    rule: {metric: max_rel1p, tol: 1.0e-3}
    cpu: hidden_weights.cpu
    basis: the added check's rel_diff |a - b| / (1 + |b|) <= 1e-3 of net->hidden_weights[0..hid][0..out] against the
      CPU-trained clone (cuda/facetrain.c:63, :107, :113); the check allows 1e-3 minus the B200 output's own deviation
      from the CPU reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'input_weights and hidden_weights against the frozen B200 golden reference reference/<input_id>.json (max |a -
    g| / (1 + |g|) <= 1e-3 - d0 per matrix, d0 = the golden''s deviation from the CPU-trained clone measured when it was
    frozen); no CPU reference is run. The error scalars the added check also compares (uninitialized on the GPU path
    before 2026-10-27) are not part of the golden spec'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus two larger input layers
inputs:
- id: n65536
  case: backprop-train
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: HPC-FAIR/rodinia_3.1
      version: 366b283456506ef2fe2c2b7dc5e83e941ffc5524
      path: 'cuda/backprop run: ./backprop 65536 (= ctest)'
  params:
    input_layer_size: 65536
  args:
  - '65536'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n262144
  case: backprop-train
  variant: size
  source:
    kind: derived
    derivation: input layer x4 (positional parameter)
  params:
    input_layer_size: 262144
  args:
  - '262144'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n524288
  case: backprop-train
  variant: size
  source:
    kind: derived
    derivation: >-
      input layer x8 (the port's hidden-layer kernel launches dim3 grid(1, in/16), so the input layer is
      limited to 16 x 65535 = 1,048,560 units: 1,048,576 fails with 'bpnn kernel error: invalid argument',
      recorded in the rollout measurements as an attempted size that is NOT registered)
  params:
    input_layer_size: 524288
  args:
  - '524288'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
