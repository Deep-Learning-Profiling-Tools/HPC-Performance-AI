# Registered inputs of adam (schema hpcperf-inputs-1), read by tools/inputs/hpcperf_inputs.py.
# Level 1 has no run.sh: the tool runs the binary with the input's arguments; the ctest default is unchanged.
schema: hpcperf-inputs-1
benchmark: adam
level: 1
selector: null
default_input: n10000-t200
entry:
  kind: binary
  path: build/adam/cuda/adam_cuda
timing:
  scope: the benchmark's own timer around the Adam update kernel, averaged over `repeat` launches (main_compute
    = average x repeat); allocation, H2D/D2H and the CPU reference are outside
  kind: per_iteration
  unit: ms
  regex: ^Average kernel execution time (?P<value>[0-9.eE+-]+) \(ms\)
  select: only
  work:
    key: repeat
    offset: 0
baseline:
  method: 'the output p against the frozen B200 golden reference (`check:` / `golden:` below); the upstream
    CPU reference (reference.h) runs only once, offline, to validate that reference (tools/golden make)'
  reference: reference/<input_id>.json (frozen golden reference; tools/golden)
  quantities:
  - name: fail_marker
    role: diagnostic
    regex: ^FAIL$
    compare:
      rule: absent
golden:
  # tools/golden/README.md. make runs the unmodified build once with HPCPERF_CPU_REFERENCE=1 and freezes p only when
  # the upstream check printed PASS; every later run is compared with that frozen output instead.
  mode: data
  cpu_check: {pass_regex: '^PASS$', fail_regex: '^FAIL$'}
  outputs:
  - name: p
    dtype: f32
    rule: {metric: max_abs, tol: 1.0e-3}
    cpu: p.cpu
    basis: upstream's element-wise check |r[i] - p[i]| <= 1e-3 against the CPU reference (cuda/main.cu, reference.h);
      the check allows 1e-3 minus the B200 output's own deviation from the CPU reference
check:
  kind: post_run
  run_env: {HPCPERF_GOLDEN_DUMP: '{run_dir}/golden-capture'}
  command: [python3, '{repo}/tools/golden/hpcperf_golden.py', check, '{bench_dir}', '{input_id}', --dump, '{run_dir}/golden-capture']
  pass_regex: '^PASS: golden check'
  fail_regex: '^FAIL: golden check'
  basis: 'p against the frozen B200 golden reference reference/<input_id>.json (max |a - g| <= 1e-3 - d0, d0 = the
    golden''s deviation from the upstream CPU reference measured when it was frozen); no CPU reference is run'
  covers: all
coverage:
  status: MULTI_INPUT
  reason: upstream run line plus two larger vector sizes through the benchmark's own size parameter
inputs:
- id: n10000-t200
  case: adam-update
  variant: default
  source:
    kind: upstream-parameterized
    upstream:
      repo: ORNL/HeCBench
      version: 23714d9980070bc5543e99c11fd93ee6f79c6947
      path: 'src/adam-cuda Makefile run: ./main 10000 200 100 (= ctest)'
  params:
    vector_size: 10000
    time_steps: 200
    repeat: 100
  args:
  - '10000'
  - '200'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n100000-t200
  case: adam-update
  variant: size
  source:
    kind: derived
    derivation: vector size (positional parameter 1) x10; time steps and repeat unchanged
  params:
    vector_size: 100000
    time_steps: 200
    repeat: 100
  args:
  - '100000'
  - '200'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
- id: n1000000-t200
  case: adam-update
  variant: size
  source:
    kind: derived
    derivation: vector size x100
  params:
    vector_size: 1000000
    time_steps: 200
    repeat: 100
  args:
  - '1000000'
  - '200'
  - '100'
  runtime_config:
    gpus: 1
  build_config: null
  backends_validated:
  - cuda
