schema: hpcperf-freeze-spec-1
name: cholla
level: 3
application: Cholla (GPU hydrodynamics)
benchmark_source_version: hpcperf-l3-v1
components:
- dest: src
  category: application
  kind: git
  checkout: _upstream/level3/cholla
  url: https://github.com/cholla-hydro/cholla.git
  ref: v3.0.0
  commit: 8478c9ede8a5e2cb72d6481a50023666d489a763
  note: the v3.0.0 release tag (2024-02-02, "Merge pull request #370 from cholla-hydro/dev"), the latest tag; the main branch holds four CI/docker commits after it and no code change. The cholla-tests-data submodule (fiducial outputs of upstream's gtest system tests) is not part of the bundle (not fetched; the registered inputs are checked against analytic solutions and this build's frozen references).
  submodules: []
  exclude:
  - path: docs
    reason: documentation (doxygen sources); not built
  - path: docker
    reason: container recipes; not built, not run
  - path: python_scripts
    reason: post-processing / plotting scripts; not run
  - path: scale_output_files
    reason: cosmology output-time tables for the FOM scaling runs; not used by any registered input
  patches:
  - path: patches/0001-makefile-git-hash-from-make-variable.patch
    upstream_source: 'local 3-line Makefile change: GIT_HASH ?= $(shell git rev-parse --verify HEAD) so that build.sh can pass the frozen commit (the bundle is not a git checkout; upstream static_asserts a 40-character GIT_HASH, error_handling.cpp:41)'
    category: D
  license:
    spdx: MIT
    files:
    - LICENSE.txt
  bundled: []
environment_provided:
- name: CUDA Toolkit
  version: 13.2.78
- name: GCC (nvcc host compiler through mpicxx)
  version: 13.3.0
  provided_by: .conda_env
- name: Open MPI
  version: 5.0.10
  provided_by: .conda_env
- name: HDF5
  version: 2.2.0 (mpi_openmpi build)
  provided_by: .conda_env
equivalence:
- archive_path: src
  validated_tree: _upstream/level3/cholla
  ignore:
  - .git/*
  - cholla-tests-data
  - cholla-tests-data/*
  - docs/*
  - docker/*
  - python_scripts/*
  - scale_output_files/*
licenses:
- path: src
  project: Cholla
  license: MIT (LICENSE.txt, Copyright (c) 2018 Evan E. Schneider)
  url: https://github.com/cholla-hydro/cholla
  commit: 8478c9ede8a5e2cb72d6481a50023666d489a763
license_notes:
- Cholla is MIT-licensed; the unmodified source with its LICENSE.txt and the one class-D Makefile patch (patch_series.txt) is redistributed as a source bundle.
- The registered parameter files under level3/cholla/inputs/ are this benchmark's files, derived from upstream's examples/ as documented in inputs.yaml; they are not part of the frozen artifact.
redistribution_status: cleared
source_scope:
  application_owned:
  - src/src/*
  - src/Makefile
  - src/builds/*
  benchmark_specific:
  - inputs/*
  test:
  - src/src/system_tests/*
  exclude:
  - src/examples/*
  - src/tools/*
  - src/Jenkinsfile
