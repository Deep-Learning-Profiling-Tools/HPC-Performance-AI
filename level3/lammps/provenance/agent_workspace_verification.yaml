evidence_kept_locally: "<workspace>/reports/iter-{1..6}.{check.json,diff,verdict.yaml,validate.log}, <workspace>/.deps/level3/lammps/logs/build-cuda.log (not committed: local run artifacts)"
conclusions:
  - an agent edit inside the modifiable scope enters compile -> run -> validate (the failing build proves compilation of the edited file; the changed binary hash proves no stale binary is reused)
  - readonly tampering (validator, reference) is refused before anything runs
  - the canonical benchmark is untouched by workspace activity; the workspace depends on no application source outside itself (environment symlinks .conda_env/.tools only)
