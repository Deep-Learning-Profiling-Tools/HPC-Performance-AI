  - {step: 11, action: "append a line to validate.sh in the workspace, tools/validate_workspace.sh --iteration 4", expected: REFUSED, rc: 3, note: "READONLY TAMPERING detected by the agent-mode check; nothing built or run; verdict REFUSED recorded"}
