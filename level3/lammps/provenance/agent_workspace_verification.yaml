    - {step: 4, action: "append a line to src/cmake/CMakeLists.txt (source build configuration)", result: "allowed, listed as modified; restored", rc: 0}
    - {step: 5, action: "append a line to validate.sh; tools/validate_workspace.sh --iteration 11 --skip-build -- CUDA", result: "REFUSED, exit 6, layer integrity, no run directory created; restored", rc: 6}
    - {step: 6, action: "append a line to src/bench/log.15Jul25.lj.fixed.g++.1 (reference declared in benchmark.yaml, lives under src/); --iteration 12", result: "REFUSED, exit 6", rc: 6}
