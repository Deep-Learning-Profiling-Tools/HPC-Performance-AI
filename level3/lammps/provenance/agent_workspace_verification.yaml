conclusions:
  - an agent edit inside the modifiable scope enters compile -> run -> validate (the failing build proves compilation of the edited file; the changed binary hash proves no stale binary is reused)
  - readonly tampering (validator, reference) is refused before anything runs
  - the canonical benchmark is untouched by workspace activity; the workspace depends on no application source outside itself (environment symlinks .conda_env/.tools only)
workspace_integrity_regression_2026_09_13:
  reason: "optimization_scope.yaml and the modifiable/readonly/excluded classification were removed; the integrity model is now 'protected by default, source tree (src/**, deps/**) explicitly mutable'. This regression proves the protection is unchanged in substance on the existing loop-001 workspace (2026-09-10 baseline, schema 1) and on a fresh ExaCA workspace created with the current tooling (schema-2 baseline with harness hashes)."
  driver: maintainer script, static checks except step 12; no hpcperf_env.sh in the harness shell (the tools need the system python with PyYAML; the workspace's validate.sh sets up the toolchain itself)
  steps:
    - {step: 1, action: "check_workspace level3/lammps (baseline mode) and check_workspace <ws> --agent-mode --iteration 10", result: "canonical 15/15; workspace PASS with its existing edit of src/src/KOKKOS/pair_lj_cut_kokkos.cpp, 0 protected violations", rc: 0}
