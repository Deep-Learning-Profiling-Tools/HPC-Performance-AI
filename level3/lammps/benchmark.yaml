name: lammps
level: 3
application: LAMMPS
description: LAMMPS KOKKOS/CUDA package, upstream bench/ decks (in.lj default; in.eam, in.rhodo and scaled in.lj sizes
  registered in inputs.yaml, HPCPERF_LAMMPS_INPUT) at 1/2/4 GPUs, one MPI rank per GPU
supported_backends:
- cuda
- hip
validated_backends:
- cuda
distributed_model: MPI, one rank per GPU (Kokkos CUDA), gpu-aware MPI on (-pk kokkos gpu/aware on)
default_scale_mode: smoke
scale_modes:
  smoke: bench/in.lj 32^3 lattice x 4 = 131,072 atoms, 100 steps, validated 1/2/4 GPUs (2026-09-07 regression fc4d2a1)
  strong: 16.4M atoms, completed 1/4 GPU runs (no numerical acceptance beyond smoke criteria)
  weak: 2.05M atoms per rank, completed 4-GPU run
multi_node: BLOCKED/UNVERIFIED on this site
gpu_40_80: DRY-RUN only (HPCPERF_DRY_RUN=1), never executed
build_entry: ./build.sh
run_entry: ./run.sh
validate_entry: ./validate.sh
environment_profile: hpcperf_env.sh (conda GCC 13.3.0 host compiler, CUDA 13.2.78, Open MPI 5.0.10, site profile gmu-hopper)
install_root: .deps/level3/lammps/cuda
profile_scheme: '<backend> or <variant>.<backend> (cuda validated; reaxff.cuda = HPCPERF_LAMMPS_VARIANT=reaxff adds the REAXFF package, validated 2026-09-21; hip: build path present, untested -- no ROCm on the validation node); override HPCPERF_LAMMPS_PROFILE must name the backend; generated state .deps/level3/lammps/<profile>/ and build/level3/lammps/<profile>/'
dependency_installs: []
inputs:
- src/bench/in.lj
- src/bench/in.eam
- src/bench/Cu_u3.eam
- src/bench/in.rhodo
- src/bench/data.rhodo
registered_inputs: inputs.yaml       # schema hpcperf-inputs-1; ids lj-32k lj-2m lj-16m eam-32k rhodo-32k (profile cuda), reaxff-hns-2k reaxff-hns-16k (profile reaxff.cuda, HPCPERF_LAMMPS_VARIANT=reaxff) (tools/inputs/)
references:
- src/examples/reaxff/HNS/log.30Nov23.reaxff.hns.g++.1
- src/bench/log.15Jul25.lj.fixed.g++.1
- src/bench/log.15Jul25.eam.fixed.g++.1
- src/bench/log.15Jul25.rhodo.fixed.g++.1
