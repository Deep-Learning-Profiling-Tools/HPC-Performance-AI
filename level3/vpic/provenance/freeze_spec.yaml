schema: hpcperf-freeze-spec-1
name: vpic
level: 3
application: VPIC (vpic-kokkos)
benchmark_source_version: hpcperf-l3-v1
components:
- dest: src
  category: application
  kind: git
  checkout: _upstream/level3/vpic-kokkos
  url: https://github.com/lanl/vpic-kokkos.git
  ref: devel
  commit: 7eb2947e12741df4931088a3ae6175adb21a6535
  note: vpic-kokkos publishes no release tags (only archive/* tags); the identity is this devel-branch commit (2026-10-13, "Merge pull request #113 from lanl/energies_plotter")
  submodules:
  - path: kokkos
    url: https://github.com/kokkos/kokkos.git
    ref: 6d4434baacc86ec428b5300ebe853a085760d9af
    commit: 6d4434baacc86ec428b5300ebe853a085760d9af
    note: the Kokkos commit upstream pins (5.2.2); built by VPIC's own CMake (BUILD_INTERNAL_KOKKOS=ON, upstream's arch/CUDA-Release recipe)
  exclude: []
  patches: []
  license:
    spdx: BSD-3-Clause
    files:
    - README.md
  bundled:
  - path: kokkos
    project: Kokkos
    version: 5.2.2
    license: Apache-2.0 WITH LLVM-exception
environment_provided:
- name: CUDA Toolkit
  version: 13.2.78
- name: GCC (nvcc_wrapper host compiler)
  version: 13.3.0
  provided_by: .conda_env
- name: Open MPI
  version: 5.0.10
  provided_by: .conda_env
- name: CMake / Ninja
  provided_by: .conda_env
equivalence:
- archive_path: src
  validated_tree: _upstream/level3/vpic-kokkos
  ignore:
  - .git/*
  - '*/.git'
  - '*/.git/*'
licenses:
- path: src
  project: vpic-kokkos (VPIC 2.0)
  license: BSD-3-Clause (README.md "Copyright" section; Triad National Security, LLC, 2022)
  url: https://github.com/lanl/vpic-kokkos
  commit: 7eb2947e12741df4931088a3ae6175adb21a6535
- path: src/kokkos
  project: Kokkos (bundled submodule)
  license: Apache-2.0 WITH LLVM-exception
  version: 5.2.2
license_notes:
- VPIC 2.0 is BSD-3-Clause (the license text is the "Copyright" section of README.md; the repository ships no separate LICENSE file); the unmodified source with that README is redistributed as a source bundle.
- The input decks under level3/vpic/decks/ are this benchmark's files, derived from upstream's sample and test decks as documented in inputs.yaml; they are not part of the frozen artifact.
redistribution_status: cleared
source_scope:
  application_owned:
  - src/src/*
  - src/deck/*
  bundled:
