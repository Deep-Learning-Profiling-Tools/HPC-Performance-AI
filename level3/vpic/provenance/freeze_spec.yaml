  benchmark_specific:
  - deps/*
  test:
  - src/test/*
  exclude:
  - src/docs/*
  - src/sample/*
  - src/arch/*
  - src/TestScripts/*
  - src/scripts/*
  - src/post/*
  - src/interfaces/*
  - src/utilities/*
  - src/cmake/*
  - src/bin/*
