schema: hpcperf-optimization-scope-1
benchmark: qmcpack
modifiable:
  - src/src/*                      # QMCPACK application source (incl. Platforms/OMPTarget, CUDA)
readonly:
  - build.sh
  - run.sh
  - validate.sh
  - fetch.sh
  - benchmark.yaml
  - optimization_scope.yaml
  - provenance/*
  - archives/*
  - qmc_check.py
  - toolchain/*                    # LLVM build/probe scripts (environment)
  - src/tests/*                    # decks, pseudopotentials, reference scalars, check_scalars.py
  - src/external_codes/*           # bundled external codes
  - src/labs/*
  - src/nexus/*
  - src/docs/*
  - src/utils/*
  - src/config/*
  - src/CMake/*
  - src/CMakeLists.txt
  - deps/*
excluded:
  - src/external_codes/*
loc_categories:
  application_owned: [src/src/*]
  bundled_dependency: [src/external_codes/*]
  benchmark_specific_dependency: [deps/*]
  test: [src/tests/*]
  exclude: [src/docs/*, src/labs/*, src/nexus/*, src/utils/*, src/config/*, src/CMake/*, src/.github/*, src/examples/*]
