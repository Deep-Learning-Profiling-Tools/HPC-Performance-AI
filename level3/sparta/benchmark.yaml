name: sparta
level: 3
application: SPARTA
description: SPARTA DSMC (KOKKOS/CUDA package), collisional-flow bench deck (in.collide) at 1/2/4 GPUs, one MPI rank per GPU
supported_backends:
- cuda
- hip
validated_backends:
- cuda
distributed_model: MPI, one rank per GPU (Kokkos CUDA), gpu-aware MPI on (-pk kokkos gpu/aware yes)
default_scale_mode: smoke
scale_modes:
  smoke: bench/in.collide 10x10x10 cells, 10,000 particles, 30+100 steps, validated 1/2/4 GPUs (2026-09-07 regression fc4d2a1)
  strong: 100^3 cells = 10M particles, completed 1/4 GPU runs
  weak: 50^3 cells per rank (1.25M particles/rank), completed 4-GPU run
multi_node: BLOCKED/UNVERIFIED on this site
gpu_40_80: DRY-RUN only, never executed
build_entry: ./build.sh
run_entry: ./run.sh
validate_entry: ./validate.sh
environment_profile: hpcperf_env.sh (conda GCC 13.3.0 host compiler, CUDA 13.2.78, Open MPI 5.0.10, site profile gmu-hopper)
install_root: .deps/level3/sparta/cuda
profile_scheme: '<backend> (cuda validated; hip: build path present, untested -- no ROCm on the validation node); override HPCPERF_SPARTA_PROFILE must name the backend; generated state .deps/level3/sparta/<profile>/ and build/level3/sparta/<profile>/'
dependency_installs: []
inputs:
- src/bench/in.collide
- src/bench/ar.species
- src/bench/ar.vss
references:
- src/bench/log.7Jul14.collide.icc.10K.1
