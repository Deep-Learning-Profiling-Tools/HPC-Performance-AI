schema: hpcperf-optimization-scope-1
benchmark: sparta
modifiable:
  - src/src/*                      # SPARTA core + KOKKOS package (application-owned)
readonly:
  - build.sh
  - run.sh
  - validate.sh
  - fetch.sh
  - benchmark.yaml
  - optimization_scope.yaml
  - provenance/*
  - archives/*
  - src/bench/*                    # decks, data files, reference logs
  - src/data/*
  - src/examples/*
  - src/doc/*
  - src/cmake/*
  - src/lib/*                      # bundled Kokkos and other libraries (dependency source)
  - src/tools/*
  - src/python/*
excluded:
  - src/lib/kokkos/*
loc_categories:
  application_owned: [src/src/*]
  bundled_dependency: [src/lib/*]
  benchmark_specific_dependency: [deps/*]
  test: [src/tools/testing/*]
  exclude: [src/doc/*, src/examples/*, src/bench/*, src/data/*, src/tools/*, src/python/*, src/cmake/*, src/.github/*]
