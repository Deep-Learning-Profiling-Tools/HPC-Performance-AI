name: nekrs
level: 3
application: nekRS
description: nekRS v26.0 (OCCA/CUDA, vendored HYPRE), ethier case with --cimode CI checks at 1/2/4 GPUs; two frozen source
  variants (hypregpu = v26.0 + 3 HYPRE CUDA-13 patches; cpucoarse = exact v26.0)
supported_backends:
- cuda
- hip
validated_backends:
- cuda
distributed_model: MPI, one rank per GPU (--device-id 0 under the launcher wrapper), GPU-aware MPI off (upstream default)
default_scale_mode: smoke
scale_modes:
  smoke: examples/ethier (32 elements, N=9, 100 steps), 9/9 CI checks; validated 1/2/4 GPUs for hypregpu cimode 2 and 3 and
    cpucoarse cimode 2 (2026-09-07 regression fc4d2a1)
  strong: ethierRefine hrefine=10 (32,000 elements, N=7), completed 1/4 GPU runs
  weak: ~8,000 elements per rank, completed 4-GPU run
multi_node: BLOCKED/UNVERIFIED on this site
gpu_40_80: DRY-RUN only, never executed
build_entry: ./build.sh
run_entry: ./run.sh
validate_entry: ./validate.sh
environment_profile: hpcperf_env.sh (conda GCC 13.3.0 C/C++ via the MPI wrappers, system gfortran 14.2.1 via OMPI_FC, CUDA
  13.2.78, Open MPI 5.0.10, OMPI_MCA_osc=^ucx)
install_root: .deps/level3/nekrs
dependency_installs: []
