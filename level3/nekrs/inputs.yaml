# Registered inputs of nekrs (schema hpcperf-inputs-1), selected through HPCPERF_NEKRS_INPUT=<id> in run.sh
# (tools/inputs/README.md). Every input is an upstream deck/case of the FROZEN source tree (never modified) reached
# through run.sh's existing case/size knobs; without the variable run.sh behaves as before.
schema: hpcperf-inputs-1
benchmark: nekrs
level: 3
selector: HPCPERF_NEKRS_INPUT
default_input: ethier-n9-100
entry:
  kind: run.sh
  path: level3/nekrs/run.sh
  backend_arg: CUDA
timing:
  scope: 'nekRS''s own elapsedStepSum after the last step: the sum of the time-step wall times (solver only; setup,
    JIT compilation and the ''runtime statistics'' totalElapsed which includes them are excluded)'
  kind: total
  unit: s
  regex: elapsedStepSum=\s*(?P<value>[0-9.eE+-]+)s
  select: last
baseline:
  method: upstream's --cimode CI checks ('CI test <name> passed') are run by validate.sh; a plain run prints the
    divergence error per step, recorded as a diagnostic
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: div_u_err_final
    role: diagnostic
    regex: divUErr\s*:\s*(?P<value>[0-9.eE+-]+)
    select: last
    compare:
      rule: record
  - name: ci_failed
    role: required
    regex: CI test .* failed
    compare:
      rule: absent
coverage:
  status: MULTI_INPUT
  reason: the ethier case at three refinements is registered
  blocker: the other upstream examples (turbPipe, tgv, channel, rbc, kershaw, lowMach, ...) are in the frozen tree
    but run.sh hard-wires --setup ethier and copies that case directory; a case selector is a run.sh change (not
    done this round)
  upstream_inputs_not_added:
  - examples/turbPipe
  - examples/tgv
  - examples/channel
  - examples/rbc
  - examples/kershaw
  - examples/lowMach
  - '...'
inputs:
- id: ethier-n9-100
  case: ethier
  variant: default
  source:
    kind: upstream-file
    upstream:
      repo: Nek5000/nekRS
      version: hpcperf-l3-v1 (nekRS v26.0 frozen tree, variant hypregpu)
      path: examples/ethier/ethier.par as shipped (32 elements, N=9, 100 steps) -- run.sh smoke
  params:
    case: ethier
    elements: 32
    order: 9
    steps: 100
  env:
    HPCPERF_SCALE_MODE: smoke
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: ethier-refine4-n7
  case: ethier
  variant: size
  source:
    kind: derived
    derivation: examples/ethier/ethierRefine.par with hrefine=4 (2,048 elements, N=7) -- run.sh strong mode with
      HPCPERF_NEKRS_HREFINE=4; only hrefine/numSteps differ (class A)
  params:
    case: ethier
    hrefine: 4
    elements: 2048
    order: 7
  env:
    HPCPERF_SCALE_MODE: strong
    HPCPERF_NEKRS_HREFINE: '4'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: ethier-refine10-n7
  case: ethier
  variant: size
  source:
    kind: derived
    derivation: ethierRefine.par with hrefine=10 (32,000 elements, N=7; run.sh strong default)
  params:
    case: ethier
    hrefine: 10
    elements: 32000
    order: 7
  env:
    HPCPERF_SCALE_MODE: strong
    HPCPERF_NEKRS_HREFINE: '10'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
