schema: hpcperf-optimization-scope-1
benchmark: geos
modifiable:
  - src/src/coreComponents/*       # GEOS application source (physics solvers, linear algebra interface, mesh, ...)
readonly:
  - build.sh
  - run.sh
  - validate.sh
  - fetch.sh
  - benchmark.yaml
  - optimization_scope.yaml
  - provenance/*
  - archives/*
  - patches/*
  - host-configs/*
  - geos_beam_check.py
  - src/src/coreComponents/LvArray/*                        # submodule: bundled dependency
  - src/src/coreComponents/constitutive/HPCReact/*          # submodule: bundled dependency
  - src/src/coreComponents/fileIO/coupling/hdf5_interface/* # submodule: bundled dependency
  - src/src/coreComponents/*/unitTests/*                    # unit tests (dependency probe, not the benchmark)
  - src/src/cmake/*
  - src/src/CMakeLists.txt
  - src/src/docs/*
  - src/inputFiles/*               # official decks (beamBending) = benchmark inputs
  - src/examples/*
  - src/scripts/*
  - src/host-configs/*
  - src/integratedTests/*
  - deps/*                         # thirdPartyLibs superbuild + TPL source tarballs
excluded:
  - deps/*
  - src/src/coreComponents/LvArray/*
  - src/src/coreComponents/constitutive/HPCReact/*
  - src/src/coreComponents/fileIO/coupling/hdf5_interface/*
loc_categories:
  application_owned: [src/src/coreComponents/*, src/src/main/*]
  bundled_dependency: [src/src/coreComponents/LvArray/*, src/src/coreComponents/constitutive/HPCReact/*, src/src/coreComponents/fileIO/coupling/hdf5_interface/*, src/src/cmake/blt/*]
  benchmark_specific_dependency: [deps/*]
  test: [src/src/coreComponents/*/unitTests/*, src/src/coreComponents/LvArray/unitTests/*]
  exclude: [src/src/docs/*, src/inputFiles/*, src/examples/*, src/scripts/*, src/host-configs/*, src/integratedTests/*, src/.github/*, src/src/pygeosx/*]
