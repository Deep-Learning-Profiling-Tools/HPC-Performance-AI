license_notes:
- 'LICENSE BLOCKER (decision needed): parmetis-4.0.3.tar.gz -- ParMETIS is distributed under the University of Minnesota license,
  which permits use for research/educational purposes but does not grant a general right to redistribute the source. GEOS''
  superbuild downloads it from an ANL mirror. Bundling it into a redistributed source artifact that is distributed with this repository may
  not be permitted; the freeze records it here and the user decides whether to (a) keep it in the bundle (private repository
  only), (b) move it to an environment-provided download resolved by build.sh from the recorded URL+sha256, or (c) drop ParMETIS.
  METIS 5.1.0 (inside the same tarball) is Apache-2.0.'
- SuiteSparse 5.10.1 mixes LGPL/GPL modules (UMFPACK is GPL); the complete source is redistributed, which GPL permits; no
  derived binary is distributed.
- uncrustify (GPL-2.0-or-later) is only a build-time code formatter that the superbuild builds; its source is redistributed
  complete.
- 'The GEOS integrated-test baseline tarball (baseline_integratedTests-pr3994-17525-4ae3593.tar.gz, 1.57 GB, LGPL-2.1 GEOS
  project data) is a DATASET, not source: it stays outside the source bundle (.deps/level3/geos/downloads/, url+sha256 recorded
  in benchmark.yaml) -- see benchmark.yaml `datasets`.'
