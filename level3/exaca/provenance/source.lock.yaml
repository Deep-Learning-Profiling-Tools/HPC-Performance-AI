license_notes:
- ExaCA (LLNL, MIT with NOTICE) and its example data (material interfacial-response files, 10,000-orientation grain files)
  are upstream repository content; redistribution in a source artifact is permitted.
- Kokkos 4.7.04 (Apache-2.0 WITH LLVM-exception) is a benchmark-specific source dependency (not bundled by ExaCA upstream);
  its LICENSE stays in the tree.
- nlohmann_json 3.12.0 (MIT) is the exact release tarball ExaCA's CMake would otherwise download at configure time (FetchContent);
  bundling it removes the build-time download.
- 'Finch (coupled heat transport) and GoogleTest are NOT bundled: the benchmark case does not use Finch and the unit tests
  are not built; no Finch-ExaCA coupled workflow is claimed.'
- 'No external dataset (ExaCA-Data temperature files) is bundled: the benchmark uses the analytic Directional problem type.'
