# What an optimization agent may change in this benchmark workspace. Paths are relative to the
# benchmark directory (level3/exaca or its workspace copy). Globs: '*' matches across '/'.
schema: hpcperf-optimization-scope-1
benchmark: exaca
modifiable:                        # application-owned source: the ExaCA cellular-automaton core and its executables
  - src/src/*
  - src/bin/*
  - src/analysis/src/*
readonly:                          # harness, criteria, inputs, references, provenance, dependency source -- never modified by the agent
  - build.sh
  - run.sh
  - validate.sh
  - fetch.sh
  - exaca_check.py
  - benchmark.yaml
  - optimization_scope.yaml
  - inputs/*
  - references/*
  - provenance/*
  - src/CMakeLists.txt             # top-level build (dependency discovery) stays the harness's business
  - src/cmake/*
  - src/examples/*                 # material / orientation data used as inputs
  - src/unit_test/*
  - src/analysis/unit_test/*
  - src/analysis/examples/*
  - src/analysis/bin/*
  - src/utilities/*
  - src/envs/*
  - deps/*
excluded:                          # not part of the benchmark at all
  - deps/kokkos/*                  # Kokkos is dependency source (whole-stack work = separate experimental scope)
  - deps/json/*
loc_categories:
  application_owned: [src/src/*, src/bin/*, src/analysis/src/*, src/analysis/bin/*]
  bundled_dependency: []
  benchmark_specific_dependency: [deps/*]
  test: [src/unit_test/*, src/analysis/unit_test/*]
  exclude: [src/examples/*, src/utilities/*, src/envs/*, src/cmake/*, src/CMakeLists.txt, src/analysis/examples/*, src/*.md, src/*.bib]
