name: exaca
level: 3
application: ExaCA
description: ExaCA 2.1.0 (Kokkos/CUDA cellular automaton for additive-manufacturing grain growth; Kokkos 4.7.04 and nlohmann_json
  3.12.0 from deps/), directional-solidification problem at 1/2/4 GPUs, one MPI rank per GPU (1-D decomposition in Y)
supported_backends:
- cuda
- hip
validated_backends:
- cuda
distributed_model: MPI, one rank per GPU (Kokkos CUDA), 1-D domain decomposition in Y with host-staged halo exchange (GPU-aware
  MPI not required)
default_scale_mode: smoke
scale_modes:
  smoke: 'directional solidification 128x128x128 cells (2.1M), Inconel625, G=5e5 K/m, R=3e5 K/s, nucleation density 10 (x1e12
    m^-3), substrate SurfaceSiteDensity 0.25; project-defined statistical validation (protocol v2): holdout 9/9 PASS at 1/2/4
    GPUs (2026-09-11)'
  strong: fixed global box 512x256x512 cells (67.1M) decomposed over the ranks in Y; completed 1/2/4 GPU runs (CA time 8.02/6.26/5.17
    s); a single rank cannot hold 512^3 (ExaCA int indexing of the 26-neighbour arrays)
  weak: 512x128x512 cells per rank (33.5M/rank), Y extent = 128*N; completed 1/2/4 GPU runs (CA time 4.88/6.16/6.80 s)
multi_node: UNVERIFIED on this site (multi-node MPI transport blocked)
gpu_40_80: DRY-RUN only (HPCPERF_DRY_RUN=1 HPCPERF_NODES=10|20), never executed
build_entry: ./build.sh
run_entry: ./run.sh
validate_entry: ./validate.sh
environment_profile: hpcperf_env.sh (conda GCC 13.3.0 host compiler behind nvcc_wrapper, CUDA 13.2.78, Open MPI 5.0.10, site
  profile gmu-hopper)
install_root: .deps/level3/exaca/cuda
profile_scheme: '<backend> (cuda validated; hip: build path present, untested -- no ROCm on the validation node); override HPCPERF_EXACA_PROFILE must name the backend; generated state .deps/level3/exaca/<profile>/ and build/level3/exaca/<profile>/'
dependency_installs:
- install/kokkos
- install/json
inputs:
- inputs/dirsolid.template.json
- src/examples/Materials/Inconel625.json
- src/examples/Substrate/GrainOrientationVectors.csv
references:
- references/dirsolid_smoke.reference.json
- references/dirsolid_smoke.tolerances.json
suite_status: retained
source_version: hpcperf-l3-v1
source_tree_sha256: b88e84b74db34b8adb58bc9924ec1e0f3c7d416c58577c5b16bcfbda11f81f44
