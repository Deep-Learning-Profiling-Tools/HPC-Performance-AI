schema: hpcperf-optimization-scope-1
benchmark: dftfe
modifiable:
  - src/src/*                      # DFT-FE application source (incl. CUDA/device code paths)
  - src/include/*
readonly:
  - build.sh
  - run.sh
  - validate.sh
  - fetch.sh
  - benchmark.yaml
  - optimization_scope.yaml
  - provenance/*
  - archives/*
  - patches/*
  - dftfe_check.py
  - elpa_probe.sh
  - src/testsGPU/*                 # upstream GPU regression decks + reference outputs (inputs/references)
  - src/tests/*
  - src/data/*
  - src/demo/*
  - src/doc/*
  - src/utils/*
  - src/setup*
  - src/CMakeLists.txt
  - src/cmake/*
  - deps/*                         # dependency source tarballs (built by build.sh, never modified)
excluded:
  - deps/*
loc_categories:
  application_owned: [src/src/*, src/include/*]
  bundled_dependency: []
  benchmark_specific_dependency: [deps/*]
  test: [src/tests/*, src/testsGPU/*]
  exclude: [src/data/*, src/demo/*, src/doc/*, src/utils/*, src/.github/*, src/cmake/*]
