environment_provided:
  - {name: CUDA Toolkit, version: 13.2.78}
  - {name: system GCC / gfortran, version: 14.2.1, provided_by: node}
  - {name: Open MPI, version: 5.0.10, provided_by: .conda_env}
  - {name: zlib, libxml2 (system headers/libraries), provided_by: node}
  - {name: CMake / Ninja, provided_by: .conda_env}
equivalence:
  - archive_path: src
    validated_tree: _upstream/level3/dftfe             # working tree with the isnan patch applied in place (the validated state)
    # include/git_info.h is written INTO the source tree by DFT-FE's CMake configure (untracked, generated);
    # build.sh therefore configures from a build-side copy of the frozen tree
    ignore: ['.git/*', 'include/git_info.h']
  - archive_path: deps/spglib
    validated_tree: .deps/level3/dftfe/downloads/spglib
    ignore: ['.git/*']
licenses:
  - {path: src, project: DFT-FE, license: LGPL-2.1-or-later, url: https://github.com/dftfeDevelopers/dftfe, commit: 7147faa51f7c9f3075fffaa5e48ba989bcd329c1}
  - {path: deps/openblas, project: OpenBLAS, license: BSD-3-Clause, version: 0.3.30}
  - {path: deps/scalapack, project: ScaLAPACK, license: BSD-3-Clause (modified), version: 2.2.2}
  - {path: deps/libxc, project: libxc, license: MPL-2.0, version: 7.0.0}
  - {path: deps/alglib, project: ALGLIB free edition, license: GPL-2.0-or-later, version: 4.06.0}
  - {path: deps/p4est, project: p4est, license: GPL-2.0-or-later, version: 2.8.7}
  - {path: deps/kokkos, project: Kokkos, license: Apache-2.0 WITH LLVM-exception, version: 4.6.00}
  - {path: deps/dealii, project: deal.II, license: LGPL-2.1-or-later, version: 9.6.2}
  - {path: deps/elpa, project: ELPA, license: LGPL-3.0-only, version: 2026.02.001}
  - {path: deps/spglib, project: spglib, license: BSD-3-Clause, commit: 02159eef6e7349535049a43fe2272bb634c77945}
license_notes:
  - "All dependency sources are redistributable source tarballs/checkouts with their license files inside (LGPL/GPL/MPL/BSD/Apache); the bundle redistributes them unmodified."
  - "ALGLIB free edition and p4est are GPL: the bundle ships their complete source, which satisfies the source-distribution requirement; the resulting dftfe binary is not distributed."
  - "deal.II 9.7.1 (attempt 1, incompatible API) is NOT bundled; only the 9.6.2 tarball used by the validated build is."
  - "Pseudopotentials and the upstream GPU reference outputs (testsGPU/, accuracyBenchmarks) are upstream repository content."
