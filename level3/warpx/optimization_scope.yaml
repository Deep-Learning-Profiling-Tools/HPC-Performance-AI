schema: hpcperf-optimization-scope-1
benchmark: warpx
modifiable:
  - src/Source/*                   # WarpX application source (incl. ablastr)
readonly:
  - build.sh
  - run.sh
  - validate.sh
  - fetch.sh
  - benchmark.yaml
  - optimization_scope.yaml
  - provenance/*
  - archives/*
  - src/Examples/*                 # input decks + analysis scripts used as inputs/references
  - src/Regression/*
  - src/Docs/*
  - src/Tools/*
  - src/Python/*
  - src/cmake/*
  - src/CMakeLists.txt
  - deps/*                         # AMReX (benchmark-specific dependency source)
excluded:
  - deps/amrex/*
loc_categories:
  application_owned: [src/Source/*]
  bundled_dependency: []
  benchmark_specific_dependency: [deps/*]
  test: [src/Regression/*]
  exclude: [src/Docs/*, src/Examples/*, src/Tools/*, src/Python/*, src/cmake/*, src/.github/*]
