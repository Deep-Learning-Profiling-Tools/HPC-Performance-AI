# Registered inputs of warpx (schema hpcperf-inputs-1), selected through HPCPERF_WARPX_INPUT=<id> in run.sh
# (tools/inputs/README.md). Every input is an upstream deck/case of the FROZEN source tree (never modified) reached
# through run.sh's existing case/size knobs; without the variable run.sh behaves as before.
schema: hpcperf-inputs-1
benchmark: warpx
level: 3
selector: HPCPERF_WARPX_INPUT
default_input: uniform-plasma-64x32x32-10
entry:
  kind: run.sh
  path: level3/warpx/run.sh
  backend_arg: CUDA
timing:
  scope: >-
    WarpX's own 'Total Time' (this stdout line): the AMReX timer printed at the end -- initialization, the Evolve
    loop and the final diagnostics flush. The headline timer of tools/timing (apptimers.py: warpx) is the final
    'Evolve time' line (warpx.verbose >= 1): the whole WarpX::Evolve step loop including in-loop diagnostics,
    without InitData and the final diagnostics flush; rank 0's clock; TinyProfiler regions synchronize the
    device. Its device activity is clipped to the NVTX range 'WarpX::Evolve()' the application emits itself.
  kind: total
  unit: s
  regex: ^Total Time\s*:\s*(?P<value>[0-9.eE+-]+)
  select: only
  app_timer:
    source: tools/timing/apptimers.py:warpx
    region: "final 'Evolve time' line: the WarpX::Evolve step loop (Source/Evolve/WarpXEvolve.cpp, Source/main.cpp)"
    relation: 'this stdout timer includes initialization and the final diagnostics flush; the headline is the Evolve loop only'
baseline:
  method: 'uniform_plasma has no reference output (performance case); langmuir''s analytic check is run by validate.sh''s
    analysis script, not from this log. No science value is printed to stdout: the registry records the completed
    step count only.'
  reference: this build's first measured run (self baseline); see method
  quantities:
  - name: steps_completed
    role: diagnostic
    regex: ^STEP (?P<value>\d+) ends\.
    select: last
    compare:
      rule: exact
coverage:
  status: MULTI_INPUT
  reason: the two run.sh cases at four sizes/step counts are registered
  blocker: the other upstream Physics_applications (laser_acceleration, plasma_acceleration, ...) are in the frozen
    tree but run.sh's case list is uniform_plasma|langmuir; adding a case needs a run.sh case entry per deck (not
    done this round)
  upstream_inputs_not_added:
  - Examples/Physics_applications/laser_acceleration/inputs_base_*
  - plasma_acceleration
  - beam_beam_collision
  - '...'
inputs:
- id: uniform-plasma-64x32x32-10
  check:
    kind: standalone
    command: [bash, '{bench_dir}/validate.sh', CUDA]
    env:
      HPCPERF_GPUS: '1'
    pass_regex: '^WarpX CUDA validation .*: PASS$'
    fail_regex: 'FAIL'
    basis: >-
      level3/warpx/validate.sh [2] on 1 GPU: this case (uniform_plasma smoke, 64x32x32, 10 steps) -- the macroparticle count constant and finite at every step (reduced diagnostics NP.txt) and the run reaching the final step; the only criterion upstream has for its performance case (no reference solution; the energy series is recorded for information only). [1] (langmuir) runs as an extra.
    covers: all
    timeout: 1800
  case: uniform-plasma-3d
  variant: default
  source:
    kind: upstream-file
    upstream:
      repo: BLAST-WarpX/warpx
      version: hpcperf-l3-v1 (WarpX 26.09 frozen tree e90d20b2)
      path: Examples/Physics_applications/uniform_plasma/inputs_base_3d as shipped (64x32x32 cells, 2 ppc, 10 steps)
        -- run.sh smoke
  params:
    case: uniform_plasma
    n_cell: 64 32 32
    steps: 10
  env:
    HPCPERF_WARPX_CASE: uniform_plasma
    HPCPERF_SCALE_MODE: smoke
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: uniform-plasma-128cubed-20
  check:
    kind: post_run
    command: [python3, '{bench_dir}/check_particle_conservation.py', '{repo}/build/level3/warpx/cuda/run.check.uniform-plasma-128cubed-20/uniform_plasma.weak.np1/diags/reducedfiles', '{param:steps}']
    run_env: {HPCPERF_L3_RUN_SUBDIR: run.check.uniform-plasma-128cubed-20}
    pass_regex: '^PASS: WarpX uniform_plasma particle conservation'
    fail_regex: 'VALIDATION ERROR'
    basis: >-
      validate.sh [2]'s criterion, unchanged except that the final step is this input's (20) instead of the smoke case's 10
      (check_particle_conservation.py on this input's own run directory): the reduced diagnostics NP.txt reach the registered
      final step, and the total macroparticle count and the total particle weight are finite and take a single value at every
      step. The deck is periodic in every direction with one species and no injection, ionization or resampling, so both are
      conserved exactly at any n_cell / step count -- an exact invariant, no tolerance. Energy is printed for the record only
      (the 2-particles-per-cell thermal plasma is not an energy-conservation test; no energy tolerance exists). Added 2026-10-06.
    covers: all
    timeout: 1800
  case: uniform-plasma-3d
  variant: size
  source:
    kind: derived
    derivation: 'uniform_plasma inputs_base_3d with amr.n_cell 128^3 and 20 steps (run.sh weak-mode single-rank
      size; derived class A: only n_cell/max_grid_size/max_step differ)'
  params:
    case: uniform_plasma
    n_cell: 128 128 128
    steps: 20
  env:
    HPCPERF_WARPX_CASE: uniform_plasma
    HPCPERF_SCALE_MODE: weak
    HPCPERF_WARPX_LOCAL: '128'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: uniform-plasma-256cubed-20
  check:
    kind: post_run
    command: [python3, '{bench_dir}/check_particle_conservation.py', '{repo}/build/level3/warpx/cuda/run.check.uniform-plasma-256cubed-20/uniform_plasma.strong.np1/diags/reducedfiles', '{param:steps}']
    run_env: {HPCPERF_L3_RUN_SUBDIR: run.check.uniform-plasma-256cubed-20}
    pass_regex: '^PASS: WarpX uniform_plasma particle conservation'
    fail_regex: 'VALIDATION ERROR'
    basis: >-
      validate.sh [2]'s criterion, unchanged except that the final step is this input's (20) instead of the smoke case's 10
      (check_particle_conservation.py on this input's own run directory): the reduced diagnostics NP.txt reach the registered
      final step, and the total macroparticle count and the total particle weight are finite and take a single value at every
      step. The deck is periodic in every direction with one species and no injection, ionization or resampling, so both are
      conserved exactly at any n_cell / step count -- an exact invariant, no tolerance. Energy is printed for the record only
      (the 2-particles-per-cell thermal plasma is not an energy-conservation test; no energy tolerance exists). Added 2026-10-06.
    covers: all
    timeout: 1800
  case: uniform-plasma-3d
  variant: size
  source:
    kind: derived
    derivation: amr.n_cell 256^3, 20 steps (run.sh strong-mode default, 33.6 M particles)
  params:
    case: uniform_plasma
    n_cell: 256 256 256
    steps: 20
  env:
    HPCPERF_WARPX_CASE: uniform_plasma
    HPCPERF_SCALE_MODE: strong
    HPCPERF_WARPX_GLOBAL: '256'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: uniform-plasma-64x32x32-100
  check:
    kind: post_run
    command: [python3, '{bench_dir}/check_particle_conservation.py', '{repo}/build/level3/warpx/cuda/run.check.uniform-plasma-64x32x32-100/uniform_plasma.smoke.np1/diags/reducedfiles', '{param:steps}']
    run_env: {HPCPERF_L3_RUN_SUBDIR: run.check.uniform-plasma-64x32x32-100}
    pass_regex: '^PASS: WarpX uniform_plasma particle conservation'
    fail_regex: 'VALIDATION ERROR'
    basis: >-
      validate.sh [2]'s criterion, unchanged except that the final step is this input's (100) instead of the smoke case's 10
      (check_particle_conservation.py on this input's own run directory): the reduced diagnostics NP.txt reach the registered
      final step, and the total macroparticle count and the total particle weight are finite and take a single value at every
      step. The deck is periodic in every direction with one species and no injection, ionization or resampling, so both are
      conserved exactly at any n_cell / step count -- an exact invariant, no tolerance. Energy is printed for the record only
      (the 2-particles-per-cell thermal plasma is not an energy-conservation test; no energy tolerance exists). Added 2026-10-06.
    covers: all
    timeout: 1800
  case: uniform-plasma-3d
  variant: steps
  source:
    kind: derived
    derivation: the shipped grid for 100 steps (HPCPERF_WARPX_STEPS)
  params:
    case: uniform_plasma
    n_cell: 64 32 32
    steps: 100
  env:
    HPCPERF_WARPX_CASE: uniform_plasma
    HPCPERF_SCALE_MODE: smoke
    HPCPERF_WARPX_STEPS: '100'
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
- id: langmuir-multi-64cubed-40
  check:
    kind: standalone
    command: [bash, '{bench_dir}/validate.sh', CUDA]
    env:
      HPCPERF_GPUS: '1'
    pass_regex: '^WarpX CUDA validation .*: PASS$'
    fail_regex: 'FAIL'
    basis: >-
      level3/warpx/validate.sh [1] on 1 GPU: this case (test_3d_langmuir_multi, 64^3, 40 steps) against the analytic Langmuir-wave solution -- max|E_sim-E_th|/max|E_th| < 5e-2 per component and charge conservation max|divE-rho/eps0|/max|rho/eps0| < 1e-11 (upstream analysis_3d.py criteria, CODATA-2022 constants), hardened reader (full plotfile, finite values); [2] (uniform_plasma smoke) runs as an extra.
    covers: all
    timeout: 1800
  case: langmuir-multi-3d
  variant: case
  source:
    kind: upstream-file
    upstream:
      repo: BLAST-WarpX/warpx
      version: hpcperf-l3-v1 (WarpX 26.09 frozen tree e90d20b2)
      path: 'Examples/Tests/langmuir/inputs_base_3d (test_3d_langmuir_multi: 64^3 cells, 40 steps; analytic solution
        -- the validate.sh case)'
  params:
    case: langmuir
    n_cell: 64 64 64
    steps: 40
  env:
    HPCPERF_WARPX_CASE: langmuir
    # not read for the langmuir case: run.sh runs upstream's test as shipped (64^3, 40 steps) and labels it mode=validate
    HPCPERF_SCALE_MODE: smoke
  runtime_config:
    gpus: 1
    ranks: 1
  build_config: null
  backends_validated:
  - cuda
