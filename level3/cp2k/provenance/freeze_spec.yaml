environment_provided:
  - {name: CUDA Toolkit, version: 13.2.78}
  - {name: system GCC / g++ / gfortran, version: 14.2.1, provided_by: node}
  - {name: Open MPI, version: 5.0.10, provided_by: .conda_env (wrappers redirected to the system GCC)}
  - {name: CMake / Ninja / Python, provided_by: .conda_env}
equivalence:
  - archive_path: src
    validated_tree: _upstream/level3/cp2k                 # pristine checkout; the toolchain patch is expected under tools/toolchain
    ignore: ['.git/*']
  - archive_path: src/tools/toolchain
    validated_tree: /tmp/hpcperf-l3-b2-scratch/cp2k-toolchain/cuda132-gcc142-ompi5010   # the patched toolchain copy the validated install ran (node-local scratch)
    # build/ (package builds), .hpcperf-patched (old build.sh marker) and toolchain_settings (written by
    # install_cp2k_toolchain.sh at run time, untracked upstream) are artifacts of the installer run
    ignore: ['build/*', '.hpcperf-patched', '*.log', 'toolchain_settings']
licenses:
  - {path: src, project: CP2K, license: GPL-2.0-or-later, url: https://github.com/cp2k/cp2k, commit: 67b5da876dd6a76b8b021d5a04d1c81ba79a4c50}
  - {path: deps/cp2k-toolchain-dist/OpenBLAS-0.3.33.tar.gz, project: OpenBLAS, license: BSD-3-Clause, version: 0.3.33}
  - {path: deps/cp2k-toolchain-dist/dbcsr-2.10.0.tar.gz, project: DBCSR, license: GPL-2.0-or-later, version: 2.10.0}
  - {path: deps/cp2k-toolchain-dist/scalapack-2.2.3.tar.gz, project: ScaLAPACK, license: BSD-3-Clause (modified), version: 2.2.3}
  - {path: deps/cp2k-toolchain-dist/fftw-3.3.11.tar.gz, project: FFTW, license: GPL-2.0-or-later, version: 3.3.11}
  - {path: deps/cp2k-toolchain-dist/libint-v2.13.1-cp2k-lmax-5.tar.xz, project: Libint (CP2K build), license: LGPL-3.0-only, version: 2.13.1}
  - {path: deps/cp2k-toolchain-dist/libxc-7.0.0.tar.bz2, project: libxc, license: MPL-2.0, version: 7.0.0}
  - {path: deps/cp2k-toolchain-dist/libxsmm-2.0.0.tar.gz, project: LIBXSMM, license: BSD-3-Clause, version: 2.0.0}
  - {path: deps/cp2k-toolchain-dist/libxs-1.0.0.tar.gz, project: LIBXS, license: BSD-3-Clause, version: 1.0.0}
  - {path: deps/cp2k-toolchain-dist/spglib-2.7.0.tar.gz, project: spglib, license: BSD-3-Clause, version: 2.7.0}
  - {path: deps/cp2k-toolchain-dist/eigen-5.0.1.tar.gz, project: Eigen, license: MPL-2.0, version: 5.0.1}
license_notes:
  - "CP2K, DBCSR and FFTW are GPL-2.0-or-later: the bundle redistributes their complete, unmodified source (the toolchain scripts of CP2K carry the class-B B200 back-port, recorded in provenance/original_vs_baseline.diff)."
  - "The toolchain tarballs are the exact files CP2K's installer downloads from cp2k.org (same sha256 as recorded in tools/toolchain/scripts/*/install_*.sh); they are redistributable under their own licenses (BSD/MPL/LGPL/GPL)."
  - "data/ (basis sets, potentials) and benchmarks/ are upstream repository content under the CP2K license."
