  - {dest: deps/cp2k-toolchain-dist/libxs-1.0.0.tar.gz, category: benchmark_specific, kind: file, url: https://www.cp2k.org/static/downloads/libxs-1.0.0.tar.gz, sha256: de26f50cb986a2f0e4f92c0eb489d40a44f7e4c5acd22751a6cfa2829dabd04d, project: LIBXS, version: 1.0.0, license: BSD-3-Clause}
  - {dest: deps/cp2k-toolchain-dist/spglib-2.7.0.tar.gz, category: benchmark_specific, kind: file, url: https://www.cp2k.org/static/downloads/spglib-2.7.0.tar.gz, sha256: b22fc9abae9716c574fbc6d55cfc53ed654a714fccc5657a26ff5d18114bd8bd, project: spglib, version: 2.7.0, license: BSD-3-Clause}
