schema: hpcperf-optimization-scope-1
benchmark: specfem3d
modifiable:
  - src/src/*                      # SPECFEM3D solver, mesher, generate_databases, GPU (CUDA) sources
readonly:
  - build.sh
  - run.sh
  - validate.sh
  - fetch.sh
  - benchmark.yaml
  - optimization_scope.yaml
  - provenance/*
  - archives/*
  - patches/*
  - src/external_libs/*            # bundled SCOTCH and others (dependency source)
  - src/EXAMPLES/*                 # example set-ups incl. the homogeneous_halfspace case + reference seismograms
  - src/DATA/*
  - src/utils/*                    # incl. the seismogram comparison script used by validate.sh
  - src/configure*
  - src/Makefile*
  - src/config.h.in
  - src/setup/*
  - src/flags.guess
  - src/m4/*
  - src/CUBIT_GEOCUBIT/*
excluded:
  - src/external_libs/*
loc_categories:
  application_owned: [src/src/*]
  bundled_dependency: [src/external_libs/*]
  benchmark_specific_dependency: [deps/*]
  test: [src/tests/*]
  exclude: [src/EXAMPLES/*, src/utils/*, src/DATA/*, src/CUBIT_GEOCUBIT/*, src/doc/*, src/.github/*, src/m4/*]
