schema: hpcperf-freeze-spec-1
name: specfem3d
level: 3
application: SPECFEM3D Cartesian
benchmark_source_version: v4.1.1
archive: archives/source_bundle.tar.zst
components:
  - dest: src
    category: application
    kind: git
    checkout: _upstream/level3/specfem3d
    url: https://github.com/SPECFEM/specfem3d.git
    ref: v4.1.1
    commit: c67d3ae7d4bfc5ac75cb9e5601d93afa262d3d8d
    submodules: []                               # m4, pyCMT3D, flexwin are not checked out and not needed
    exclude:
      - {path: doc, reason: "documentation (PDF manuals, figures); the validated private build copy was made without doc/ as well"}
    patches:                                     # back-ports of upstream devel cc2e9ffa7e7cb5338e05f5a7df81cfbe60e00683 (2026-07-24)
      - {path: patches/0001-cuda13-deviceOverlap-guard.patch, upstream_source: "SPECFEM/specfem3d devel cc2e9ffa", category: D}
      - {path: patches/0002-blackwell-device-block.patch, upstream_source: "SPECFEM/specfem3d devel cc2e9ffa", category: D}
    license: {spdx: GPL-3.0-or-later, files: [LICENSE]}
    bundled:
      - {path: external_libs/scotch_5.1.12b, project: SCOTCH, version: 5.1.12b, license: CeCILL-C}
      - {path: external_libs, project: "other bundled libraries (ADIOS glue, ...)", license: "per directory"}
environment_provided:
  - {name: CUDA Toolkit, version: 13.2.78}
  - {name: GCC 13.3.0 (conda, C + nvcc host) and system gfortran 14.2.1, provided_by: .conda_env / node}
  - {name: Open MPI, version: 5.0.10, provided_by: .conda_env}
equivalence:
  - archive_path: src
    validated_tree: .deps/level3/specfem3d/src        # patched private copy (in-tree autotools build)
    # build artifacts of the in-tree autotools build (only ever present in the validated copy): objects,
    # binaries, configure outputs, generated headers under setup/, SCOTCH's in-tree build products
    ignore: ['obj/*', 'bin/*', 'OUTPUT_FILES/*', 'config.log', 'config.status', 'Makefile', 'setup/*', '*.o', '*.a', '*.mod',
             'external_libs/scotch_5.1.12b/bin/*', 'external_libs/scotch_5.1.12b/lib/*', 'external_libs/scotch_5.1.12b/include/*',
             'external_libs/scotch_5.1.12b/src/Makefile.inc', 'external_libs/scotch_5.1.12b/src/libscotch/*', 'external_libs/scotch_5.1.12b/src/scotch/*']
    # DATA/{CMTSOLUTION,Par_file,STATIONS} are symlinks into EXAMPLES/ in the upstream tree; the in-tree build
    # (configure/make) replaced them by regular copies in the validated copy. The benchmark never reads the
    # top-level DATA/ (run.sh copies the example's own DATA/ into every run directory) -- build-time artifact.
    generated: ['DATA/CMTSOLUTION', 'DATA/Par_file', 'DATA/STATIONS']
    # the private copy was made with `rsync --exclude doc`, which also dropped SCOTCH's doc/ directory
    # (its CeCILL-C license texts + manuals); the bundle keeps them (license files must ship) -- documentation only
    added: ['external_libs/scotch_5.1.12b/doc/*']
licenses:
  - {path: src, project: SPECFEM3D Cartesian, license: GPL-3.0-or-later, url: https://github.com/SPECFEM/specfem3d, commit: c67d3ae7d4bfc5ac75cb9e5601d93afa262d3d8d}
  - {path: src/external_libs/scotch_5.1.12b, project: SCOTCH (bundled), license: CeCILL-C, url: https://gitlab.inria.fr/scotch/scotch, version: 5.1.12b}
license_notes:
  - "SPECFEM3D is GPL (see LICENSE); redistribution of the complete source with the two back-ported devel patches (also GPL) is permitted; the diff is recorded in provenance/original_vs_baseline.diff."
  - "SCOTCH 5.1.12b is bundled by upstream under CeCILL-C (LGPL-compatible free software license); its own license file stays in the tree."
  - "EXAMPLES/ (meshes, reference seismograms used by validate.sh) are upstream repository content; doc/ is excluded (documentation only)."
